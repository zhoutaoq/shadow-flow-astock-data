# 构建信息：由 maven-resources-plugin 在打包时做变量替换（见 pom.xml 的 <resources>）。
# 页面页脚展示的版本号与发布时间读这里，不写死在 HTML 里。
#
# 注意必须用 @...@ 而不是 ${...}：spring-boot-starter-parent 把 resources 的
# 定界符配置成了 @，${} 不会被替换（会原样打进包，运行时被兜底逻辑识别成未替换）。
#
# build.time 取 maven.build.timestamp，是 UTC 时刻（ISO-8601，尾部 Z，见 pom 的
# maven.build.timestamp.format）；展示时由 VersionController 转成北京时间。
build.version=@project.version@
build.time=@maven.build.timestamp@
