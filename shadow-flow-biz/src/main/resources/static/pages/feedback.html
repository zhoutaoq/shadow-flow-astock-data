<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{var t=localStorage.getItem("shadowflow_theme")||localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <title>问题反馈</title>
    <link rel="stylesheet" href="/css/common.css?v=20261011d">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">影流数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <section class="panel fb-panel" id="fbPanel">
        <div class="cfg-panel-head">
            <h2 style="margin:0">问题反馈</h2>
        </div>
        <div class="field fb-field">
            <textarea id="fContent" maxlength="500" spellcheck="false"
                      aria-label="反馈内容" placeholder="请输入内容"></textarea>
        </div>
        <div class="fb-meta">
            <span class="fb-count" id="fbCount">0 / 500</span>
            <span class="fb-actions">
                <button class="btn-ghost" onclick="clearFeedback()">清空</button>
                <button id="fbSubmit" onclick="submitFeedback()">提交</button>
            </span>
        </div>
    </section>

    <section class="panel" id="fbClosedPanel" style="display:none">
        <h2>问题反馈</h2>
        <div class="msg msg-err" style="display:block">
            反馈入口暂时关闭，有急事请直接联系管理员。
        </div>
    </section>
</main>

<script src="/js/common.js?v=20261011d"></script>
<script>
    /* 服务端没取到限制参数时的兜底值，与 application.yml 的默认值一致 */
    var FB = {enabled: true, maxLength: 500, cooldownSeconds: 30};

    var contentEl = document.getElementById('fContent');
    var submitBtn = document.getElementById('fbSubmit');

    function updateCount() {
        var n = contentEl.value.length;
        var el = document.getElementById('fbCount');
        el.textContent = n + ' / ' + FB.maxLength;
        el.classList.toggle('over', n > FB.maxLength);
        submitBtn.disabled = n === 0 || n > FB.maxLength;
    }

    function clearFeedback() {
        if (!contentEl.value) {
            return;
        }
        contentEl.value = '';
        updateCount();
        contentEl.focus();
    }

    async function submitFeedback() {
        var content = contentEl.value.trim();
        if (!content) {
            toast('先写点内容再提交', 'err');
            contentEl.focus();
            return;
        }
        if (content.length > FB.maxLength) {
            toast('内容最多 ' + FB.maxLength + ' 字，精简一下再提交', 'err');
            return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = '提交中…';
        try {
            var r = await post('/api/feedback', {content: content});
            if (r.success) {
                contentEl.value = '';
                toast(r.message || '已收到，谢谢反馈', 'ok');
            }
        } finally {
            submitBtn.textContent = '提交';
            updateCount();
        }
    }

    contentEl.addEventListener('input', updateCount);
    // Ctrl / Cmd + Enter 直接提交，长文本不用再去找按钮
    contentEl.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            submitFeedback();
        }
    });

    (async function init() {
        try {
            var r = await get('/api/feedback/limits');
            if (r && r.success && r.data) {
                FB = Object.assign(FB, r.data);
            }
        } catch (e) {
            /* 取不到就按内置默认值，提交时后端仍会兜住 */
        }
        if (!FB.enabled) {
            document.getElementById('fbPanel').style.display = 'none';
            document.getElementById('fbClosedPanel').style.display = '';
            return;
        }
        contentEl.setAttribute('maxlength', String(FB.maxLength));
        updateCount();
    })();
</script>
</body>
</html>
