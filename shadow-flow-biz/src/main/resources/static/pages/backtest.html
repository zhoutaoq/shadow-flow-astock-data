<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{var t=localStorage.getItem("shadowflow_theme")||localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <title>策略回测 - 影流数据</title>
    <link rel="stylesheet" href="/css/common.css?v=20261020a">
    <link rel="stylesheet" href="/css/backtest.css?v=20261011e">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">影流数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <section class="panel">
        <div class="cfg-panel-head">
            <h2 style="margin:0">回测配置</h2>
            <div class="cfg-panel-actions">
                <button onclick="runBacktest()" id="btnRun">开始回测</button>
                <button class="btn-ghost" onclick="exportConfig()">导出配置</button>
                <button class="btn-ghost" onclick="document.getElementById('fileImport').click()">导入配置</button>
                <input type="file" id="fileImport" accept="application/json,.json" style="display:none"
                       onchange="importConfig(this)">
            </div>
        </div>
        <div class="cfg-grid">
            <!-- 1 回测对象 -->
            <div class="cfg-card c1">
                <div class="cfg-head"><span class="cfg-idx">1</span>回测对象<span class="cfg-tag">标的 · 账户</span></div>
                <div class="field">
                    <label>股票 *</label>
                    <div id="codePick"></div>
                </div>
                <div class="cfg-sub">账户</div>
                <div class="field">
                    <label>账户起始金额 *</label>
                    <input type="number" id="fInit" value="100000" min="1" step="1000">
                </div>
                <div class="field">
                    <label>手续费滑点 *</label>
                    <input type="number" id="fFee" value="0.01" min="0" step="0.001">
                    <div class="sp-hint">单位 %</div>
                </div>
            </div>

            <!-- 2 时间范围 -->
            <div class="cfg-card c2">
                <div class="cfg-head"><span class="cfg-idx">4</span>时间范围<span class="cfg-tag">起止 · 跨度</span></div>
                <div class="field">
                    <label>开始日期 *</label>
                    <input type="date" id="fStart">
                </div>
                <div class="field">
                    <label>结束日期 *</label>
                    <input type="date" id="fEnd">
                </div>
                <div class="cfg-sub">快捷区间</div>
                <div class="quick-range" style="display:flex;gap:6px;flex-wrap:wrap">
                    <button class="btn-ghost btn-sm" data-days="90" onclick="setRange(90)">近3月</button>
                    <button class="btn-ghost btn-sm" data-days="180" onclick="setRange(180)">近半年</button>
                    <button class="btn-ghost btn-sm" data-days="365" onclick="setRange(365)">近1年</button>
                    <button class="btn-ghost btn-sm" data-days="1095" onclick="setRange(1095)">近3年</button>
                    <button class="btn-ghost btn-sm" data-days="1825" onclick="setRange(1825)">近5年</button>
                    <button class="btn-ghost btn-sm" data-days="3650" onclick="setRange(3650)">近10年</button>
                </div>
                <div class="sp-hint" id="spanHint"></div>
            </div>

            <!-- 3 买入策略 -->
            <div class="cfg-card c3">
                <div class="cfg-head">
                    <span class="cfg-idx">2</span>买入策略<span class="cfg-tag">全仓买入</span>
                </div>
                <div class="logic-row">
                    <span class="logic-label">组合</span>
                    <div class="logic-seg" id="buyLogicSeg">
                        <button type="button" data-v="and" class="on">全部满足</button>
                        <button type="button" data-v="or">任一满足</button>
                    </div>
                    <select id="buyLogic" style="display:none">
                        <option value="and" selected>且（全部满足才买入）</option>
                        <option value="or">或（任一满足即买入）</option>
                    </select>
                </div>
                <div class="cond-box" id="buyConds"></div>
                <div class="cond-foot">
                    <button class="btn-ghost btn-sm" id="buyAdd" onclick="addCond('buy')">+ 添加判断组件</button>
                    <span class="cond-count" id="buyCount"></span>
                </div>
            </div>

            <!-- 4 卖出策略 -->
            <div class="cfg-card c4">
                <div class="cfg-head">
                    <span class="cfg-idx">5</span>卖出策略<span class="cfg-tag">全仓卖出</span>
                </div>
                <div class="logic-row">
                    <span class="logic-label">组合</span>
                    <div class="logic-seg" id="sellLogicSeg">
                        <button type="button" data-v="and" class="on">全部满足</button>
                        <button type="button" data-v="or">任一满足</button>
                    </div>
                    <select id="sellLogic" style="display:none">
                        <option value="and" selected>且（全部满足才卖出）</option>
                        <option value="or">或（任一满足即卖出）</option>
                    </select>
                </div>
                <div class="cond-box" id="sellConds"></div>
                <div class="cond-foot">
                    <button class="btn-ghost btn-sm" id="sellAdd" onclick="addCond('sell')">+ 添加判断组件</button>
                    <span class="cond-count" id="sellCount"></span>
                </div>
            </div>

            <!-- 5 买入涨跌停成交 -->
            <div class="cfg-card c5">
                <div class="cfg-head"><span class="cfg-idx">3</span>买点买入失败（涨停板）次日策略</div>
                <div class="limit-radio" id="buyLimitRadio">
                    <button type="button" data-strategy="1" class="on">无视<small>按收盘价买入</small></button>
                    <button type="button" data-strategy="2">次日开盘<small>非涨停即买</small></button>
                    <button type="button" data-strategy="3">次日开盘<small>达条件才买</small></button>
                </div>
                <div class="limit-conds" id="buyLimitConds">
                    <div class="limit-conds-note">次日开盘涨跌幅
                        <span class="sep">或</span></div>
                    <div id="buyLimitRows"></div>
                    <button type="button" class="btn-ghost btn-sm limit-add" id="buyLimitAdd"
                            onclick="addLimitCond('buy')">+ 添加条件</button>
                </div>
            </div>

            <!-- 6 卖出涨跌停成交 -->
            <div class="cfg-card c6">
                <div class="cfg-head"><span class="cfg-idx">6</span>卖点卖出失败（跌停板）次日策略</div>
                <div class="limit-radio" id="sellLimitRadio">
                    <button type="button" data-strategy="1" class="on">无视<small>按收盘价卖出</small></button>
                    <button type="button" data-strategy="2">次日开盘<small>非跌停即卖</small></button>
                    <button type="button" data-strategy="3">次日开盘<small>达条件才卖</small></button>
                </div>
                <div class="limit-conds" id="sellLimitConds">
                    <div class="limit-conds-note">次日开盘涨跌幅
                        <span class="sep">或</span></div>
                    <div id="sellLimitRows"></div>
                    <button type="button" class="btn-ghost btn-sm limit-add" id="sellLimitAdd"
                            onclick="addLimitCond('sell')">+ 添加条件</button>
                </div>
            </div>
        </div>

        <div class="form-row" style="margin-top:14px">
            <span class="dim" id="hint"></span>
        </div>
        <div id="progressBox" style="display:none;margin-top:10px">
            <div style="display:flex;align-items:center;gap:10px">
                <div style="flex:1;height:10px;background:#232b3d;border-radius:5px;overflow:hidden">
                    <div id="progressBar" style="width:0%;height:100%;background:#4c8dff;transition:width .2s"></div>
                </div>
                <span class="dim" id="progressText" style="min-width:44px">0%</span>
            </div>
            <div class="sp-hint" id="progressMsg"></div>
        </div>
    </section>

    <section class="panel" id="resultPanel" style="display:none">
        <h2>回测结果</h2>
        <div id="summary"></div>

        <h3>回测策略</h3>
        <div id="strategy" class="strategy"></div>

        <h3>阶段K线（含成交量、买卖点）</h3>
        <!-- 明细表格都收进弹窗，按钮统一放在 K 线图上方 -->
        <div class="tile-row">
            <button class="tile" onclick="openDaily()">
                <b>每日账户</b>
                <span class="dim" id="dailyCount">0 行</span>
                <span class="arrow">点击展开 ›</span>
            </button>
            <button class="tile" onclick="openTrades()">
                <b>买卖明细</b>
                <span class="dim" id="tradeCount">0 笔</span>
                <span class="arrow">点击展开 ›</span>
            </button>
        </div>
        <div id="klineChart" class="chart-box"></div>

        <h3>盈亏走势</h3>
        <div class="chart-ctrl">
            <span class="dim">选择展示曲线</span>
            <label class="chk">
                <input type="checkbox" id="sAmount" checked onchange="renderProfit()">
                <span class="dot" style="background:#e5a00d"></span>盈亏金额
            </label>
            <label class="chk">
                <input type="checkbox" id="sRatio" checked onchange="renderProfit()">
                <span class="dot" style="background:#4c8dff"></span>盈亏比例
            </label>
            <label class="chk">
                <input type="checkbox" id="sPrincipal" onchange="renderProfit()">
                <span class="dot" style="background:#a371f7"></span>本金走势
            </label>
        </div>
        <div id="profitChart" class="chart-box small"></div>
    </section>

    <!-- 无数据库模式回测不落盘，没有历史可查，整块隐藏 -->
    <section class="panel" id="histPanel">
        <h2>历史回测</h2>
        <div style="overflow:auto">
            <table class="grid">
                <thead>
                <tr>
                    <th>股票</th>
                    <th>区间</th>
                    <th class="num">起始金额</th>
                    <th class="num">期末金额</th>
                    <th class="num">盈亏</th>
                    <th class="num">盈亏比例</th>
                    <th class="num">成交</th>
                    <th>回测时间</th>
                    <th class="ops">操作</th>
                </tr>
                </thead>
                <tbody id="histBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="/vendor/echarts.min.js"></script>
<script src="/js/common.js?v=20261020a"></script>
<script src="/js/date-picker.js?v=20261011e"></script>
<script src="/js/stock-picker.js?v=20261011e"></script>
<script>
    const UP = '#e5484d';    // 涨/买入：红
    const DOWN = '#2ea043';  // 跌/卖出：绿

    /** 买入/卖出的判断组件（x 为页面百分数，提交时换算成小数） */
    const conds = {
        buy: [{type: 'CLOSE_MA', op: 'gt', n: 5, m: 20, x: 3, ratio: 1.5}],
        sell: [{type: 'ABOVE_MA_DAYS', op: 'lt', n: 2, m: 20, x: 3, ratio: 1.5}]
    };

    /** 单侧判断组件上限：卡片高度按这个数量固定，再多会撑破布局 */
    const MAX_CONDS = 4;

    /**
     * 涨跌停成交配置（买入/卖出各一份）。
     * strategy：1 无视、2 次日开盘即成交、3 次日开盘满足阈值组合才成交。
     * conds：策略 3 的阈值条件，最多 2 条、条间为「或」；ratio 为页面百分数，提交换算成小数。
     */
    const limits = {
        buy:  {strategy: 1, conds: [{dir: 'gt', op: 'gt', ratio: 3}]},
        sell: {strategy: 1, conds: [{dir: 'gt', op: 'gt', ratio: 3}]}
    };
    /** 单侧涨跌停阈值条件上限 */
    const MAX_LIMIT_CONDS = 2;

    /** 最近一次回测结果：弹窗与曲线勾选都要从它重新渲染 */
    let lastResult = null;
    /** 每日账户 / 买卖明细的缓存：表格收起后只在弹窗里分页展示 */
    let lastDailies = [];
    let lastTrades = [];

    let codePicker;
    let klineChart;
    let profitChart;

    document.getElementById('fStart').value = daysAgo(180);
    document.getElementById('fEnd').value = today();

    codePicker = createStockPicker(document.getElementById('codePick'), {});

    function setRange(n) {
        document.getElementById('fStart').value = daysAgo(n);
        document.getElementById('fEnd').value = today();
        renderSpanHint();
    }

    /** 快捷区间的选中态：当前跨度与按钮一致、且结束日是今天时高亮 */
    function markRange() {
        const end = document.getElementById('fEnd').value;
        const a = parseYmd(document.getElementById('fStart').value);
        const b = parseYmd(end);
        const span = (a && b) ? Math.round((b - a) / 86400000) + 1 : 0;
        const btns = document.querySelectorAll('.quick-range button');
        for (let i = 0; i < btns.length; i++) {
            const d = parseInt(btns[i].getAttribute('data-days'), 10);
            const hit = span > 0 && d === span && end === today();
            btns[i].classList.toggle('active', !!hit);
        }
    }

    /** 时间跨度提示：无数据库模式有跨度上限，先在本地说清楚 */
    function renderSpanHint() {
        markRange();
        const s = document.getElementById('fStart').value;
        const e = document.getElementById('fEnd').value;
        const el = document.getElementById('spanHint');
        const a = parseYmd(s);
        const b = parseYmd(e);
        if (!a || !b) {
            el.textContent = '';
            return;
        }
        const span = Math.round((b - a) / 86400000) + 1;
        if (span <= 0) {
            el.innerHTML = '<span class="up">开始日期不能晚于结束日期</span>';
            return;
        }
        el.innerHTML = MODE.noDb
            ? `跨度 ${span} 个自然日（上限 ${MODE.maxSpanDays} 天）`
            : `跨度 ${span} 个自然日`;
        if (MODE.noDb && span > MODE.maxSpanDays) {
            el.innerHTML += ' · <span class="up">已超限，请缩短区间</span>';
        }
    }

    // ============ 策略组件编辑 ============

    function addCond(side) {
        if (conds[side].length >= MAX_CONDS) {
            return toast(`买入/卖出策略最多 ${MAX_CONDS} 个判断组件`, 'err');
        }
        conds[side].push({type: 'CHANGE', op: 'gt', n: 5, m: 20, x: 3, ratio: 1.5});
        // 增量追加：只插入新行（带入场动画），不动已有行 → 不闪
        const box = document.getElementById(side + 'Conds');
        const empty = box.querySelector('.cond-empty');
        if (empty) empty.remove();
        const i = conds[side].length - 1;
        const wrap = document.createElement('div');
        wrap.innerHTML = condRow(side, i, conds[side][i]);
        const row = wrap.firstElementChild;
        row.classList.add('fresh');   // 新行才走入场动画
        box.appendChild(row);
        updateCondCount(side);
    }

    function delCond(side, i) {
        const box = document.getElementById(side + 'Conds');
        const row = box.querySelector('.cond-row[data-i="' + i + '"]');
        if (row) row.remove();         // 只删当前行 DOM
        conds[side].splice(i, 1);
        // 后面行的 data-i 需要 -1，保证 × 删除时拿到的是新下标
        Array.from(box.querySelectorAll('.cond-row')).forEach(r => {
            const oldI = Number(r.getAttribute('data-i'));
            if (oldI > i) {
                r.setAttribute('data-i', oldI - 1);
                // 同时把按钮里 hardcode 的 onclick 索引一并刷新
                const xBtn = r.querySelector('.cond-x');
                if (xBtn) xBtn.setAttribute('onclick', "delCond('" + side + "'," + (oldI - 1) + ")");
            }
        });
        // 列表空了补个占位
        if (!conds[side].length) {
            box.innerHTML = '<div class="cond-empty">还没有判断组件，点下方按钮新增</div>';
        }
        updateCondCount(side);
    }

    /**
     * 改一个判断组件的字段。
     * - type 变了：控件组合变了（如近N日涨跌幅 → 连续N日站上），必须重画该行。
     * - 其它字段（op/n/m/x/ratio）：只更新数据 + 受影响的 input/select value，
     *   不动 DOM、不触发动画，敲数字时整组不闪，光标不丢。
     */
    function updateCond(side, i, key, value) {
        conds[side][i][key] = value;
        const box = document.getElementById(side + 'Conds');
        const row = box.querySelector('.cond-row[data-i="' + i + '"]');
        if (!row) return;
        if (key === 'type') {
            // 控件组合变了，整行重画（不带 fresh 动画，避免闪烁）
            const tmp = document.createElement('div');
            tmp.innerHTML = condRow(side, i, conds[side][i]);
            const fresh = tmp.firstElementChild;
            row.replaceWith(fresh);
            // 重新绑定内部事件用的 data-i
            fresh.setAttribute('data-i', i);
            rebindCondRow(fresh, side, i);
            return;
        }
        if (key === 'op') {
            // 大于/小于 在策略行里是 button chip（不是 select/input），
            // syncCondField 只扫 select/input 扫不到它 → 必须单独切换高亮
            syncOpChips(row, value);
        }
        // 其余字段：n / m / x / ratio → 直接同步 DOM 值
        syncCondField(row, key, value);
    }

    /** 切换某一行「大于/小于」chip 的选中态（chip 是 button，不进 syncCondField 的 select/input 扫描） */
    function syncOpChips(row, op) {
        row.querySelectorAll('.cond-op button[data-op]').forEach(b =>
            b.classList.toggle('on', b.getAttribute('data-op') === op));
    }

    /** 把 condRow 模板里 inline onclick 的索引校正到当前下标 i（用于 delCond 后行序前移） */
    function rebindCondRow(row, side, i) {
        // typeSel 的 onchange 已经由模板生成时写了 i，这里一般一致；只在初始化异常时兜底
        row.querySelectorAll('select, input').forEach(el => {
            const oc = el.getAttribute('onchange');
            if (!oc) return;
            // 形如 updateCond('buy',2,'n',Number(this.value)) → 把第二个参数改成 i
            el.setAttribute('onchange', oc.replace(/updateCond\('([^']+)',\d+,/, "updateCond('$1'," + i + ","));
        });
        const xBtn = row.querySelector('.cond-x');
        if (xBtn) xBtn.setAttribute('onclick', "delCond('" + side + "'," + i + ")");
    }

    /**
     * 局部更新某个字段对应的 DOM value，不重建行。
     * 注意：用户敲数字时 onchange 才触发（input 输入中浏览器不触发），所以这里写 value 不会覆盖正在输入的内容。
     */
    function syncCondField(row, key, value) {
        const c = value;
        const setVal = (el, v) => { if (el && el.value !== String(v)) el.value = v; };
        // 通过 onchange 字符串里的 key 名反查 input；模板里固定 order，遍历匹配即可
        row.querySelectorAll('select, input').forEach(el => {
            const oc = el.getAttribute('onchange') || '';
            const m = oc.match(/updateCond\('[^']+',\d+,'([^']+)'/);
            if (m && m[1] === key) setVal(el, c);
        });
    }

    function updateCondCount(side) {
        const n = conds[side].length;
        const full = n >= MAX_CONDS;
        document.getElementById(side + 'Add').disabled = full;
        const cnt = document.getElementById(side + 'Count');
        cnt.textContent = n + '/' + MAX_CONDS + (full ? ' 已上限' : '');
        cnt.classList.toggle('full', full);
    }

    /** 全量重画仅用于：导入配置（applyRule）、首次 init、reset 等"整体重建"场景 */
    function renderConds(side) {
        const box = document.getElementById(side + 'Conds');
        if (!conds[side].length) {
            box.innerHTML = '<div class="cond-empty">还没有判断组件，点下方按钮新增</div>';
        } else {
            // 一次性写入，模板里硬编码 data-i
            box.innerHTML = conds[side].map((c, i) => condRow(side, i, c)).join('');
        }
        updateCondCount(side);
    }

    /** 单个判断组件：上行「序号 + 类型 chips」均分撑满，下行「参数」输入框弹性撑满 */
    function condRow(side, i, c) {
        // 类型 chips：4 个中文短标签等分排满上行；hover 看 tooltip 拿全名
        const types = [
            {v: 'CHANGE',        t: '涨跌幅', full: '近N日涨跌幅'},
            {v: 'ABOVE_MA_DAYS', t: '站均线', full: '连续N日站上/跌破均线'},
            {v: 'VOLUME_MA',     t: '量能比', full: '成交量倍数'},
            {v: 'CLOSE_MA',      t: '收盘价', full: '收盘价与均线'}
        ];
        const typeChips = `<div class="cond-types" role="tablist">
            ${types.map(t => `<button type="button" data-type="${t.v}"
                class="${c.type === t.v ? 'on' : ''}" title="${t.full}"
                onclick="updateCond('${side}',${i},'type','${t.v}')">${t.t}</button>`).join('')}
        </div>`;
        // 操作符（大于/小于）也改成 chip：没有 native select 默认 120px 的视觉占地
        const opChips = `<div class="cond-op" role="tablist">
            <button type="button" data-op="gt" class="${c.op === 'gt' ? 'on' : ''}"
                onclick="updateCond('${side}',${i},'op','gt')">大于</button>
            <button type="button" data-op="lt" class="${c.op === 'lt' ? 'on' : ''}"
                onclick="updateCond('${side}',${i},'op','lt')">小于</button>
        </div>`;
        const num = (key, val, min) =>
            `<input type="number" value="${val}" min="${min}" step="1"
                onchange="updateCond('${side}',${i},'${key}',Number(this.value))">`;

        let main;
        if (c.type === 'CHANGE') {
            // "近 N 日 涨跌幅 大于 X %"
            main = `<span class="cond-lbl">近</span>${num('n', c.n, 1)}
                    <span class="cond-lbl">日</span>${opChips}
                    <input type="number" value="${c.x}" step="0.1"
                        onchange="updateCond('${side}',${i},'x',Number(this.value))">
                    <span class="cond-lbl">%</span>`;
        } else if (c.type === 'ABOVE_MA_DAYS') {
            // "连续 N 日 < M 均线"
            main = `<span class="cond-lbl">连续</span>${num('n', c.n, 1)}
                    ${opChips}${num('m', c.m, 1)}
                    <span class="cond-lbl">均线</span>`;
        } else if (c.type === 'VOLUME_MA') {
            // "量 > 前 N 日 R 倍"
            main = `<span class="cond-lbl">量</span>${opChips}
                    <span class="cond-lbl">前</span>${num('n', c.n, 1)}
                    <span class="cond-lbl">日</span>
                    <input type="number" value="${c.ratio}" min="0" step="0.1"
                        onchange="updateCond('${side}',${i},'ratio',Number(this.value))">
                    <span class="cond-lbl">倍</span>`;
        } else {
            // "收 > N 均线"
            main = `<span class="cond-lbl">收</span>${opChips}${num('n', c.n, 1)}
                    <span class="cond-lbl">均线</span>`;
        }
        return `<div class="cond-row" data-i="${i}">
            <div class="cond-top">
                <span class="cond-idx">${i + 1}</span>
                ${typeChips}
            </div>
            <div class="cond-params">${main}</div>
            <button class="cond-x" title="删除该条件" onclick="delCond('${side}',${i})">×</button>
        </div>`;
    }

    /** 组装策略组：页面百分数 → 小数 */
    function buildRule(side) {
        const list = conds[side].map(c => {
            const o = {type: c.type, op: c.op};
            if (c.type === 'CHANGE') {
                o.n = Number(c.n);
                o.x = Number(c.x) / 100;
            } else if (c.type === 'ABOVE_MA_DAYS') {
                o.n = Number(c.n);
                o.m = Number(c.m);
            } else if (c.type === 'VOLUME_MA') {
                o.n = Number(c.n);
                o.ratio = Number(c.ratio);
            } else {
                o.n = Number(c.n);
            }
            return o;
        });
        return {logic: document.getElementById(side + 'Logic').value, conditions: list};
    }

    // ============ 涨跌停成交（策略 3 阈值组合） ============

    /** 单侧涨跌停配置初始化：绑定单选胶囊的点击，并画一次初始态 */
    function initLimits() {
        ['buy', 'sell'].forEach(side => {
            const radio = document.getElementById(side + 'LimitRadio');
            radio.addEventListener('click', e => {
                const btn = e.target.closest('button[data-strategy]');
                if (!btn) return;
                limits[side].strategy = parseInt(btn.getAttribute('data-strategy'), 10);
                renderLimit(side);
            });
        });
    }

    /** 组合关系分段控件：点击写回隐藏 select，让 buildRule 照旧读 value */
    function bindLogics() {
        ['buy', 'sell'].forEach(side => {
            const seg = document.getElementById(side + 'LogicSeg');
            seg.addEventListener('click', e => {
                const b = e.target.closest('button[data-v]');
                if (!b) return;
                document.getElementById(side + 'Logic').value = b.getAttribute('data-v');
                syncLogicSeg(side);
            });
        });
    }

    /** 按当前 select.value 高亮分段（导入/还原配置后也调它） */
    function syncLogicSeg(side) {
        const v = document.getElementById(side + 'Logic').value || 'and';
        document.querySelectorAll('#' + side + 'LogicSeg button[data-v]')
            .forEach(b => b.classList.toggle('on', b.getAttribute('data-v') === v));
    }

    /** 画某一侧的涨跌停面板：单选高亮 + 策略 3 才展开条件组 */
    function renderLimit(side) {
        const l = limits[side];
        const radio = document.getElementById(side + 'LimitRadio');
        const btns = radio.querySelectorAll('button[data-strategy]');
        btns.forEach(b => b.classList.toggle('on', parseInt(b.getAttribute('data-strategy'), 10) === l.strategy));

        const condsBox = document.getElementById(side + 'LimitConds');
        const showConds = l.strategy === 3;
        condsBox.classList.toggle('show', showConds);
        if (!showConds) return;

        const rows = document.getElementById(side + 'LimitRows');
        rows.innerHTML = l.conds.map((c, i) => limitCondRow(side, i, c)).join('');
        document.getElementById(side + 'LimitAdd').disabled = l.conds.length >= MAX_LIMIT_CONDS;
    }

    /** 单条阈值条件行：涨跌幅方向 + 大于/小于 + 数值(%)，删按钮靠右 */
    function limitCondRow(side, i, c) {
        const dirSel = `<select onchange="updateLimitCond('${side}',${i},'dir',this.value)">
            <option value="gt"${c.dir === 'gt' ? ' selected' : ''}>涨幅</option>
            <option value="lt"${c.dir === 'lt' ? ' selected' : ''}>跌幅</option>
        </select>`;
        const opSel = `<select onchange="updateLimitCond('${side}',${i},'op',this.value)">
            <option value="gt"${c.op === 'gt' ? ' selected' : ''}>大于</option>
            <option value="lt"${c.op === 'lt' ? ' selected' : ''}>小于</option>
        </select>`;
        return `<div class="limit-cond" data-i="${i}">
            <span class="lbl">次日开盘</span>
            ${dirSel}
            ${opSel}
            <input type="number" value="${c.ratio}" min="0" step="0.1"
                onchange="updateLimitCond('${side}',${i},'ratio',Number(this.value))">
            <span class="pct">%</span>
            <span class="grow"></span>
            <button type="button" class="btn-ghost del" onclick="delLimitCond('${side}',${i})">删</button>
        </div>`;
    }

    function addLimitCond(side) {
        if (limits[side].conds.length >= MAX_LIMIT_CONDS) {
            return toast('涨跌停阈值条件最多 ' + MAX_LIMIT_CONDS + ' 条', 'err');
        }
        limits[side].conds.push({dir: 'gt', op: 'gt', ratio: 3});
        // 增量追加：只在容器里插一行，不重画其它条件
        const rows = document.getElementById(side + 'LimitRows');
        const i = limits[side].conds.length - 1;
        const wrap = document.createElement('div');
        wrap.innerHTML = limitCondRow(side, i, limits[side].conds[i]);
        const row = wrap.firstElementChild;
        row.classList.add('fresh');
        rows.appendChild(row);
        document.getElementById(side + 'LimitAdd').disabled = limits[side].conds.length >= MAX_LIMIT_CONDS;
    }

    function delLimitCond(side, i) {
        const rows = document.getElementById(side + 'LimitRows');
        const row = rows.querySelector('.limit-cond[data-i="' + i + '"]');
        if (row) row.remove();
        limits[side].conds.splice(i, 1);
        // 后面行 data-i 前移
        Array.from(rows.querySelectorAll('.limit-cond')).forEach(r => {
            const oldI = Number(r.getAttribute('data-i'));
            if (oldI > i) {
                r.setAttribute('data-i', oldI - 1);
                r.querySelectorAll('select, input').forEach(el => {
                    const oc = el.getAttribute('onchange');
                    if (oc) el.setAttribute('onchange',
                        oc.replace(/updateLimitCond\('([^']+)',\d+,/, "updateLimitCond('$1'," + (oldI - 1) + ","));
                });
                const delBtn = r.querySelector('.del');
                if (delBtn) delBtn.setAttribute('onclick', "delLimitCond('" + side + "'," + (oldI - 1) + ")");
            }
        });
        document.getElementById(side + 'LimitAdd').disabled = limits[side].conds.length >= MAX_LIMIT_CONDS;
    }

    /** 涨跌停条件的字段结构稳定（dir/op/ratio），不重画，只同步 DOM value */
    function updateLimitCond(side, i, key, value) {
        limits[side].conds[i][key] = value;
        const rows = document.getElementById(side + 'LimitRows');
        const row = rows.querySelector('.limit-cond[data-i="' + i + '"]');
        if (!row) return;
        row.querySelectorAll('select, input').forEach(el => {
            const oc = el.getAttribute('onchange') || '';
            const m = oc.match(/updateLimitCond\('[^']+',\d+,'([^']+)'/);
            if (m && m[1] === key && el.value !== String(value)) el.value = value;
        });
    }

    /** 读取某一侧卡片上的涨跌停成交配置（策略 3 阈值小数化），提交给后端 */
    function buildLimitCfg(side) {
        const l = limits[side];
        const cfg = {strategy: l.strategy};
        if (l.strategy === 3) {
            cfg.conds = l.conds.map(c => ({
                dir: c.dir,
                op: c.op,
                ratio: Number(c.ratio) / 100
            }));
        }
        return cfg;
    }

    /** 策略 3 至少要一条有效条件（数值为不小于 0 的数） */
    function limitCfgValid(cfg) {
        return !!(cfg.conds && cfg.conds.length) &&
            cfg.conds.every(c => !(c.ratio == null) && !isNaN(c.ratio) && c.ratio >= 0);
    }

    /** 把涨跌停配置还原到某一侧：兼容新版 conds[]，也兼容旧版单条 op/ratio */
    function applyLimitCfg(side, cfg) {
        if (!cfg) return;
        const l = limits[side];
        if (cfg.strategy != null) l.strategy = cfg.strategy;
        const src = cfg.conds && cfg.conds.length
            ? cfg.conds
            // 旧格式：strategy=3 时只有单条 {op:'gt'|'lt', ratio(小数)}
            : (cfg.op && cfg.ratio != null
                ? [{dir: cfg.op, op: 'gt', ratio: cfg.ratio}]
                : []);
        if (src.length) {
            l.conds = src.slice(0, MAX_LIMIT_CONDS).map(c => ({
                dir: c.dir || 'gt',
                op: c.op || 'gt',
                ratio: Number(c.ratio) * 100
            }));
        }
        renderLimit(side);
    }

    async function runBacktest() {
        if (!requireStock(codePicker, '一只股票')) return;
        const code = codePicker.getCodes()[0];
        const startDate = document.getElementById('fStart').value;
        const endDate = document.getElementById('fEnd').value;
        const initAmount = Number(document.getElementById('fInit').value);
        const feePct = Number(document.getElementById('fFee').value);

        if (!startDate || !endDate) {
            return toast('请选择回测起止时间', 'err');
        }
        if (startDate > endDate) {
            return toast('开始日期不能晚于结束日期', 'err');
        }
        // 无数据库模式每次查询都是真实请求，跨度先在本地卡住，别等后端报错
        if (MODE.noDb) {
            const span = (parseYmd(endDate) - parseYmd(startDate)) / 86400000 + 1;
            if (span > MODE.maxSpanDays) {
                return toast(`单次回测最多 ${MODE.maxSpanDays} 个自然日，当前 ${span} 天`, 'err');
            }
        }
        if (!(initAmount > 0)) {
            return toast('账户起始金额必须大于 0', 'err');
        }
        if (!(feePct >= 0)) {
            return toast('手续费滑点不能小于 0', 'err');
        }
        if (!conds.buy.length || !conds.sell.length) {
            return toast('买入和卖出策略都至少需要一个判断组件', 'err');
        }
        // 涨跌停：买入、卖出各一份独立配置，各自校验
        const buyLimit = buildLimitCfg('buy');
        const sellLimit = buildLimitCfg('sell');
        if (buyLimit.strategy === 3 && !limitCfgValid(buyLimit)) {
            return toast('买入涨跌停策略 3 至少要一条有效的涨跌幅阈值（数值 ≥ 0）', 'err');
        }
        if (sellLimit.strategy === 3 && !limitCfgValid(sellLimit)) {
            return toast('卖出涨跌停策略 3 至少要一条有效的涨跌幅阈值（数值 ≥ 0）', 'err');
        }

        const btn = document.getElementById('btnRun');
        const hint = document.getElementById('hint');
        btn.disabled = true;
        hint.innerHTML = '<span class="spinner"></span> 回测中...';

        // 回测是同步跑完才返回的：另开一个轮询跟进度，主请求回来就停
        const taskId = 'bt-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        const timer = startProgressPolling(taskId);
        try {
            const r = await post('/api/backtest/run', {
                taskId,
                stockCode: code,
                startDate,
                endDate,
                initAmount,
                feeRate: feePct / 100,
                buyRule: buildRule('buy'),
                sellRule: buildRule('sell'),
                buyLimit: buyLimit,
                sellLimit: sellLimit
            });
            if (r.success) {
                render(r.data);
                loadHistory();
            }
        } finally {
            clearInterval(timer);
            hideProgress();
            btn.disabled = false;
            hint.textContent = '';
        }
    }

    // ============ 进度 ============

    /** 用原生 fetch 查进度：不用 get()，否则接口返回 fail 时会反复弹 toast */
    async function fetchProgress(taskId) {
        try {
            const res = await fetch('/api/backtest/progress/' + taskId);
            const json = await res.json();
            return json && json.success ? json.data : null;
        } catch (e) {
            return null;
        }
    }

    function startProgressPolling(taskId) {
        showProgress(0, '准备中...');
        return setInterval(async () => {
            const p = await fetchProgress(taskId);
            if (!p) return;
            if (p.stage === 'run') {
                updateProgress(p.percent, `已处理 ${p.done}/${p.total} 日`);
            } else if (p.stage === 'fetch') {
                updateProgress(p.percent, p.message || '正在同步缺失的日K数据...');
            } else if (p.stage === 'check') {
                updateProgress(0, p.message || '校验数据完整性...');
            } else if (p.stage === 'done') {
                updateProgress(100, p.message || '回测完成');
            } else if (p.stage === 'error') {
                updateProgress(0, p.message || '回测失败');
            }
        }, 300);
    }

    function showProgress(percent, msg) {
        document.getElementById('progressBox').style.display = '';
        updateProgress(percent, msg);
    }

    function updateProgress(percent, msg) {
        document.getElementById('progressBar').style.width = (percent || 0) + '%';
        document.getElementById('progressText').textContent = (percent || 0) + '%';
        if (msg) document.getElementById('progressMsg').textContent = msg;
    }

    function hideProgress() {
        document.getElementById('progressBox').style.display = 'none';
    }

    // ============ 配置导入导出 ============

    /** 导出：结构与回测接口请求体一致（费率 / 涨幅 / 倍数均为小数） */
    function exportConfig() {
        const codes = codePicker ? codePicker.getCodes() : [];
        const cfg = {
            stockCode: codes.length ? codes[0] : '',
            startDate: document.getElementById('fStart').value,
            endDate: document.getElementById('fEnd').value,
            initAmount: Number(document.getElementById('fInit').value),
            feeRate: Number(document.getElementById('fFee').value) / 100,
            buyRule: buildRule('buy'),
            sellRule: buildRule('sell'),
            buyLimit: buildLimitCfg('buy'),
            sellLimit: buildLimitCfg('sell')
        };
        const blob = new Blob([JSON.stringify(cfg, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'backtest-' + (cfg.stockCode || 'config') + '-' + today() + '.json';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    /** 导入：文件里的小数换算回页面显示值（费率 ×100、涨幅 ×100、倍数原样） */
    async function importConfig(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
            const cfg = JSON.parse(await file.text());
            if (!cfg || typeof cfg !== 'object') {
                throw new Error('文件内容不是有效的配置对象');
            }
            if (cfg.startDate) document.getElementById('fStart').value = cfg.startDate;
            if (cfg.endDate) document.getElementById('fEnd').value = cfg.endDate;
            if (cfg.initAmount != null) document.getElementById('fInit').value = cfg.initAmount;
            if (cfg.feeRate != null) document.getElementById('fFee').value = Number(cfg.feeRate) * 100;
            if (cfg.buyRule) applyRule('buy', cfg.buyRule);
            if (cfg.sellRule) applyRule('sell', cfg.sellRule);
            // 涨跌停：现版本买卖各一份；老配置只有一份 limitStrategy 时两边都套用
            if (cfg.buyLimit || cfg.sellLimit || cfg.limitStrategy != null) {
                const legacy = cfg.limitStrategy != null
                    ? {strategy: cfg.limitStrategy, op: cfg.limitOp, ratio: cfg.limitRatio}
                    : null;
                applyLimitCfg('buy', cfg.buyLimit || legacy);
                applyLimitCfg('sell', cfg.sellLimit || legacy);
            }
            if (cfg.stockCode) {
                codePicker.clear();
                await codePicker.pickByCode(cfg.stockCode);
            }
            renderSpanHint();
            toast('配置已导入', 'ok');
        } catch (e) {
            toast('配置导入失败: ' + e.message, 'err');
        } finally {
            // 清空 value，否则连续导入同一个文件不会再触发 change
            input.value = '';
        }
    }

    /** 把策略组还原到页面：小数 → 百分数 / 倍数；超过上限的组件直接丢弃 */
    function applyRule(side, rule) {
        if (rule.logic) document.getElementById(side + 'Logic').value = rule.logic;
        syncLogicSeg(side);
        const list = (rule.conditions || []).slice(0, MAX_CONDS);
        if ((rule.conditions || []).length > MAX_CONDS) {
            toast(`${side === 'buy' ? '买入' : '卖出'}策略超过 ${MAX_CONDS} 个组件，多余的已忽略`, 'err');
        }
        conds[side] = list.map(c => ({
            type: c.type || 'CHANGE',
            op: c.op || 'gt',
            n: c.n != null ? Number(c.n) : 5,
            m: c.m != null ? Number(c.m) : 20,
            x: c.x != null ? Number(c.x) * 100 : 3,
            ratio: c.ratio != null ? Number(c.ratio) : 1.5
        }));
        renderConds(side);
    }

    // ============ 结果渲染 ============

    function render(data) {
        lastResult = data;
        const bt = data.backtest;
        document.getElementById('resultPanel').style.display = '';

        const ratio = Number(bt.profitRatio || 0);
        const ratioPct = (ratio * 100).toFixed(2) + '%';
        const cls = ratio >= 0 ? 'up' : 'down';
        document.getElementById('summary').innerHTML = `
            <table class="kv">
                <tr><th>股票</th><td>${stockLinkOf(bt)}</td></tr>
                <tr><th>回测区间</th><td>${esc(bt.startDate)} ~ ${esc(bt.endDate)}（${bt.tradeDays} 个交易日）</td></tr>
                <tr><th>起始金额 / 费率</th><td>${fmtNum(bt.initAmount)} / ${(Number(bt.feeRate) * 100).toFixed(4)}%</td></tr>
                <tr><th>期末账户总额</th><td><b id="sumFinal">0</b></td></tr>
                <tr><th>盈亏金额</th><td class="${cls}"><b id="sumProfit">0</b></td></tr>
                <tr><th>盈亏比例</th><td class="${cls}"><b id="sumRatio">0%</b></td></tr>
                <tr><th>成交笔数</th><td id="sumTrades">0</td></tr>
            </table>`;

        // 关键数字滚动到位：结果不是冷冰冰地跳出来
        const money = v => fmtNum(v);
        rollNumber(document.getElementById('sumFinal'), bt.finalAmount, {fmt: money});
        rollNumber(document.getElementById('sumProfit'), bt.totalProfit, {fmt: money});
        rollNumber(document.getElementById('sumRatio'), ratio * 100, {fmt: v => v.toFixed(2) + '%'});
        rollNumber(document.getElementById('sumTrades'), bt.tradeCount, {fmt: v => String(Math.round(v))});

        renderStrategy(bt);
        renderKline(data.klines || [], data.trades || []);
        renderProfit();
        renderDaily(data.dailies || []);
        renderTrades(data.trades || []);
    }

    /** 「000001 平安银行」：后端回填了 stockName；老数据没有时退回用选择器里选中的名称 */
    function codeWithName(bt) {
        if (!bt) return '';
        const name = bt.stockName
            || (codePicker && codePicker.getFirst() ? codePicker.getFirst().name : '');
        return bt.stockCode + (name ? ' ' + name : '');
    }

    /**
     * 回测标的渲染成全站统一的股票跳转链接。
     *
     * <p>链接文本是「代码 名称」整体，不是只把名称做成链接 ——
     * 回测结果里「000001 平安银行」是一个不可拆的标识，只让后半截变可点很别扭。
     */
    function stockLinkOf(bt) {
        const text = codeWithName(bt);
        if (!bt || !bt.stockCode) {
            return esc(text);
        }
        return stockLinkHtml(bt.stockCode, bt.stockName || '', {text: text});
    }

    /** 结果里说明「这次到底按什么规则跑的」：规则、账户、成交口径 */
    function renderStrategy(bt) {
        const buy = parseRule(bt.buyRule);
        const sell = parseRule(bt.sellRule);
        const feePct = (Number(bt.feeRate || 0) * 100).toFixed(4) + '%';
        document.getElementById('strategy').innerHTML = `
            <div class="strat-line"><span class="k">标的</span><span class="v">
                ${stockLinkOf(bt)}
            </span></div>
            <div class="strat-line"><span class="k">区间</span><span class="v">
                ${esc(bt.startDate)} ~ ${esc(bt.endDate)}
            </span></div>
            <div class="strat-line"><span class="k">账户</span><span class="v">
                起始 ${fmtNum(bt.initAmount)}，手续费滑点 ${feePct}
            </span></div>
            <div class="strat-line"><span class="k">成交口径</span><span class="v">
                全仓 · 100 股整数倍 · 当日收盘价成交
            </span></div>
            <div class="strat-rule"><span class="k">买入（${logicText(buy)}）</span>
                ${ruleList(buy, '空仓且买入策略命中时买入')}</div>
            <div class="strat-rule"><span class="k">卖出（${logicText(sell)}）</span>
                ${ruleList(sell, '持仓且卖出策略命中时清仓')}</div>`;
    }

    /** 落库/回传的策略是 JSON 字符串，历史回看时也能直接读出规则 */
    function parseRule(rule) {
        if (!rule) return null;
        if (typeof rule === 'object') return rule;
        try {
            return JSON.parse(rule);
        } catch (e) {
            return null;
        }
    }

    function logicText(rule) {
        if (!rule) return '未记录';
        return rule.logic === 'or' ? '或：任一满足即触发' : '且：全部满足才触发';
    }

    function ruleList(rule, emptyText) {
        const list = (rule && rule.conditions) || [];
        if (!list.length) return `<ol><li class="dim">${esc(emptyText || '无条件')}</li></ol>`;
        const joiner = rule.logic === 'or' ? '或' : '且';
        return '<ol>' + list.map((c, i) =>
            `<li>${esc(condText(c))}${i < list.length - 1 ? ' <span class="dim">' + joiner + '</span>' : ''}</li>`).join('') + '</ol>';
    }

    /** 单个判断组件 → 中文说明（与回测引擎的判断口径一一对应） */
    function condText(c) {
        const gt = c.op !== 'lt';
        const op = gt ? '大于' : '小于';
        switch (c.type) {
            case 'CHANGE':
                return `近 ${c.n} 个交易日涨幅 ${op} ${fmtNum(Number(c.x) * 100, 2)}%`;
            case 'ABOVE_MA_DAYS':
                return `连续 ${c.n} 个交易日收盘价 ${op} ${c.m} 日线`;
            case 'CLOSE_MA':
                return `收盘价 ${op} ${c.n} 日线`;
            case 'VOLUME_MA':
                return `成交量 ${op} 前 ${c.n} 日平均成交量的 ${c.ratio} 倍`;
            default:
                return c.type || '未知组件';
        }
    }

    /**
     * 均价 = 成交额 / 成交量。
     * 注意单位：行情数据服务的 volume 是「手」、amount 是「元」，1 手 = 100 股，
     * 所以要先把手换成股再除，否则均价会放大 100 倍。
     */
    const LOT = 100;
    function avgPrice(k) {
        const v = Number(k && k.volume);
        const a = Number(k && k.amount);
        if (!v || !a || isNaN(v) || isNaN(a)) return '-';
        return fmtNum(a / (v * LOT), 2);
    }

    /**
     * 相对前收盘的当日涨跌幅（需求 v1.5.5 第 ② 条）。
     *
     * <p>口径与「K线分析」页完全一致：用行上的 {@code preClose} 比，红涨绿跌。
     * 前收盘缺失（行情数据服务没给 pc）时给 {@code -}，不拿开盘价顶替 ——
     * 那会把跳空缺口算成当日涨跌，看着就是错的。
     */
    function pctHtml(k) {
        const pc = k && k.preClose != null ? Number(k.preClose) : 0;
        const close = k && k.closePrice != null ? Number(k.closePrice) : NaN;
        if (!pc || isNaN(close)) return '-';
        const pct = (close - pc) / pc * 100;
        return '<span style="color:' + (pct >= 0 ? UP : DOWN) + '">'
            + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%</span>';
    }

    /** K线 + 成交量 + 买卖点：买点标在最低价下方（红），卖点标在最高价上方（绿） */
    function renderKline(klines, trades) {
        klineChart = klineChart || echarts.init(document.getElementById('klineChart'), 'dark');
        const dates = klines.map(k => k.tradeDate);
        const ohlc = klines.map(k =>
            [Number(k.openPrice), Number(k.closePrice), Number(k.lowPrice), Number(k.highPrice)]);
        // 成交量柱与K线同色：收阳红、收阴绿（涨红跌绿）
        const volumes = klines.map(k => ({
            value: Number(k.volume || 0),
            itemStyle: {color: Number(k.closePrice) >= Number(k.openPrice) ? UP : DOWN}
        }));

        const buyMap = new Map();
        const sellMap = new Map();
        trades.forEach(t => {
            if (t.action === 'buy') buyMap.set(t.tradeDate, t);
            else sellMap.set(t.tradeDate, t);
        });

        const marks = [];
        klines.forEach((k, i) => {
            if (buyMap.has(k.tradeDate)) {
                marks.push({name: '买', coord: [i, Number(k.lowPrice)], value: 'B', itemStyle: {color: UP}});
            }
            if (sellMap.has(k.tradeDate)) {
                marks.push({name: '卖', coord: [i, Number(k.highPrice)], value: 'S', itemStyle: {color: DOWN}});
            }
        });

        klineChart.setOption({
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'axis',
                axisPointer: {type: 'cross'},
                // 中文口径：开 / 高 / 低 / 收 + 涨跌幅 + 成交量 / 成交额 / 均价
                formatter: function (ps) {
                    const k = ps.find(p => p.seriesName === 'K线');
                    if (!k) return '';
                    const v = k.value;
                    const r = klines[k.dataIndex];
                    let html = `<b>${k.axisValue}</b>`
                        + `<br>开 ${v[1]}<br>高 ${v[4]}<br>低 ${v[3]}<br>收 ${v[2]}`;
                    if (r) {
                        html += `<br>涨跌幅 ${pctHtml(r)}`
                            + `<br>成交量 ${fmtVol(r.volume)} 手`
                            + `<br>成交额 ${fmtVol(r.amount)} 元`
                            + `<br>均价 ${avgPrice(r)} 元`;
                    }
                    return html;
                }
            },
            // K线区 / 成交量区的十字光标联动
            axisPointer: {link: [{xAxisIndex: 'all'}]},
            grid: [
                {left: 56, right: 24, top: 28, height: '62%'},
                {left: 56, right: 24, top: '72%', height: '21%'}
            ],
            xAxis: [
                {type: 'category', data: dates, axisLine: {lineStyle: {color: '#3a4256'}}},
                {
                    type: 'category', gridIndex: 1, data: dates,
                    axisLine: {lineStyle: {color: '#3a4256'}}, axisLabel: {show: false}
                }
            ],
            yAxis: [
                {scale: true, splitLine: {lineStyle: {color: '#232b3d'}}},
                {gridIndex: 1, splitNumber: 2, splitLine: {show: false}, axisLabel: {show: false}}
            ],
            dataZoom: [
                {type: 'inside', xAxisIndex: [0, 1], zoomOnMouseWheel: true, moveOnMouseMove: true},
                {type: 'slider', xAxisIndex: [0, 1], height: 14, bottom: 6}
            ],
            series: [{
                name: 'K线',
                type: 'candlestick',
                data: ohlc,
                large: true,
                largeThreshold: 80,
                itemStyle: {color: UP, color0: DOWN, borderColor: UP, borderColor0: DOWN},
                markPoint: {
                    symbol: 'pin',
                    symbolSize: 34,
                    label: {color: '#fff', fontSize: 11, fontWeight: 'bold'},
                    data: marks
                }
            }, {
                name: '成交量',
                type: 'bar',
                xAxisIndex: 1,
                yAxisIndex: 1,
                large: true,
                data: volumes
            }]
        }, true);
    }

    /**
     * 盈亏走势：金额类（盈亏金额 / 本金走势）共用左轴，比例单独右轴。
     * 曲线由用户勾选决定，一条都不勾时给空图而不是报错。
     */
    function renderProfit() {
        if (!lastResult) return;
        const dailies = lastResult.dailies || [];
        profitChart = profitChart || echarts.init(document.getElementById('profitChart'), 'dark');

        const showAmount = document.getElementById('sAmount').checked;
        const showRatio = document.getElementById('sRatio').checked;
        const showPrincipal = document.getElementById('sPrincipal').checked;
        const showMoney = showAmount || showPrincipal;

        const dates = dailies.map(d => d.tradeDate);
        const yAxis = [];
        const series = [];
        if (showMoney) {
            yAxis.push({
                type: 'value',
                name: '金额',
                scale: true,
                splitLine: {lineStyle: {color: '#232b3d'}},
                axisLabel: {formatter: v => fmtNum(v)}
            });
        }
        if (showRatio) {
            yAxis.push({
                type: 'value',
                name: '比例',
                axisLabel: {formatter: '{value} %'},
                splitLine: {show: false}
            });
        }
        const moneyIdx = 0;
        const ratioIdx = showMoney ? 1 : 0;

        if (showAmount) {
            series.push({
                name: '盈亏金额',
                type: 'line',
                yAxisIndex: moneyIdx,
                data: dailies.map(d => Number(d.profitAmount)),
                showSymbol: false,
                lineStyle: {color: '#e5a00d', width: 2},
                itemStyle: {color: '#e5a00d'}
            });
        }
        if (showPrincipal) {
            series.push({
                name: '本金走势',
                type: 'line',
                yAxisIndex: moneyIdx,
                data: dailies.map(d => Number(d.totalAmount)),
                showSymbol: false,
                lineStyle: {color: '#a371f7', width: 2},
                itemStyle: {color: '#a371f7'},
                areaStyle: {color: 'rgba(163,113,247,.10)'}
            });
        }
        if (showRatio) {
            series.push({
                name: '盈亏比例',
                type: 'line',
                yAxisIndex: ratioIdx,
                data: dailies.map(d => Number(d.profitRatio) * 100),
                showSymbol: false,
                lineStyle: {color: '#4c8dff', width: 2},
                itemStyle: {color: '#4c8dff'}
            });
        }

        profitChart.setOption({
            backgroundColor: 'transparent',
            tooltip: {trigger: 'axis'},
            legend: {data: series.map(s => s.name), textStyle: {color: '#9aa4bf'}},
            grid: {left: 64, right: showRatio ? 64 : 28, top: 40, bottom: 40},
            xAxis: {type: 'category', data: dates, axisLine: {lineStyle: {color: '#3a4256'}}},
            yAxis: yAxis.length ? yAxis : [{type: 'value', show: false}],
            series: series
        }, true);
    }

    /**
     * 明细不再平铺：只更新入口按钮上的行数，点开再分页渲染。
     *
     * <p>一次回测动辄几百个交易日，全渲染成行会把图表挤到很下面。
     */
    function renderDaily(dailies) {
        lastDailies = dailies || [];
        document.getElementById('dailyCount').textContent = lastDailies.length + ' 行';
    }

    function renderTrades(trades) {
        lastTrades = trades || [];
        document.getElementById('tradeCount').textContent = lastTrades.length + ' 笔';
    }

    function openDaily() {
        if (!lastDailies.length) {
            return toast('本次回测没有每日账户数据', 'err');
        }
        const bt = lastResult ? lastResult.backtest : null;
        openTableModal({
            title: '每日账户' + (bt ? ' - ' + codeWithName(bt) + ' ' + bt.startDate + ' ~ ' + bt.endDate : ''),
            rows: lastDailies,
            columns: [
                {label: '交易日', render: d => esc(d.tradeDate)},
                {label: '收盘价', cls: 'num', render: d => fmtNum(d.closePrice)},
                {label: '账户总金额', cls: 'num', render: d => '<b>' + fmtNum(d.totalAmount) + '</b>'},
                {label: '持仓金额', cls: 'num', render: d => fmtNum(d.positionValue)},
                {label: '持仓股数', cls: 'num', render: d => d.positionShares},
                {label: '现金', cls: 'num', render: d => fmtNum(d.cash)},
                {label: '盈亏金额', cls: 'num', render: d => pct(Number(d.profitRatio || 0), fmtNum(d.profitAmount))},
                {label: '盈亏比例', cls: 'num', render: d => pct(Number(d.profitRatio || 0), (Number(d.profitRatio || 0) * 100).toFixed(2) + '%')}
            ]
        });
    }

    function openTrades() {
        if (!lastTrades.length) {
            return toast('本次回测没有产生任何成交', 'err');
        }
        openTableModal({
            title: '买卖明细',
            rows: lastTrades,
            columns: [
                {label: '成交日', render: t => esc(t.tradeDate)},
                {label: '方向', render: t => t.action === 'buy'
                    ? '<span class="badge badge-ok">买入</span>'
                    : '<span class="badge badge-err">卖出</span>'},
                {label: '股数', cls: 'num', render: t => t.shares},
                {label: '成交价', cls: 'num', render: t => fmtNum(t.price)},
                {label: '成交额', cls: 'num', render: t => fmtNum(t.turnover)},
                {label: '手续费', cls: 'num', render: t => fmtNum(t.fee)},
                {label: '成交后现金', cls: 'num', render: t => fmtNum(t.cashAfter)}
            ]
        });
    }

    /** 盈亏列按正负着色 */
    function pct(ratio, text) {
        return '<span class="' + (ratio >= 0 ? 'up' : 'down') + '">' + text + '</span>';
    }

    // ============ 历史回测 ============

    async function loadHistory() {
        if (!MODE.backtestPersistent) {
            // 无数据库模式：回测不落盘，列表恒为空，没必要发请求
            document.getElementById('histBody').innerHTML =
                '<tr><td colspan="9" class="empty">本系统不保存回测历史</td></tr>';
            return;
        }
        const r = await get('/api/backtest?limit=50');
        const tbody = document.getElementById('histBody');
        if (!r || !r.success || !r.data || !r.data.length) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无回测记录</td></tr>';
            return;
        }
        tbody.innerHTML = r.data.map(b => {
            const ratio = Number(b.profitRatio || 0);
            const cls = ratio >= 0 ? 'up' : 'down';
            return `<tr>
                <td>${stockLinkHtml(b.stockCode, b.stockName,
                    {text: b.stockCode + (b.stockName ? ' ' + b.stockName : '')})}</td>
                <td>${esc(b.startDate)} ~ ${esc(b.endDate)}</td>
                <td class="num">${fmtNum(b.initAmount)}</td>
                <td class="num">${fmtNum(b.finalAmount)}</td>
                <td class="num ${cls}">${fmtNum(b.totalProfit)}</td>
                <td class="num ${cls}">${(ratio * 100).toFixed(2)}%</td>
                <td class="num">${b.tradeCount}</td>
                <td>${esc(b.createTime || '')}</td>
                <td class="ops">
                    <button class="btn-ghost" onclick="viewBt(${b.id})">查看</button>
                    <button class="btn-ghost" onclick="delBt(${b.id})">删除</button>
                </td>
            </tr>`;
        }).join('');
    }

    async function viewBt(id) {
        const r = await get('/api/backtest/' + id);
        if (r && r.success) {
            render(r.data);
            document.getElementById('resultPanel').scrollIntoView({behavior: 'smooth'});
        }
    }

    async function delBt(id) {
        if (!confirm('确认删除该回测记录？')) return;
        const r = await del('/api/backtest/' + id);
        if (r && r.success) loadHistory();
    }

    renderConds('buy');
    renderConds('sell');
    initLimits();
    bindLogics();
    document.getElementById('fStart').addEventListener('change', renderSpanHint);
    document.getElementById('fEnd').addEventListener('change', renderSpanHint);

    (async function init() {
        await loadMode();
        // 回测要登录：一次回测会连打一批行情数据服务接口，匿名放开等于给人白刷
        if (!(await requireLogin())) {
            return;
        }
        if (!MODE.backtestPersistent) {
            document.getElementById('histPanel').style.display = 'none';
        }
        renderSpanHint();
        renderLimit('buy');
        renderLimit('sell');
        // 历史列表与结果里的标的要渲染成跳转链接，配置先拿到
        await loadStockLink();
        loadHistory();
        // 从股票列表跳过来时带上 ?code=，直接预填标的
        const q = new URLSearchParams(location.search);
        const code = q.get('code');
        if (code) {
            codePicker.clear();
            await codePicker.pickByCode(code);
        }
    })();
</script>
</body>
</html>
