<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{var t=localStorage.getItem("shadowflow_theme")||localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <title>K线分析 - 影流数据</title>
    <link rel="stylesheet" href="/css/common.css?v=20261021a">
    <style>
        /* K线图在手机上的高度（v1.5.9 移动端适配）：560px 是照桌面写的，
           手机上加上顶栏和上方的表单已经超一屏，图表本身还占掉大半屏，
           进来先得滚一下才看得见图。这里只压高度；横向留白由下方 option 里
           按容器实际宽度算，写死的边距在 360px 宽的屏上会吃掉三成宽度。 */
        @media (max-width: 720px) {
            #chart { height: 360px !important; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">影流数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <section class="panel">
        <h2>K线分析</h2>
        <div class="form-row">
            <div class="field grow">
                <label>股票 *</label>
                <div id="codePick"></div>
            </div>
        </div>
        <div class="form-row">
            <span class="dim">均线：</span>
            <label class="dim"><input type="checkbox" class="ma" value="5" checked> MA5</label>
            <label class="dim"><input type="checkbox" class="ma" value="10" checked> MA10</label>
            <label class="dim"><input type="checkbox" class="ma" value="20"> MA20</label>
            <label class="dim"><input type="checkbox" class="ma" value="60"> MA60</label>
        </div>
        <div id="stat" class="dim"></div>
    </section>

    <section class="panel">
        <h2 id="chartTitle">K线图</h2>
        <!-- 这一行只有动作按钮，靠右排：与其它卡片头部的按钮组对齐（row-end = justify-content:flex-end） -->
        <div class="form-row row-end">
            <button class="btn-ghost" onclick="openDetail()" id="btnDetail">当前视窗明细</button>
        </div>
        <div id="chart" style="width:100%;height:560px"></div>
    </section>
</main>

<script src="/vendor/echarts.min.js"></script>
<script src="/js/common.js?v=20261021a"></script>
<script src="/js/date-picker.js?v=20261011e"></script>
<script src="/js/stock-picker.js?v=20261011e"></script>
<script>
    const VIEW_DAYS = 92;              // 默认渲染近三个月
    const CHUNK_DAYS = 180;            // 数据库模式懒加载步长
    const CHUNK_NODB = 365;            // 无数据库模式：向左每次补一年
    const NODB_FLOOR = '1990-12-19';   // 无数据库模式回溯下界，防止无限往回拉
    const EDGE = 0.08;
    /** 直接打开本页（地址栏不带 code）时默认渲染的标的 */
    const DEFAULT_CODE = '000001';
    const DEFAULT_NAME = '上证指数';

    let chart = echarts.init(document.getElementById('chart'), 'dark');
    const state = {
        code: '',
        name: '',
        minDate: null,
        maxDate: null,
        total: 0,
        rows: [],
        visRows: [],
        fetching: false,
        exhausted: false,   // 无数据库模式：往回拉空过一次就到底了
        zoom: {start: 0, end: 100}
    };

    const codePicker = createStockPicker(document.getElementById('codePick'), {
        // 选中即渲染：点选（或手输回车）产生有效代码就直接画图，不再要"分析"按钮
        onChange: function () {
            if (codePicker.getCodes().length) loadStock();
        },
        onEnter: () => loadStock()
    });

    function resetChart() {
        state.rows = [];
        state.code = '';
        state.exhausted = false;
        chart.clear();
        setVisRows([]);
        document.getElementById('stat').textContent = '';
        document.getElementById('chartTitle').textContent = 'K线图';
    }

    function maPeriods() {
        return Array.from(document.querySelectorAll('.ma:checked')).map(x => parseInt(x.value, 10));
    }

    function calcMa(values, period) {
        const res = [];
        let sum = 0;
        for (let i = 0; i < values.length; i++) {
            sum += values[i];
            if (i >= period) sum -= values[i - period];
            // 股价一律两位小数（与全站一致），多留位数只会让均线标签显得噪声大
            res.push(i >= period - 1 ? +(sum / period).toFixed(2) : '-');
        }
        return res;
    }

    /**
     * 均价 = 成交额 / 成交量。
     * 注意单位：行情数据服务的 volume 是「手」，amount 是「元」，1 手 = 100 股，
     * 所以要先把手换成股再除，否则均价会放大 100 倍。
     */
    const LOT = 100;
    function avgPrice(r) {
        const v = Number(r && r.volume);
        const a = Number(r && r.amount);
        if (!v || !a || isNaN(v) || isNaN(a)) return '-';
        return fmtNum(a / (v * LOT), 2);
    }

    /** 相对前收盘的涨跌幅，带正负号与涨跌配色 */
    function pctHtml(r) {
        const p = r && r.preClose != null ? Number(r.preClose) : 0;
        if (!p) return '-';
        const pct = (Number(r.closePrice) - p) / p * 100;
        return `<span class="${pct >= 0 ? 'up' : 'down'}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span>`;
    }

    function mergeRows(extra) {
        if (!extra || !extra.length) {
            return 0;
        }
        const map = new Map();
        state.rows.forEach(r => map.set(r.tradeDate, r));
        let added = 0;
        extra.forEach(r => {
            if (!map.has(r.tradeDate)) {
                added++;
            }
            map.set(r.tradeDate, r);
        });
        state.rows = Array.from(map.values()).sort((a, b) => a.tradeDate.localeCompare(b.tradeDate));
        return added;
    }

    function loadedSpan() {
        if (!state.rows.length) {
            return {start: null, end: null};
        }
        return {start: state.rows[0].tradeDate, end: state.rows[state.rows.length - 1].tradeDate};
    }

    function clampYmd(a, b, mode) {
        if (!a) return b;
        if (!b) return a;
        if (mode === 'max') return a > b ? a : b;
        return a < b ? a : b;
    }

    async function fetchRange(startDate, endDate) {
        if (!startDate || !endDate || startDate > endDate) {
            return [];
        }
        const r = await get(`/api/kline/chart?code=${encodeURIComponent(state.code)}`
            + `&startDate=${startDate}&endDate=${endDate}`);
        if (!r.success) {
            return [];
        }
        return r.data.rows || [];
    }

    /**
     * 无数据库模式：不提供日期输入框，选完股票直接渲染近三个月。
     * 往回补历史走 fetchOlderChunk()——拖到左边缘自动触发，或点「加载更早一年」。
     */
    async function loadNoDb() {
        const end = today();
        const start = daysAgo(VIEW_DAYS);
        state.minDate = null;      // 未探底，左侧还能继续拉
        state.maxDate = end;
        state.exhausted = false;
        state.rows = [];
        state.zoom = {start: 0, end: 100};
        mergeRows(await fetchRange(start, end));
        state.total = state.rows.length;
        if (!state.rows.length) {
            chart.clear();
            document.getElementById('stat').textContent = '';
            document.getElementById('chartTitle').textContent = `K线图 - ${state.code}`;
            toast('最近三个月没取到行情，请确认代码是否正确', 'err');
            return;
        }
        paint(true);
    }

    async function loadStock() {
        if (!requireStock(codePicker, '一只股票')) return;
        const picked = codePicker.getFirst();
        state.code = picked.code;
        state.name = picked.name || '';
        state.rows = [];
        state.zoom = {start: 0, end: 100};
        state.exhausted = false;

        if (MODE.noDb) {
            await loadNoDb();
            return;
        }

        const span = await get(`/api/kline/span?code=${encodeURIComponent(state.code)}`);
        if (!span.success) return;
        state.minDate = span.data.minDate;
        state.maxDate = span.data.maxDate;
        state.total = span.data.count || 0;
        if (!state.total) {
            chart.clear();
            document.getElementById('stat').textContent = '';
            document.getElementById('chartTitle').textContent = `K线图 - ${state.code}`;
            return;
        }

        const viewEnd = state.maxDate;
        const viewStart = clampYmd(addDays(viewEnd, -VIEW_DAYS), state.minDate, 'max');
        const fetchStart = clampYmd(addDays(viewStart, -60), state.minDate, 'max');
        mergeRows(await fetchRange(fetchStart, viewEnd));
        paint(true);
    }

    function visibleIndexRange() {
        const n = state.rows.length;
        if (!n) {
            return {from: 0, to: 0};
        }
        const from = Math.max(0, Math.floor(n * state.zoom.start / 100));
        const to = Math.min(n, Math.ceil(n * state.zoom.end / 100));
        return {from, to: Math.max(from + 1, to)};
    }

    function paint(fitThreeMonths) {
        const rows = state.rows;
        if (!rows.length) {
            chart.clear();
            return;
        }
        const dates = rows.map(x => x.tradeDate);
        const ohlc = rows.map(x => [
            Number(x.openPrice), Number(x.closePrice), Number(x.lowPrice), Number(x.highPrice)
        ]);
        const closeVals = rows.map(x => Number(x.closePrice));
        const volumes = rows.map(x => ({
            value: Number(x.volume || 0),
            itemStyle: {
                color: Number(x.closePrice) >= Number(x.openPrice) ? '#e5484d' : '#2ea043'
            }
        }));
        const mas = maPeriods().map(p => ({
            name: 'MA' + p,
            type: 'line',
            data: calcMa(closeVals, p),
            smooth: true,
            symbol: 'none',
            lineStyle: {width: 1},
            large: true
        }));

        if (fitThreeMonths) {
            const end = rows[rows.length - 1].tradeDate;
            const startWant = addDays(end, -VIEW_DAYS);
            let idx = 0;
            for (let i = 0; i < rows.length; i++) {
                if (rows[i].tradeDate >= startWant) {
                    idx = i;
                    break;
                }
            }
            state.zoom.start = rows.length <= 1 ? 0 : +(idx / (rows.length - 1) * 100).toFixed(2);
            state.zoom.end = 100;
        }

        chart.setOption({
            backgroundColor: 'transparent',
            animation: false,
            legend: {data: ['K线'].concat(mas.map(m => m.name)), top: 0},
            tooltip: {
                trigger: 'axis',
                axisPointer: {type: 'cross'},
                formatter: function (ps) {
                    const k = ps.find(p => p.seriesName === 'K线');
                    if (!k) return '';
                    const v = k.value;
                    const r = state.rows[k.dataIndex];
                    let html = `<b>${k.axisValue}</b><br>开 ${v[1]}<br>收 ${v[2]}<br>低 ${v[3]}<br>高 ${v[4]}`;
                    ps.forEach(p => {
                        if (p.seriesName !== 'K线' && p.seriesName !== '成交量') {
                            html += `<br>${p.seriesName} ${p.value}`;
                        }
                    });
                    if (r) {
                        html += `<br>涨跌 ${pctHtml(r)}`
                            + `<br>成交量 ${fmtVol(r.volume)} 手`
                            + `<br>成交额 ${fmtVol(r.amount)} 元`
                            + `<br>均价 ${avgPrice(r)} 元`;
                    }
                    return html;
                }
            },
            axisPointer: {link: [{xAxisIndex: 'all'}]},
            // 上下两栏（K线 + 成交量）的边距与高度按容器实际尺寸现算（v1.5.9 移动端适配）：
            // 原先写死 560px 高的坐标（left 60 / top 420 / height 110），容器一矮
            // 成交量那栏就被挤出画布；窄屏上左右各留 60/40 也会白白吃掉三成宽度。
            grid: (function () {
                const el = document.getElementById('chart');
                const w = (el && el.clientWidth) || 800;
                const h = (el && el.clientHeight) || 560;
                const narrow = w < 620;
                const left = narrow ? 46 : 60;
                const right = narrow ? 12 : 40;
                const top = narrow ? 28 : 40;
                const bottom = 30;
                const gap = narrow ? 16 : 40;
                const volH = Math.max(60, Math.round((h - top - bottom) * 0.22));
                const mainH = Math.max(80, h - top - bottom - volH - gap);
                return [
                    {left: left, right: right, top: top, height: mainH},
                    {left: left, right: right, top: top + mainH + gap, height: volH}
                ];
            })(),
            xAxis: [
                {type: 'category', data: dates, boundaryGap: false, axisLine: {lineStyle: {color: '#3a4256'}}},
                {
                    type: 'category', gridIndex: 1, data: dates, boundaryGap: false,
                    axisLine: {lineStyle: {color: '#3a4256'}}, axisLabel: {show: false}
                }
            ],
            yAxis: [
                {scale: true, splitLine: {lineStyle: {color: '#232b3d'}}},
                {gridIndex: 1, splitNumber: 2, splitLine: {show: false}, axisLabel: {show: false}}
            ],
            // 只在图内操作：按住拖动平移、滚轮缩放，不再给底部滚动条
            dataZoom: [
                {
                    type: 'inside',
                    xAxisIndex: [0, 1],
                    start: state.zoom.start,
                    end: state.zoom.end,
                    zoomOnMouseWheel: true,
                    moveOnMouseMove: true,
                    moveOnMouseWheel: false,
                    preventDefaultMouseMove: true
                }
            ],
            series: [{
                name: 'K线',
                type: 'candlestick',
                data: ohlc,
                large: true,
                largeThreshold: 80,
                itemStyle: {color: '#e5484d', color0: '#2ea043', borderColor: '#e5484d', borderColor0: '#2ea043'}
            }].concat(mas).concat([{
                name: '成交量',
                type: 'bar',
                xAxisIndex: 1,
                yAxisIndex: 1,
                large: true,
                data: volumes
            }])
        }, true);

        const vis = visibleIndexRange();
        const visRows = rows.slice(vis.from, vis.to);
        // 无数据库模式没有"总条数"这个口径，改成"已加载多少、最早到哪天"
        // 标题里的「代码 + 名称」走全站统一的股票跳转链接
        document.getElementById('chartTitle').innerHTML =
            `K线图 - ${stockLinkHtml(state.code, state.name, {text: state.code + (state.name ? ' ' + state.name : '')})}（`
            + (MODE.noDb
                ? `已加载 ${rows.length} 个交易日，最早 ${rows[0].tradeDate}`
                : `已加载 ${rows.length} / ${state.total} 个交易日`)
            + '）';
        setVisRows(visRows);
        renderStat(visRows);
    }

    function renderStat(visRows) {
        if (!visRows.length) {
            document.getElementById('stat').textContent = '';
            return;
        }
        const first = visRows[0], last = visRows[visRows.length - 1];
        const pc = Number(first.preClose || first.openPrice);
        const chg = (Number(last.closePrice) - pc) / pc * 100;
        const span = loadedSpan();

        // 视窗内的量额合计：成交额按金额简写，成交量按股数简写，均价由两者相除
        let sumAmt = 0, sumVol = 0;
        visRows.forEach(r => {
            sumAmt += Number(r.amount || 0);
            sumVol += Number(r.volume || 0);
        });
        const avg = sumVol ? fmtNum(sumAmt / (sumVol * LOT), 2) : '-';

        document.getElementById('stat').innerHTML =
            `视窗 ${visRows[0].tradeDate} ~ ${visRows[visRows.length - 1].tradeDate}`
            + ` · 涨跌 <b class="${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</b>`
            + ` · 成交额 ${fmtVol(sumAmt)} 元`
            + ` · 成交量 ${fmtVol(sumVol)} 手`
            + ` · 均价 ${avg} 元`
            + ` · 已加载 ${span.start} ~ ${span.end}`
            + (MODE.noDb && state.exhausted ? ' · 已到最早可查行情' : '');
    }

    /** 视窗明细不再平铺在页面上：只记住当前可见区间，点按钮才弹窗分页展示 */
    function setVisRows(rows) {
        state.visRows = rows || [];
        document.getElementById('btnDetail').textContent = `当前视窗明细（${state.visRows.length} 条）`;
        document.getElementById('btnDetail').disabled = !state.visRows.length;
    }

    function openDetail() {
        if (!state.visRows.length) {
            return toast('当前视窗没有明细数据', 'err');
        }
        const rows = state.visRows.slice().reverse();
        openTableModal({
            title: `当前视窗明细 - ${state.code}${state.name ? ' ' + state.name : ''}`,
            rows,
            columns: [
                {label: '交易日', render: r => esc(r.tradeDate)},
                {label: '开盘', cls: 'num', render: r => fmtNum(r.openPrice)},
                {label: '收盘', cls: 'num', render: r => fmtNum(r.closePrice)},
                {label: '最高', cls: 'num', render: r => fmtNum(r.highPrice)},
                {label: '最低', cls: 'num', render: r => fmtNum(r.lowPrice)},
                {label: '涨跌', cls: 'num', render: r => pctHtml(r)},
                {label: '成交量(手)', cls: 'num', render: r => fmtNum(r.volume, 0)},
                {label: '成交额(元)', cls: 'num', render: r => fmtNum(r.amount, 0)},
                {label: '均价', cls: 'num', render: r => avgPrice(r)}
            ]
        });
    }

    /**
     * 向左补一段历史：数据库模式补 CHUNK_DAYS，无数据库模式补一年（CHUNK_NODB）。
     * 补完按原视窗左端日期复位，画面不跳动。
     * @returns {Promise<number>} 新增的交易日条数
     */
    async function fetchLeftChunk() {
        const n = state.rows.length;
        const startIdx = Math.floor(n * state.zoom.start / 100);
        const endIdx = Math.ceil(n * state.zoom.end / 100);
        const span = loadedSpan();
        if (!span.start) return 0;

        // 两种模式"还能不能往左"的判据不同：
        // 数据库模式有入库最早日可比，无数据库模式只能靠拉空一次来探底
        let from;
        if (MODE.noDb) {
            if (state.exhausted || span.start <= NODB_FLOOR) return 0;
            from = clampYmd(addDays(span.start, -CHUNK_NODB), NODB_FLOOR, 'max');
        } else {
            if (state.minDate && span.start <= state.minDate) return 0;
            from = clampYmd(addDays(span.start, -CHUNK_DAYS), state.minDate, 'max');
        }
        const to = addDays(span.start, -1);
        if (!from || !to || from > to) return 0;

        const keepDate = state.rows[startIdx] ? state.rows[startIdx].tradeDate : span.start;
        const extra = await fetchRange(from, to);
        if (!extra.length) {
            if (MODE.noDb) state.exhausted = true;   // 这一段拉空 = 前面没数据了，后面不再白跑
            return 0;
        }
        const added = mergeRows(extra);
        if (added) {
            const idx = state.rows.findIndex(r => r.tradeDate === keepDate);
            const visLen = Math.max(1, endIdx - startIdx);
            if (idx >= 0 && state.rows.length > 1) {
                state.zoom.start = +(idx / (state.rows.length - 1) * 100).toFixed(2);
                const endI = Math.min(state.rows.length - 1, idx + visLen);
                state.zoom.end = +(endI / (state.rows.length - 1) * 100).toFixed(2);
            }
            paint(false);
        }
        return added;
    }

    /** 「加载更早一年」按钮已删：向左补历史统一由拖到边缘触发（maybePrefetch → fetchLeftChunk） */

    async function maybePrefetch() {
        if (state.fetching || !state.code || !state.rows.length) {
            return;
        }
        const n = state.rows.length;
        const startIdx = Math.floor(n * state.zoom.start / 100);
        const endIdx = Math.ceil(n * state.zoom.end / 100);
        const span = loadedSpan();

        const canLeft = MODE.noDb
            ? (!state.exhausted && span.start > NODB_FLOOR)
            : (state.minDate && span.start > state.minDate);

        if (state.zoom.start < EDGE * 100 && canLeft) {
            state.fetching = true;
            try {
                await fetchLeftChunk();
            } finally {
                state.fetching = false;
            }
            return;
        }

        // 向右补历史只对数据库模式成立：无数据库模式下"未来"没有数据可比
        if (MODE.noDb || state.zoom.end <= (1 - EDGE) * 100 || span.end >= state.maxDate) {
            return;
        }
        const from = addDays(span.end, 1);
        const to = clampYmd(addDays(span.end, CHUNK_DAYS), state.maxDate, 'min');
        const keepDate = state.rows[Math.max(0, endIdx - 1)] ? state.rows[endIdx - 1].tradeDate : span.end;
        state.fetching = true;
        try {
            const added = mergeRows(await fetchRange(from, to));
            if (added) {
                const idx = state.rows.findIndex(r => r.tradeDate === keepDate);
                const visLen = Math.max(1, endIdx - startIdx);
                if (idx >= 0 && state.rows.length > 1) {
                    state.zoom.start = +(idx / (state.rows.length - 1) * 100).toFixed(2);
                    const endI = Math.min(state.rows.length - 1, idx + visLen);
                    state.zoom.end = +(endI / (state.rows.length - 1) * 100).toFixed(2);
                }
                paint(false);
            }
        } finally {
            state.fetching = false;
        }
    }

    chart.on('datazoom', function (e) {
        const batch = e.batch ? e.batch[0] : e;
        if (batch && batch.start != null) {
            state.zoom.start = batch.start;
            state.zoom.end = batch.end;
        } else {
            const opt = chart.getOption();
            const z = opt.dataZoom && opt.dataZoom[0];
            if (z) {
                state.zoom.start = z.start;
                state.zoom.end = z.end;
            }
        }
        const vis = visibleIndexRange();
        const visRows = state.rows.slice(vis.from, vis.to);
        setVisRows(visRows);
        renderStat(visRows);
        maybePrefetch();
    });

    /**
     * 关键补丁：datazoom 事件只在窗口值「变化」时才派发。
     * 无数据库模式初始视窗就是全部已加载数据（start=0），往左拖时窗口值
     * 已到边界不再变化，ECharts 不发事件，上面的 datazoom 回调永远不执行，
     * maybePrefetch 就永远不会被触发——表现为"无法左拉、也不自动补数"。
     *
     * 这里自己跟踪按下/拖动手势：按下瞬间和拖动过程中都主动探一次边界，
     * 靠 maybePrefetch 内部的 fetching 防重入，高频调用无副作用。
     */
    const chartEl = document.getElementById('chart');
    let chartDragging = false;
    chartEl.addEventListener('mousedown', function () {
        chartDragging = true;
        maybePrefetch();
    });
    window.addEventListener('mouseup', function () {
        chartDragging = false;
    });
    chartEl.addEventListener('mousemove', function () {
        if (chartDragging) {
            maybePrefetch();
        }
    });

    // 尺寸一变不仅要 resize，还要重画：图内两栏的边距是按容器尺寸现算的，
    // 只 resize 会沿用上一次的坐标（手机横竖屏切换时尤其明显）
    window.addEventListener('resize', () => {
        chart.resize();
        paint();
    });
    document.querySelectorAll('.ma').forEach(x => x.onchange = () => {
        if (state.rows.length) paint(false);
    });

    (async function initFromQuery() {
        await loadMode();
        // 名称要渲染成跳转链接，配置先拿到再画，免得首屏那一下用的是内置默认
        await loadStockLink();
        const p = new URLSearchParams(location.search);
        if (p.get('code')) {
            // pickByCode 内部会触发 onChange → loadStock()，这里不用再调一次
            const ok = await codePicker.pickByCode(p.get('code'));
            if (!ok) {
                toast(`代码 ${p.get('code')} 不在股票列表中`, 'err');
            }
            // 地址栏给了 code 就以它为准，绝不能落到下面的默认标的上
            return;
        }
        /* 直接进这一页（地址栏不带 code）时默认渲染 000001 上证指数，省得进来先看到一块空白。
           名称写的是「上证指数」而不是让名录去反查 —— 名录里 000001 同时挂着平安银行与
           上证指数两条，反查只会拿到排在前面的那只。 */
        codePicker.setItems([{code: DEFAULT_CODE, name: DEFAULT_NAME}]);
        loadStock();
    })();
</script>
</body>
</html>
