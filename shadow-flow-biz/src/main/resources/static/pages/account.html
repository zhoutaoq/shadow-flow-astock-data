<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{var t=localStorage.getItem("shadowflow_theme")||localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <title>我的账户</title>
    <link rel="stylesheet" href="/css/common.css?v=20261027d">
    <link rel="stylesheet" href="/css/account.css?v=20261027d">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">影流数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <section class="panel" id="gatePanel" style="display:none">
        <h2>我的账户</h2>
        <div class="modal-actions">
            <button onclick="openAuthModal({onSuccess: reload})">去登录</button>
        </div>
    </section>

    <!-- ============================ 一级：账户 ============================ -->
    <div id="listPanel" style="display:none">
        <div class="ahead">
            <div class="ahead-l">
                <h1 class="ahead-t">我的账户</h1>
                <div class="asum" id="ovChips"></div>
            </div>
            <div class="ahead-r">
                <button class="btn-ghost" onclick="reload()">重新载入</button>
                <button class="btn-ghost" onclick="pickImportFile()">导入账户</button>
                <button onclick="openAccountModal('create')">＋ 新建账户</button>
            </div>
            <input type="file" id="impFile" accept=".zip,application/zip" class="afile" onchange="submitImport(this)">
        </div>

        <div class="acc-grid" id="accGrid"></div>
    </div>

    <!-- ==================== 二级：账户下的持仓 / 盈亏 / 记录 ==================== -->
    <div id="acctPanel" style="display:none">

        <div class="ahead">
            <div class="ahead-l">
                <div class="acrumb">
                    <button class="btn-ghost btn-sm" onclick="backToList()">
                        <span class="acrumb-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
                        全部账户
                    </button>
                    <h1 class="ahead-t" id="curName">账户</h1>
                </div>
                <div class="asum" id="asum"></div>
            </div>
        </div>

        <div class="agrid">

            <!-- ① 账户资金：只读展示。期初市值与可用金额不默认开放编辑，
                 要改点右上角「维护」进弹窗（需求 v1.5.5 第 ① 条） -->
            <section class="acard acard-narrow">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span>
                    <h2>账户资金</h2>
                    <span class="acard-note" id="acctNote"></span>
                    <button class="btn-ghost btn-sm" onclick="openFundModal()">维护</button>
                </header>
                <div class="acard-bd">
                    <div class="apairs" id="fundRows"></div>
                </div>
            </section>

            <!-- ② 账户统计（v1.6.9）：总资产 / 持仓市值 / 总盈亏 / 浮动盈亏 / 当日收益 五项 -->
            <section class="acard acard-wide">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></span>
                    <h2>账户统计</h2>
                    <span class="acard-note" id="quoteTip"></span>
                </header>
                <div class="acard-bd">
                    <div class="akpi-grid">
                        <div class="akpi">
                            <div class="akpi-t">总资产</div>
                            <div class="akpi-v" id="kTotalValue">-</div>
                            <div class="akpi-d">持仓市值 + 可用金额</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">持仓市值</div>
                            <div class="akpi-v" id="kPosValue">-</div>
                            <div class="akpi-d" id="kPosCost">成本 -</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">总盈亏</div>
                            <div class="akpi-v" id="kTotalProfit">-</div>
                            <div class="akpi-d" id="kTotalPct">相对账户期初市值</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">浮动盈亏</div>
                            <div class="akpi-v" id="kFloatProfit">-</div>
                            <div class="akpi-d" id="kFloatPct">相对持仓成本</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">当日收益</div>
                            <div class="akpi-v" id="kDayProfit">-</div>
                            <div class="akpi-d" id="kDayPct">持仓浮动 + 当日已实现</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">当日操作盈亏</div>
                            <div class="akpi-v" id="kTradeProfit">-</div>
                            <div class="akpi-d" id="kTradeDesc">卖(卖价-现价) + 买(现价-买价)</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ③ 账户走势（v1.6.7）：1 分钟盈亏曲线；缺失分钟按前值补平成横线。
                 纵轴看的是「今天赚了多少」，不是市值本身 —— 市值万位数上下跳几十块，
                 屏幕上根本看不出盈亏往哪走 -->
            <section class="acard">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3.5-4.5L14 12l4-5.5"/></svg></span>
                    <h2>账户走势</h2>
                    <span class="acard-note" id="trendNote">1 分钟 · 当日盈亏</span>
                    <div class="acard-acts">
                        <input type="date" id="trendDate" class="atrend-date" onchange="onTrendDateChange(this.value)">
                        <button class="btn-ghost btn-sm" id="trendTodayBtn" onclick="pickTrendToday()">今天</button>
                    </div>
                </header>
                <div class="acard-bd">
                    <div class="atrend" id="trendChart"></div>
                    <div class="atrend-empty" id="trendEmpty" style="display:none"></div>
                </div>
            </section>

            <!-- ④ 持仓列表：录入动作就落在这张卡片的页头，页面右上角不再堆按钮 -->
            <section class="acard">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
                    <h2>持仓列表</h2>
                    <span class="acard-note" id="posCount"></span>
                    <div class="acard-acts">
                        <button class="btn-ghost btn-sm" onclick="openPositionModal()">＋ 添加持仓</button>
                        <button class="btn-ghost btn-sm" onclick="openRecordModal()">＋ 添加操作记录</button>
                    </div>
                </header>
                <div class="acard-bd">
                    <div class="atable-wrap">
                        <table class="atable">
                            <thead>
                            <tr>
                                <th>标的</th>
                                <th>名称</th>
                                <th>建仓日</th>
                                <th>成本价</th>
                                <th>现价</th>
                                <th>持仓数量</th>
                                <th>可用数量</th>
                                <th>成本市值</th>
                                <th>当前市值</th>
                                <th>当日收益</th>
                                <th>总盈亏</th>
                                <th class="ops">操作</th>
                            </tr>
                            </thead>
                            <tbody id="posBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- ⑤ 操作记录：随账户一起落盘。录入走「＋ 添加操作记录」弹窗（按钮在持仓列表卡头）。
                 默认只列当天（盘中最常看的就是今天做了哪几笔），往期要按「历史」才铺开 -->
            <section class="acard">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></span>
                    <h2>操作记录</h2>
                    <span class="acard-note" id="recCount"></span>
                    <div class="acard-acts">
                        <div class="aseg aseg-sm" id="recScope">
                            <button type="button" data-scope="today" class="on" onclick="setRecScope('today')">当天</button>
                            <button type="button" data-scope="all" onclick="setRecScope('all')">历史</button>
                        </div>
                    </div>
                </header>
                <div class="acard-bd">
                    <div class="arec-head">
                        <span>方向</span>
                        <span>标的</span>
                        <span>成交价</span>
                        <span>数量</span>
                        <span>盈亏</span>
                        <span id="recDateHead">时间</span>
                    </div>
                    <div class="arec-list" id="recList"></div>
                </div>
            </section>

        </div>
    </div>
</main>

<script src="/js/common.js?v=20261028c"></script>
<script src="/js/date-picker.js?v=20261019a"></script>
<script src="/js/stock-picker.js?v=20261019a"></script>
<script src="/vendor/echarts.min.js"></script>
<script>
    let overview = null;     // /api/account/accounts 一级列表
    let cfg = null;          // /api/account 当前账户设置
    let summary = null;      // /api/account/summary 当前账户汇总
    let limits = null;       // /api/account/limits
    let curId = 0;           // 当前进入的账户 id；0 = 停在账户列表
    let recAction = 'buy';   // 「添加操作记录」弹窗里当前选中的方向
    let posPicker = null;    // 持仓弹窗里的选择器
    let recPicker = null;    // 「添加操作记录」弹窗里的选择器
    let recScope = 'today';  // 操作记录视图：today = 只看当天（默认） / all = 全部历史
    let recRows = [];        // 最近一次拉到的全量记录（新的在前），切换视图不再重复请求

    /** 二级视图的 3 秒自动刷新（v1.6.7 第 ② 条）：句柄 / 在途标记 / 计数（每 10 跳刷一次走势） */
    let refreshTimer = null;
    let refreshBusy = false;
    let refreshTick = 0;

    function showGate() {
        document.getElementById('gatePanel').style.display = '';
        document.getElementById('listPanel').style.display = 'none';
        document.getElementById('acctPanel').style.display = 'none';
    }

    /** 红涨绿跌：返回 up / down / '' 三态（0 或拿不到时不配色） */
    function dir(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n) || n === 0) return '';
        return n > 0 ? 'up' : 'down';
    }

    /** 可用数量：后端已折算好（没单独设过 = 全部可用），这里只兜个底 */
    function usableQty(p) {
        if (!p) return 0;
        const n = Number(p.availableQty);
        if (p.availableQty === null || p.availableQty === undefined || isNaN(n)) return Number(p.quantity) || 0;
        return Math.max(0, Math.min(n, Number(p.quantity) || 0));
    }

    /** 金额：两位小数 + 千分位；null / 拿不到显示 — */
    function money(v) {
        return fmtNum(v, 2);
    }

    /** 带符号金额：+1,234.00 / -1,234.00 */
    function moneySigned(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n)) return '—';
        return (n > 0 ? '+' : n < 0 ? '-' : '') + fmtNum(Math.abs(n), 2);
    }

    /** 带符号百分比：+1.23% / -1.23%；null 显示 — */
    function pctSigned(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n)) return '—';
        return (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(n).toFixed(2) + '%';
    }

    /* ==================== 一级：账户列表 ==================== */

    /* ============ 路由：#/ = 账户列表，#/a/{id} = 某本账 ============
       以前两级共用一个 URL：点进详情后浏览器返回键直接退站。
       页面内切换用 pushState（不进 popstate，避免和渲染互相触发），
       浏览器前进/后退走 popstate。 */
    function hashAccountId() {
        const m = (location.hash || '').match(/^#\/a\/(\d+)/);
        return m ? Number(m[1]) : 0;
    }

    /** 进下一层：加一条历史，返回键能回到列表 */
    function pushHash(id) {
        const h = id > 0 ? '#/a/' + id : '#/';
        if (location.hash !== h) {
            history.pushState(null, '', h);
        }
    }

    /** 同级替换（回列表时用）：不额外堆历史 */
    function replaceHash(id) {
        const h = id > 0 ? '#/a/' + id : '#/';
        if (location.hash !== h) {
            history.replaceState(null, '', h);
        }
    }

    async function onRoute() {
        const id = hashAccountId();
        if (id > 0) {
            if (id !== curId) {
                await enterAccount(id, true);
            }
            return;
        }
        if (curId > 0) {
            await openList();
        }
    }

    window.addEventListener('popstate', onRoute);

    async function openList() {
        stopAutoRefresh();
        const r = await get('/api/account/accounts');
        if (!r || !r.success) {
            showGate();
            return;
        }
        overview = r.data || {accounts: []};
        curId = 0;
        replaceHash(0);
        document.getElementById('gatePanel').style.display = 'none';
        document.getElementById('acctPanel').style.display = 'none';
        document.getElementById('listPanel').style.display = '';
        renderAccounts();
    }

    function renderAccounts() {
        const ov = overview || {};
        const rows = ov.accounts || [];
        const maxA = (limits && limits.maxAccounts) || 10;

        document.getElementById('ovChips').innerHTML =
            '<span class="achip">' + rows.length + ' / ' + maxA + ' 个账户</span>'
            + '<span class="achip">合计总资产 ' + money(ov.totalValue) + '</span>'
            + '<span class="achip ' + dir(ov.dayProfit) + '">合计当日收益 ' + moneySigned(ov.dayProfit) + '</span>'
            + '<span class="achip ' + dir(ov.totalProfit) + '">合计总盈亏 ' + moneySigned(ov.totalProfit) + '</span>';

        const canAdd = rows.length < maxA;
        document.getElementById('accGrid').innerHTML = rows.map(a => {
            const d = dir(a.dayProfit);
            const t = dir(a.totalProfit);
            return '<div class="acc-item" data-id="' + a.id + '">'
                + '<div class="acc-hd">'
                + '<span class="acc-name">' + esc(a.name || '账户') + '</span>'
                + '<span class="acc-badge">' + a.positionCount + ' 只持仓</span>'
                + '</div>'
                + '<div class="acc-mv">' + money(a.totalValue) + '</div>'
                + '<div class="acc-kpis">'
                + '<span class="acc-kpi">当日 <b class="' + d + '">' + moneySigned(a.dayProfit) + '</b></span>'
                + '<span class="acc-kpi">总盈亏 <b class="' + t + '">' + moneySigned(a.totalProfit) + '</b>'
                + '<small> ' + pctSigned(a.totalProfitPercent) + '</small></span>'
                + '</div>'
                + '<div class="acc-ft">'
                + '<span>期初 ' + money(a.initValue) + '</span>'
                + '<span>可用 ' + money(a.cash) + '</span>'
                + '</div>'
                + '<div class="acc-ops">'
                + '<button class="btn-ghost btn-sm" data-op="open">进入</button>'
                + '<button class="btn-ghost btn-sm" data-op="rename">重命名</button>'
                + '<button class="btn-ghost btn-sm" data-op="export">导出</button>'
                + '<button class="btn-ghost btn-sm" data-op="delete">删除</button>'
                + '</div>'
                + '</div>';
        }).join('') + (canAdd
            ? '<button type="button" class="acc-add" onclick="openAccountModal(\'create\')">＋ 新建账户</button>'
            : '');

        document.getElementById('accGrid').querySelectorAll('.acc-item').forEach(card => {
            const id = Number(card.getAttribute('data-id'));
            card.addEventListener('click', e => {
                const op = e.target.closest('[data-op]');
                if (!op) return enterAccount(id);
                e.stopPropagation();
                const kind = op.getAttribute('data-op');
                if (kind === 'open') return enterAccount(id);
                if (kind === 'rename') return openAccountModal('rename', id);
                if (kind === 'export') return exportAccount(id);
                if (kind === 'delete') return removeAccount(id);
            });
        });
    }

    async function enterAccount(id, fromRoute) {
        // 换一本账回到「当天」；同一本账重载（重新载入 / 刚记完一笔）保持当前视图
        if (id !== curId) recScope = 'today';
        curId = id;
        if (!fromRoute) {
            pushHash(id);
        }
        const [accR, sumR] = await Promise.all([
            get('/api/account?accountId=' + id),
            get('/api/account/summary?accountId=' + id)
        ]);
        if (!accR || !accR.success || !accR.data) {
            toast((accR && accR.message) || '账户打不开，可能已被删除', 'err');
            return openList();
        }
        cfg = accR.data;
        summary = (sumR && sumR.success) ? sumR.data : null;
        document.getElementById('gatePanel').style.display = 'none';
        document.getElementById('listPanel').style.display = 'none';
        document.getElementById('acctPanel').style.display = '';
        render();
        await loadRecords();
        // 进来先按「今天」画一次走势，再把 3 秒刷新挂上（v1.6.7 第 ②③ 条）
        openTrend();
        startAutoRefresh();
    }

    function backToList() {
        curId = 0;
        openList();
    }

    /** 重新载入：停在哪个视图就刷哪个 */
    async function reload() {
        if (curId > 0) {
            return enterAccount(curId);
        }
        return openList();
    }

    /* ==================== 二级：当前账户 ==================== */

    function render() {
        const s = summary || {};
        document.getElementById('curName').textContent = (cfg && cfg.name) || '账户';
        document.getElementById('acctNote').textContent = '';

        renderFund();
        renderSummary(s);
        renderPositions(s.positions || []);
        renderSummaryChips(s);
        renderQuoteTip(s);
    }

    /** 账户资金：只读展示，改动统一走「维护」弹窗（需求 v1.5.5 第 ① 条） */
    function renderFund() {
        const c = cfg || {};
        const rows = [
            ['账户期初市值', money(c.initValue), ''],
            ['可用金额', money(c.cash), ''],
            ['备注', (c.remark ? esc(c.remark) : '—'), '']
        ];
        document.getElementById('fundRows').innerHTML = rows.map(r =>
            '<div class="apair">'
            + '<span class="apair-k">' + r[0] + '</span>'
            + '<span class="apair-v">' + r[1] + '</span>'
            + (r[2] ? '<span class="apair-d">' + r[2] + '</span>' : '')
            + '</div>').join('');
    }

    /** 账户统计（v1.6.9）：总资产 / 持仓市值 / 总盈亏 / 浮动盈亏 / 当日收益 */
    function renderSummary(s) {
        setKpi('kTotalValue', money(s.totalValue), '');
        setKpi('kPosValue', money(s.positionValue), '');
        document.getElementById('kPosCost').textContent = '成本 ' + money(s.positionCost);

        setKpi('kTotalProfit', moneySigned(s.totalProfit), dir(s.totalProfit));
        document.getElementById('kTotalPct').textContent = s.totalProfitPercent == null
            ? '相对账户期初市值'
            : pctSigned(s.totalProfitPercent) + '（期初 ' + money(s.initValue) + '）';

        // 浮动盈亏 = 持仓市值 - 持仓成本，收益率按持仓成本算（总盈亏则把可用金额的进出也算在内）
        setKpi('kFloatProfit', moneySigned(s.positionProfit), dir(s.positionProfit));
        const cost = Number(s.positionCost || 0);
        document.getElementById('kFloatPct').textContent = cost > 0
            ? pctSigned(Number(s.positionProfit || 0) / cost * 100) + '（成本 ' + money(s.positionCost) + '）'
            : '相对持仓成本';

        setKpi('kDayProfit', moneySigned(s.dayProfit), dir(s.dayProfit));
        // 未开盘当日收益一律 0：把口径写在副标题上，省得用户以为是没刷新
        if (s.dayStarted === false) {
            document.getElementById('kDayPct').textContent = '未开盘 · 当日收益按 0 计';
        } else {
            // 当日收益 = 持仓浮动 + 当天卖出的已实现，副标题把两个来源摊开，便于核对
            const parts = ['浮动 ' + moneySigned(s.dayFloatProfit), '已实现 ' + moneySigned(s.dayRealizedProfit)];
            if (s.dayProfitPercent != null) {
                parts.push(pctSigned(s.dayProfitPercent));
            }
            document.getElementById('kDayPct').textContent = parts.join(' · ');
        }

        // 当日操作盈亏（v1.9.0）：卖(卖价-现价) + 买(现价-买价)，按成交数量加权
        setKpi('kTradeProfit', moneySigned(s.dayTradeProfit), dir(s.dayTradeProfit));
    }

    function setKpi(id, text, cls) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.classList.remove('up', 'down');
        if (cls) el.classList.add(cls);
    }

    /** 页头摘要：期初 / 可用 / 持仓数 / 当日与已实现 */
    function renderSummaryChips(s) {
        const n = (s.positions || []).length;
        const maxP = (limits && limits.maxPositions) || 200;
        document.getElementById('asum').innerHTML =
            '<span class="achip">期初市值 ' + money(s.initValue) + '</span>'
            + '<span class="achip">可用金额 ' + money(s.cash) + '</span>'
            + '<span class="achip">持仓市值 ' + money(s.positionValue) + '</span>'
            + '<span class="achip ' + dir(s.positionProfit) + '">浮动盈亏 ' + moneySigned(s.positionProfit) + '</span>'
            + '<span class="achip ' + dir(s.dayProfit) + '">当日收益 ' + moneySigned(s.dayProfit) + '</span>'
            + '<span class="achip ' + dir(s.dayRealizedProfit) + '">当日已实现 ' + moneySigned(s.dayRealizedProfit) + '</span>'
            + '<span class="achip ' + dir(s.totalProfit) + '">总盈亏 ' + moneySigned(s.totalProfit) + '</span>'
            + '<span class="achip">' + n + ' / ' + maxP + ' 只持仓</span>';
    }

    /**
     * 现价口径标记（v1.6.7 第 ① 条）。
     *
     * <p>未开盘时新浪现价是 0，后端按昨收算市值 —— 这个口径必须写在页面上，
     * 否则用户看到「市值和昨天收盘一模一样、当日收益 0.00」会以为页面没刷新。
     */
    function priceBadge(p) {
        const basis = p.priceBasis;
        if (!basis || basis === '现价') return '';
        if (basis === '昨收') return '<span class="abadge">未开盘 · 按昨收</span>';
        if (basis === '最近价') return '<span class="abadge">行情中断 · 按最近价</span>';
        return '<span class="abadge">成本价兜底</span>';
    }

    /** 行情状态：一条行情都没取到时说明现价是哪来的，其余情况不占位 */
    function renderQuoteTip(s) {
        const ps = s.positions || [];
        const quoted = ps.filter(p => p.quoted).length;
        const preClose = ps.filter(p => p.priceBasis === '昨收').length;
        const stale = ps.filter(p => p.priceBasis === '最近价' || p.priceBasis === '成本价').length;
        const el = document.getElementById('quoteTip');
        if (!ps.length) {
            el.textContent = '';
        } else if (preClose === ps.length) {
            el.textContent = '未开盘，市值按昨收计算';
        } else if (quoted === ps.length) {
            el.textContent = preClose > 0 ? (ps.length - preClose) + ' 只现价 · ' + preClose + ' 只按昨收' : '';
        } else if (quoted === 0) {
            el.textContent = '未取到行情，市值按最近价/成本价兜底';
        } else {
            el.textContent = quoted + '/' + ps.length + ' 只已取到行情' + (stale > 0 ? '（' + stale + ' 只兜底）' : '');
        }
        document.getElementById('posCount').textContent = ps.length + ' 条';
    }

    function renderPositions(rows) {
        const body = document.getElementById('posBody');
        if (!rows.length) {
            body.innerHTML = '<tr><td class="empty" colspan="12">这本账户还没有持仓</td></tr>';
            return;
        }
        body.innerHTML = rows.map(p => {
            const dayDir = dir(p.dayProfit);
            const totDir = dir(p.totalProfit);
            const usable = usableQty(p);
            return '<tr>'
                + '<td class="code">' + esc(p.code) + '</td>'
                + '<td class="name">' + stockLinkHtml(p.code, p.name)
                + priceBadge(p)
                + (p.dayBuyQty > 0 ? '<span class="abadge abadge-day">当日买入 ' + fmtNum(p.dayBuyQty, 0) + ' 股</span>' : '')
                + '</td>'
                + '<td class="adim">' + (p.openDate ? esc(p.openDate) : '—') + '</td>'
                + '<td>' + money(p.costPrice) + '</td>'
                + '<td>' + money(p.price) + '</td>'
                + '<td>' + fmtNum(p.quantity, 0) + '</td>'
                + '<td' + (usable <= 0 ? ' class="adim"' : '') + '>' + fmtNum(usable, 0) + '</td>'
                + '<td>' + money(p.costValue) + '</td>'
                + '<td>' + money(p.marketValue) + '</td>'
                + '<td class="' + dayDir + '">' + moneySigned(p.dayProfit)
                + '<br><small>' + (p.dayProfitPercent == null ? '—' : pctSigned(p.dayProfitPercent)) + '</small>'
                + '<br><small class="adim">基准 ' + esc(p.dayBasis || '—') + '</small></td>'
                + '<td class="' + totDir + '">' + moneySigned(p.totalProfit)
                + '<br><small>' + pctSigned(p.totalProfitPercent) + '</small></td>'
                + '<td class="ops"><span class="arow-act">'
                + '<button class="btn-ghost btn-sm" onclick="openPositionModal(' + p.id + ')">改</button>'
                + '<button class="btn-ghost btn-sm" onclick="removePosition(' + p.id + ')">删</button>'
                + '</span></td>'
                + '</tr>';
        }).join('');
    }

    /* ==================== 3 秒自动刷新（v1.6.7 第 ② 条） ==================== */

    const ACCOUNT_REFRESH_MS = 3000;

    function startAutoRefresh() {
        stopAutoRefresh();
        refreshTimer = setInterval(tickAutoRefresh, ACCOUNT_REFRESH_MS);
    }

    function stopAutoRefresh() {
        if (refreshTimer) {
            clearInterval(refreshTimer);
            refreshTimer = null;
        }
        refreshBusy = false;
        refreshTick = 0;
    }

    /** 有弹窗开着就不动底下的数据：用户在填表单，别让表格在他眼皮底下重排 */
    function anyModalOpen() {
        return !!document.querySelector('.mask.show');
    }

    /**
     * 3 秒一跳：只取 summary 就地重画数字区，<b>不整页 reload</b>。
     *
     * <p>三个「不做」都是有意的：弹窗开着不刷、页面在后台不刷、失败不弹提示 ——
     * 轮询失败下一跳自然会重试，弹 toast 只会刷屏，还会让人以为账户出了大问题。
     */
    async function tickAutoRefresh() {
        const accountId = curId;
        if (!accountId || document.hidden || refreshBusy || anyModalOpen()) {
            return;
        }
        refreshBusy = true;
        try {
            const headers = {};
            const at = authToken();
            if (at) {
                headers['X-Auth-Token'] = at;
            }
            const res = await fetch('/api/account/summary?accountId=' + accountId, {headers});
            if (res.status === 401) {
                stopAutoRefresh();
                return onUnauthorized();
            }
            if (!res.ok) return;
            const json = await res.json();
            if (!json || !json.success || !json.data || curId !== accountId) return;
            summary = json.data;
            // 可用金额会随买卖变化，账户资金卡跟着一起动，别让两张卡说的不是一回事
            cfg = Object.assign({}, cfg, {cash: summary.cash, initValue: summary.initValue});
            renderFund();
            renderSummary(summary);
            renderPositions(summary.positions || []);
            renderSummaryChips(summary);
            renderQuoteTip(summary);
            refreshTick++;
            // 走势一分钟只有一个点，30 秒刷一次足够；只刷「今天」那张
            if (refreshTick % 10 === 0) {
                refreshTrendIfToday();
            }
        } catch (e) {
            // 静默：轮询失败不打扰用户
        } finally {
            refreshBusy = false;
        }
    }

    /* ==================== 账户 1 分钟走势（v1.6.7 第 ③ 条） ==================== */

    /** 交易时段：轴上的分钟点就按这两段铺（与后端采样窗口一致） */
    const TREND_SESSIONS = [[9, 30, 11, 30], [13, 0, 15, 0]];

    let trendAxisCache = null;
    let trendChart = null;
    let trendDate = '';          // 当前查看的日期（yyyy-MM-dd）
    let trendMap = new Map();    // minute → 原始采样点，tooltip 用它补「当日收益」

    function pad2(n) {
        return n < 10 ? '0' + n : String(n);
    }

    function minuteOf(totalMinutes) {
        return pad2(Math.floor(totalMinutes / 60)) + ':' + pad2(totalMinutes % 60);
    }

    /** 全天分钟轴：09:30–11:30 + 13:00–15:00，共 242 个点 */
    function trendAxis() {
        if (trendAxisCache) return trendAxisCache;
        const out = [];
        TREND_SESSIONS.forEach(function (s) {
            for (let t = s[0] * 60 + s[1]; t <= s[2] * 60 + s[3]; t++) {
                out.push(minuteOf(t));
            }
        });
        trendAxisCache = out;
        return out;
    }

    /**
     * 轴画到哪为止：往日画全天；今天按「现在」截断（开盘前没有点，午休停在 11:30，收盘后画满）。
     */
    function trendEndIndex(date) {
        const axis = trendAxis();
        if (date !== today()) return axis.length - 1;
        const now = new Date();
        const cur = now.getHours() * 60 + now.getMinutes();
        if (cur < 9 * 60 + 30) return -1;
        if (cur > 15 * 60) return axis.length - 1;
        const stop = (cur > 11 * 60 + 30 && cur < 13 * 60) ? '11:30' : minuteOf(cur);
        const idx = axis.indexOf(stop);
        return idx >= 0 ? idx : axis.length - 1;
    }

    /**
     * 把稀疏的采样点铺到分钟轴上：<b>缺失的分钟一律用前一个值补</b>（画成横线），
     * 头部缺失（服务中途才起来）用第一个有值的点往前补。
     *
     * @param field 取哪个字段：dayProfit（当日盈亏，纵轴画的就是它）/ totalValue
     * @return 与轴等长的数值数组；一个点都没有时返回 null
     */
    function trendValues(points, endIdx, field) {
        const axis = trendAxis();
        const key = field || 'dayProfit';
        trendMap = new Map();
        (points || []).forEach(function (p) {
            if (p && p.minute) trendMap.set(p.minute, p);
        });
        const values = [];
        let last = null;
        for (let i = 0; i <= endIdx; i++) {
            const p = trendMap.get(axis[i]);
            if (p && p[key] !== null && p[key] !== undefined) {
                last = Number(p[key]);
            }
            values.push(last);
        }
        const firstIdx = values.findIndex(function (v) { return v !== null; });
        if (firstIdx < 0) return null;
        for (let i = 0; i < firstIdx; i++) {
            values[i] = values[firstIdx];
        }
        return values;
    }

    function themeVar(name, fallback) {
        const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return v || fallback;
    }

    /** #rrggbb → 带透明度的颜色（CSS 给的是 rgb() 时不加透明度，退回原色） */
    function withAlpha(color, alpha) {
        const c = String(color || '').trim();
        if (/^#[0-9a-f]{6}$/i.test(c)) {
            return c + Math.round(alpha * 255).toString(16).padStart(2, '0');
        }
        return c;
    }

    /** 纵轴盈亏简写：带正负号（盈亏有方向，轴上的数字不标符号等于没说），万以上折成「万」 */
    function shortMoneySigned(v) {
        const n = Number(v);
        if (!isFinite(n)) return '—';
        const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
        const a = Math.abs(n);
        if (a >= 10000) return sign + (a / 10000).toFixed(2) + '万';
        if (a >= 1000) return sign + a.toFixed(0);
        return sign + a.toFixed(2);
    }

    function renderTrend(data) {
        const box = document.getElementById('trendChart');
        const empty = document.getElementById('trendEmpty');
        const note = document.getElementById('trendNote');
        const date = (data && data.date) || trendDate || today();
        const endIdx = trendEndIndex(date);
        const axis = trendAxis().slice(0, endIdx + 1);
        // 纵轴画「当日盈亏」（元），不是总市值：市值里万位数上下浮动几十块，涨跌看不出来
        const values = endIdx >= 0 ? trendValues((data && data.points) || [], endIdx, 'dayProfit') : null;

        if (!values || !values.length) {
            if (trendChart) trendChart.clear();
            box.style.display = 'none';
            empty.style.display = '';
            empty.textContent = date === today()
                ? '今天还没有走势数据：开盘后每分钟记一个点'
                : '这一天没有走势数据（走势自 v1.6.7 起按分钟采集，只保留最近 45 天）';
            note.textContent = date + ' · 1 分钟 · 当日盈亏';
            return;
        }

        box.style.display = '';
        empty.style.display = 'none';
        if (!trendChart) {
            trendChart = echarts.init(box);
        }
        trendChart.resize();

        const up = themeVar('--up', '#d32029');
        const down = themeVar('--down', '#0f8a4d');
        const last = Number(values[values.length - 1]) || 0;
        // 盈利红、亏损绿：以 0 为界，跟金额的正负一致（不看首尾差）
        const color = last >= 0 ? up : down;

        // 轴区间必须含 0（0 就是「不赚不亏」的基准线），上下各留一点余量；
        // 全天都是 0 的时候区间会塌成一条线，这里兜成 ±1
        let lo = 0;
        let hi = 0;
        values.forEach(function (v) {
            const n = Number(v);
            if (!isFinite(n)) return;
            if (n < lo) lo = n;
            if (n > hi) hi = n;
        });
        if (lo === 0 && hi === 0) {
            lo = -1;
            hi = 1;
        }
        const pad = (hi - lo) * 0.08;

        trendChart.setOption({
            animation: false,
            grid: {left: 6, right: 14, top: 18, bottom: 4, containLabel: true},
            tooltip: {
                trigger: 'axis',
                backgroundColor: themeVar('--bg-panel', '#fff'),
                borderColor: themeVar('--border-soft', '#e8ebf0'),
                textStyle: {color: themeVar('--text-strong', '#0b0f18'), fontSize: 12},
                formatter: function (ps) {
                    if (!ps || !ps.length) return '';
                    const i = ps[0].dataIndex;
                    const minute = axis[i];
                    const p = trendMap.get(minute);
                    const v = Number(ps[0].value) || 0;
                    let html = '<div style="font-variant-numeric:tabular-nums">' + esc(minute)
                        + '　当日盈亏 <b style="color:' + (v >= 0 ? up : down) + '">'
                        + moneySigned(v) + '</b></div>';
                    if (p && p.totalValue !== null && p.totalValue !== undefined) {
                        html += '<div style="margin-top:2px;color:' + themeVar('--text-dim', '#6b7280')
                            + '">总市值 ' + money(p.totalValue) + '</div>';
                    }
                    return html;
                }
            },
            xAxis: {
                type: 'category',
                data: axis,
                boundaryGap: false,
                axisLine: {lineStyle: {color: themeVar('--border-soft', '#e8ebf0')}},
                axisTick: {show: false},
                axisLabel: {
                    color: themeVar('--text-dim', '#6b7280'),
                    fontSize: 11,
                    interval: function (index, value) {
                        return ['09:30', '10:30', '11:30', '13:30', '14:30', '15:00'].indexOf(value) >= 0;
                    }
                }
            },
            yAxis: {
                type: 'value',
                scale: true,
                min: lo - pad,
                max: hi + pad,
                splitLine: {lineStyle: {color: themeVar('--border-soft', '#e8ebf0')}},
                axisLabel: {
                    color: themeVar('--text-dim', '#6b7280'),
                    fontSize: 11,
                    formatter: shortMoneySigned
                }
            },
            series: [{
                type: 'line',
                data: values,
                showSymbol: false,
                symbol: 'none',
                lineStyle: {width: 2, color: color},
                itemStyle: {color: color},
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        {offset: 0, color: withAlpha(color, 0.26)},
                        {offset: 1, color: withAlpha(color, 0)}
                    ])
                },
                // 0 轴单独描一条：一眼看出现在是赚还是亏
                markLine: {
                    silent: true,
                    symbol: 'none',
                    label: {show: false},
                    lineStyle: {color: themeVar('--border', '#d0d5dd'), width: 1, type: 'solid'},
                    data: [{yAxis: 0}]
                }
            }]
        }, true);

        note.textContent = date + ' · ' + values.length + ' 分钟 · 当日盈亏';
    }

    /** 拉某一天的走势；失败静默（图留着上一次的样子，比清空更不容易误导） */
    async function loadTrend() {
        if (!curId) return;
        const date = trendDate || today();
        let r = null;
        try {
            r = await get('/api/account/trend?accountId=' + curId + '&date=' + encodeURIComponent(date));
        } catch (e) {
            return;
        }
        if (!r || !r.success || !r.data) return;
        trendDate = r.data.date || date;
        const input = document.getElementById('trendDate');
        if (input && input.value !== trendDate) input.value = trendDate;
        renderTrend(r.data);
    }

    /** 进入账户时先把走势复位到「今天」 */
    function openTrend() {
        const input = document.getElementById('trendDate');
        trendDate = today();
        if (input) {
            input.max = trendDate;
            input.value = trendDate;
        }
        loadTrend();
    }

    function refreshTrendIfToday() {
        if (curId && (!trendDate || trendDate === today())) {
            loadTrend();
        }
    }

    function onTrendDateChange(value) {
        const picked = String(value || '').trim();
        if (!picked) {
            return;
        }
        if (picked > today()) {
            toast('还不能看未来日期的走势', 'err');
            const input = document.getElementById('trendDate');
            if (input) input.value = trendDate || today();
            return;
        }
        trendDate = picked;
        loadTrend();
    }

    function pickTrendToday() {
        const input = document.getElementById('trendDate');
        if (input) input.value = today();
        trendDate = today();
        loadTrend();
    }

    /* ==================== 账户弹窗（新建 / 重命名） ==================== */

    let accountMode = 'create';
    /**
     * 弹窗正在处理哪本账的那份快照。
     *
     * <p>列表态没有 curId，而且 cfg 里装的是「上一次进二级时那本账」——
     * 拿它当重命名的基准会把别本账的期初/可用一起写过去，所以目标账单独记。
     */
    let accountTarget = null;

    function openAccountModal(mode, id) {
        accountMode = mode;
        accountTarget = (mode === 'rename' && id)
            ? ((overview && (overview.accounts || []).find(a => a.id === id))
                || (cfg && cfg.id === id ? cfg : null))
            : null;
        const targetId = accountTarget ? accountTarget.id : (id || 0);

        let mask = document.getElementById('accMask');
        if (!mask) {
            mask = document.createElement('div');
            mask.className = 'mask';
            mask.id = 'accMask';
            mask.innerHTML = '<div class="modal" style="width:440px">'
                + '<h3 id="accTitle">新建账户</h3>'
                + '<div class="field"><label for="accName">账户名称</label>'
                + '<input type="text" id="accName" maxlength="32" autocomplete="off" spellcheck="false"></div>'
                + '<div class="field acc-only-create"><label for="accInit">期初市值（元）</label>'
                + '<input type="number" id="accInit" min="0" step="1000" inputmode="decimal"></div>'
                + '<div class="field acc-only-create"><label for="accCash">可用金额（元）</label>'
                + '<input type="number" id="accCash" step="1000" inputmode="decimal"></div>'
                + '<div class="modal-actions">'
                + '<button class="btn-ghost" id="accCancel">取消</button>'
                + '<button id="accSave">保存</button>'
                + '</div></div>';
            document.body.appendChild(mask);
            mask.querySelector('#accCancel').addEventListener('click', () => mask.classList.remove('show'));
            mask.addEventListener('mousedown', e => {
                if (e.target === mask) mask.classList.remove('show');
            });
            mask.querySelector('#accSave').addEventListener('click', submitAccountModal);
        }
        mask.setAttribute('data-target', String(targetId));
        mask.querySelector('#accTitle').textContent = accountTarget ? '重命名账户' : '新建账户';
        mask.querySelector('#accName').value = accountTarget ? (accountTarget.name || '') : '';
        mask.querySelector('#accInit').value = accountTarget ? accountTarget.initValue : '';
        mask.querySelector('#accCash').value = accountTarget ? accountTarget.cash : '';
        mask.classList.toggle('rename', !!accountTarget);
        mask.classList.add('show');
        setTimeout(() => mask.querySelector('#accName').focus(), 30);
    }

    async function submitAccountModal() {
        const name = document.getElementById('accName').value.trim();
        if (!name) {
            return toast('账户名称不能为空', 'err');
        }
        const targetId = Number(document.getElementById('accMask').getAttribute('data-target') || 0);
        if (accountMode === 'create') {
            const initRaw = document.getElementById('accInit').value;
            const cashRaw = document.getElementById('accCash').value;
            const init = String(initRaw).trim() === '' ? 0 : parseFloat(initRaw);
            const cash = String(cashRaw).trim() === '' ? 0 : parseFloat(cashRaw);
            if (isNaN(init) || init < 0) {
                return toast('期初市值要填一个不小于 0 的数字', 'err');
            }
            if (isNaN(cash)) {
                return toast('可用金额要填一个数字', 'err');
            }
            const r = await post('/api/account/accounts', {name: name, initValue: init, cash: cash});
            if (!r || !r.success) return;
            document.getElementById('accMask').classList.remove('show');
            toast(r.message || '账户已创建', 'ok');
            await reload();
            return;
        }
        // 重命名：只改名字，期初/可用/备注照目标账原值回写
        const r = await put('/api/account/accounts/' + targetId, {
            name: name,
            initValue: accountTarget ? accountTarget.initValue : 0,
            cash: accountTarget ? accountTarget.cash : 0,
            remark: accountTarget ? accountTarget.remark : null
        });
        if (!r || !r.success) return;
        document.getElementById('accMask').classList.remove('show');
        toast('账户名已更新', 'ok');
        await reload();
    }

    async function removeAccount(id) {
        const row = (overview && overview.accounts || []).find(a => a.id === id);
        const label = row ? row.name : id;
        if (!confirm('确定删除账户「' + label + '」？这本账下的持仓与操作记录会一并删除。')) {
            return;
        }
        const r = await del('/api/account/accounts/' + id);
        if (r && r.success) {
            toast('账户已删除', 'ok');
            if (curId === id) curId = 0;
            await openList();
        }
    }

    /* ============ 单账户导出 / 导入（v1.5.6 第 ③ 条） ============ */

    /** 导出：把「账户 + 持仓 + 操作记录」打包成一个 zip 存到本机 */
    async function exportAccount(id) {
        const row = (overview && overview.accounts || []).find(a => a.id === id);
        const name = (row && row.name) || '账户';
        const headers = {};
        const at = authToken();
        if (at) {
            headers['X-Auth-Token'] = at;
        }
        try {
            const res = await fetch('/api/account/export?accountId=' + id, {headers});
            if (res.status === 401) {
                return onUnauthorized();
            }
            if (!res.ok) {
                return toast('导出失败（' + res.status + '）', 'err');
            }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name + '-账户导出-' + today().replace(/-/g, '') + '.zip';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            toast('已导出「' + name + '」', 'ok');
        } catch (e) {
            toast('导出失败：' + e.message, 'err');
        }
    }

    /**
     * 上传导入文件：服务端解析后<b>新建一本账</b>，不动现有账户。
     *
     * <p>FormData 走 multipart，用的还是同一个登录令牌（请求头），不另起一套鉴权。
     */
    async function submitImport(input) {
        const file = input && input.files && input.files[0];
        if (!file) {
            return;
        }
        const form = new FormData();
        form.append('file', file, file.name);
        const headers = {};
        const at = authToken();
        if (at) {
            headers['X-Auth-Token'] = at;
        }
        let r = null;
        try {
            const res = await fetch('/api/account/import', {method: 'POST', body: form, headers});
            if (res.status === 401) {
                return onUnauthorized();
            }
            r = await res.json();
        } catch (e) {
            return toast('导入失败：' + e.message, 'err');
        }
        if (!r || !r.success) {
            return toast((r && r.message) || '导入失败', 'err');
        }
        toast(r.message || '已导入', 'ok');
        await openList();
    }

    async function submitPosition() {

            return toast('可用数量要填一个不小于 0 的数字', 'err');
        }

            return toast('可用数量不能超过持仓数量（' + fmtNum(qty, 0) + ' 股）', 'err');

    /* ============ 操作记录（列表 + 「添加操作记录」弹窗） ============ */

    /**
     * 「卖出」的候选标的：这本账户里<b>可用数量 > 0</b> 的持仓。
     *
     * <p>返回 null 表示「买入」—— 买入走名录（新标的也要能买），不走这个清单。
     */
    function sellCandidates() {
        if (recAction !== 'sell') return null;
        return (summary && summary.positions || [])
            .filter(p => usableQty(p) > 0)
            .map(p => ({code: p.code, name: p.name || '', qty: usableQty(p)}));
    }

    /** 当前账户里某个代码的持仓（没有返回 null） */
    function findPosition(code) {
        return (summary && summary.positions || []).find(p => p.code === code) || null;
    }

    /** 记录的时间列：成交日期 + 录入时刻 */
    function recordWhen(x) {
        const d = x.tradeDate || '';
        const t = x.time || '';
        const hms = t.length >= 19 ? t.slice(11) : '';
        if (d && hms) return d + ' ' + hms;
        return d || t;
    }

    /** 这条记录算在哪一天：成交日期优先；v1.5.6 之前的老数据没有 tradeDate，退回录入时刻 */
    function recDayOf(x) {
        if (!x) return '';
        if (x.tradeDate) return String(x.tradeDate).slice(0, 10);
        return x.time ? String(x.time).slice(0, 10) : '';
    }

    /** 只要时刻（当天视图里日期列不必每行重复一遍今天） */
    function recClock(x) {
        const t = String((x && x.time) || '');
        return t.length >= 19 ? t.slice(11) : (t || recDayOf(x));
    }

    /**
     * 切换「当天 / 历史」。
     *
     * <p>过滤放在页面做：每本账的操作记录最多留 200 条（后端 trimRecords），
     * 全量一次拿回来在手上切，比每换一次视图再发一次请求更快，也省掉给两套仓储加日期条件。
     */
    function setRecScope(scope) {
        recScope = scope === 'all' ? 'all' : 'today';
        const box = document.getElementById('recScope');
        if (box) {
            box.querySelectorAll('button').forEach(function (b) {
                b.classList.toggle('on', b.getAttribute('data-scope') === recScope);
            });
        }
        const head = document.getElementById('recDateHead');
        if (head) head.textContent = recScope === 'today' ? '时间' : '日期';
        renderRecords(recRows);
    }

    /** 一组记录里卖出的盈亏合计：组头小计，便于回看那天赚亏多少 */
    function realizedSum(rows) {
        let sum = 0;
        let has = false;
        (rows || []).forEach(function (x) {
            const p = recProfit(x);
            if (p === null) return;
            const n = Number(p);
            if (isNaN(n)) return;
            sum += n;
            has = true;
        });
        return has ? ' · 盈亏 ' + moneySigned(sum) : '';
    }

    /**
     * 一条记录该显示多少盈亏。
     *
     * 今天买入的看后端补的 dayProfit（现价 - 买入价）；卖出的看结算时算好的已实现。
     * 历史买入两者都没有，返回 null 让调用方画横杠 —— 拿今天的价去算几个月前的买入不叫盈亏。
     */
    function recProfit(x) {
        if (x.dayProfit !== null && x.dayProfit !== undefined) return x.dayProfit;
        if (x.action === 'sell' && x.realizedProfit !== null && x.realizedProfit !== undefined) {
            return x.realizedProfit;
        }
        return null;
    }

    function recRowHtml(x, onlyClock) {
        const buy = x.action === 'buy';
        // 「当天」标记：成交日期就是今天，这笔量的当日盈亏从买入价起算（卖出恒为 false）
        const same = x.sameDay ? '<span class="arec-tag">当天</span>' : '';
        const profit = recProfit(x);
        return '<div class="arec-row">'
            + '<span class="arec-act ' + (buy ? 'buy' : 'sell') + '">' + (buy ? '买入' : '卖出') + '</span>'
            + '<span class="arec-time">'
            + stockLinkHtml(x.code, x.name, {text: x.name || x.code})
            + ' · ' + esc(x.code) + same + '</span>'
            + '<span>' + money(x.price) + ' 元</span>'
            + '<span>' + fmtNum(x.quantity, 0) + ' 股</span>'
            + '<span class="' + dir(profit) + '">'
            + (profit === null ? '—' : moneySigned(profit)) + '</span>'
            + '<span class="arec-time">' + esc(onlyClock ? recClock(x) : recordWhen(x)) + '</span>'
            + '</div>';
    }

    function renderRecords(rows) {
        const box = document.getElementById('recList');
        if (!box) return;
        const all = rows || [];
        const day = today();
        const note = document.getElementById('recCount');

        if (recScope === 'today') {
            const todays = all.filter(function (x) { return recDayOf(x) === day; });
            if (note) note.textContent = all.length ? '当天 ' + todays.length + ' 笔 · 共 ' + all.length + ' 笔' : '';
            if (!todays.length) {
                box.innerHTML = '<div class="arec-empty">今天还没有操作记录，切到「历史」可以看往期</div>';
                return;
            }
            box.innerHTML = todays.map(function (x) { return recRowHtml(x, true); }).join('');
            return;
        }

        // 历史：按成交日期分组，日期新的在上；组内按录入时刻倒序
        const sorted = all.slice().sort(function (a, b) {
            const da = recDayOf(a);
            const db = recDayOf(b);
            if (da !== db) return da < db ? 1 : -1;
            return String(b.time || '').localeCompare(String(a.time || ''));
        });
        if (note) {
            note.textContent = all.length
                ? '全部 ' + all.length + ' 笔' + (all.length >= 200 ? '（每账户最多留 200 条）' : '')
                : '';
        }
        if (!sorted.length) {
            box.innerHTML = '<div class="arec-empty">这本账户还没有操作记录</div>';
            return;
        }

        let html = '';
        let i = 0;
        while (i < sorted.length) {
            const d = recDayOf(sorted[i]);
            const group = [];
            while (i < sorted.length && recDayOf(sorted[i]) === d) {
                group.push(sorted[i]);
                i++;
            }
            html += '<div class="arec-day">'
                + '<span class="arec-day-d">' + esc(d || '未标注日期') + (d === day ? ' · 今天' : '') + '</span>'
                + '<span class="arec-day-n">' + group.length + ' 笔' + realizedSum(group) + '</span>'
                + '</div>';
            html += group.map(function (x) { return recRowHtml(x, false); }).join('');
        }
        box.innerHTML = html;
    }

    async function loadRecords() {
        const r = await get('/api/account/records?accountId=' + curId);
        recRows = (r && r.success && r.data) ? r.data : [];
        setRecScope(recScope);

                + '<div class="field"><label for="recPrice">成交价（元）</label>'
                + '<input type="number" id="recPrice" min="0" step="0.01" inputmode="decimal"></div>'
                + '<div class="modal-note" id="recAmountNote" style="display:none"></div>'
                + '<div class="field" id="recDateField"><label for="recDate">日期</label>'
                + '<input type="date" id="recDate"></div>'

                + '<div class="modal-note" id="recNote" style="display:none"></div>'

            mask.querySelector('#recDate').addEventListener('change', syncDateHint);

                multiple: false,
                // 卖出只认持仓：候选就是持仓里还有可用数量的那些，名录与手输一律不认
                source: sellCandidates,
                allowManual: () => recAction === 'buy' && typeof MODE !== 'undefined' && !!MODE.noDb,
                emptyTip: () => recAction === 'sell' ? '这本账户里没有可卖出的持仓' : '',
                // 选完标的自动带出成交价，并把「可用数量」摆到明面上
                onChange: () => { paintRecordNote(); fillPrice(true); }

    /** 方向切换：按钮高亮 + 候选清单 + 「当天」勾选框的显隐一起跟着走 */
    function syncRecordModal() {
        const buy = recAction === 'buy';
        const box = document.getElementById('recAction');
        if (box) {
            box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.getAttribute('data-act') === recAction));
        }
        if (recPicker) {
            recPicker.setPlaceholder(buy ? '代码或名称' : '从持仓中选择');
            // 换方向尽量保留已选：只有「卖出时选的标的不在可卖清单里」才清掉，
            // 别让用户白选一遍
            const kept = recPicker.getFirst();
            if (kept && kept.code) {
                const pos = findPosition(kept.code);
                if (buy || (pos && usableQty(pos) > 0)) {
                    recPicker.setItems([{code: kept.code, name: kept.name || ''}]);
                } else {
                    recPicker.setItems([]);
                }
            }
            recPicker.refresh('');
        }
        syncDateField();
        paintRecordNote();
        paintAmount();
    }

    /** 成交日期是否补录（不是今天） */
    function isBackfill() {
        const d = document.getElementById('recDate');
        return !!d && !!d.value && d.value !== today();
    }

    /** 日期只给买入填：卖出就是此刻成交的，填日期没意义，直接收起 */
    function syncDateField() {
        const buy = recAction === 'buy';
        const field = document.getElementById('recDateField');
        if (field) field.style.display = buy ? '' : 'none';
        syncDateHint();
    }

    /** 补录时提示一句：这笔只改持仓与可用金额，不计当日盈亏 */
    function syncDateHint() {
        const hint = document.getElementById('recDateHint');
        const show = !!(hint && recAction === 'buy' && isBackfill());
        if (hint) hint.style.display = show ? '' : 'none';
    }

    /** 这笔的成交额与资金影响：买入显示成交后剩余可用，卖出显示预计回笼 */
    function paintAmount() {
        const box = document.getElementById('recAmountNote');
        if (!box) return;
        const qty = parseInt(document.getElementById('recQty').value, 10);
        const price = parseFloat(document.getElementById('recPrice').value);
        if (!qty || qty <= 0 || isNaN(price) || price <= 0) {
            box.style.display = 'none';
            box.textContent = '';
            return;
        }
        const amt = qty * price;
        const parts = ['成交额 ' + money(amt) + ' 元'];
        if (summary && summary.cash != null) {
            if (recAction === 'buy') {
                const left = summary.cash - amt;
                parts.push('成交后可用 ' + money(left) + ' 元' + (left < 0 ? '（超出可用金额）' : ''));
            } else {
                parts.push('预计回笼 ' + money(amt) + ' 元');
            }
        }
        box.textContent = parts.join(' · ');
        box.style.display = '';
    }

    /**
     * 弹窗里的上下文提示行：卖出摆「可用数量」（并压住数量输入的上限），
     * 买入摆「已持有 N 股 · 加仓后成本约 X」，让加仓前心里有数。没要写的就收掉。
     */
    function paintRecordNote() {
        const note = document.getElementById('recNote');
        const qty = document.getElementById('recQty');
        if (!note) return;
        const picked = recPicker ? recPicker.getFirst() : null;
        const pos = picked ? findPosition(picked.code) : null;
        const lines = [];
        if (recAction === 'sell') {
            const usable = pos ? usableQty(pos) : 0;
            if (qty) {
                if (pos) {
                    qty.setAttribute('max', String(Math.max(usable, 0)));
                } else {
                    qty.removeAttribute('max');
                }
            }
            if (pos) {
                lines.push('可用 ' + fmtNum(usable, 0) + ' 股（卖出上限）');
            }
        } else if (qty) {
            qty.removeAttribute('max');
        }
        if (recAction === 'buy' && pos) {
            const held = Number(pos.quantity) || 0;
            const q = qty ? parseInt(qty.value, 10) : 0;
            const pr = parseFloat(document.getElementById('recPrice').value);
            let extra = '';
            if (q > 0 && pr > 0 && pos.costPrice != null && held + q > 0) {
                const cost = (held * pos.costPrice + q * pr) / (held + q);
                extra = ' · 加仓后成本约 ' + money(cost) + ' 元';
            }
            lines.push('已持有 ' + fmtNum(held, 0) + ' 股' + extra);
        }
        const text = lines.join('；');
        note.textContent = text;
        note.style.display = text ? '' : 'none';
    }

    function bindActionSegment() {
        const box = document.getElementById('recAction');
        if (!box) return;
        box.querySelectorAll('button').forEach(b => {
            b.addEventListener('click', () => {
                recAction = b.getAttribute('data-act');
                syncRecordModal();
                // 切到买入时若价格还空着就带出行情价；用户手填过的值不覆盖
                if (recAction === 'buy') {
                    fillPrice(false);
                }
            });
        });
    }

    async function submitRecord() {
        const picked = recPicker ? recPicker.getFirst() : null;
        if (!picked || !picked.code) {
            if (recAction === 'sell' && recPicker && recPicker.hasUnresolvedInput()) {
                return toast('卖出只能选持仓里的标的，请从下拉列表中点选', 'err');
            }
            return toast('请选择操作标的', 'err');
        }
        const qty = parseInt(document.getElementById('recQty').value, 10);
        if (isNaN(qty) || qty <= 0) {
            return toast('数量必须大于 0', 'err');
        }
        if (recAction === 'sell') {
            const pos = findPosition(picked.code);
            if (!pos) {
                return toast('这本账户里没有 ' + (picked.name || picked.code) + ' 的持仓，无法卖出', 'err');
            }
            const usable = usableQty(pos);
            if (usable <= 0) {
                return toast((pos.name || pos.code) + ' 当前没有可卖出的数量', 'err');
            }
            if (qty > usable) {
                return toast('卖出数量不能超过可用数量 ' + fmtNum(usable, 0) + ' 股', 'err');
            }
        }
        const priceRaw = document.getElementById('recPrice').value;
        let price = null;
        if (String(priceRaw).trim() !== '') {
            price = parseFloat(priceRaw);
            if (isNaN(price) || price <= 0) {
                return toast('成交价必须大于 0', 'err');
            }
        }
        if (recAction === 'buy') {
            const held = findPosition(picked.code);
            if (price == null && !held) {
                // 没持仓的标的后端没有成本价可以兜底，别让这笔糊里糊涂地记进去
                return toast('请填成交价：' + (picked.name || picked.code) + ' 还没有持仓，无法自动补价', 'err');
            }
            if (price != null && summary && summary.cash != null && qty * price > summary.cash) {
                return toast('成交额 ' + money(qty * price) + ' 元超出可用金额 ' + money(summary.cash) + ' 元', 'err');
            }
        }
        const btn = document.getElementById('recSave');
        btn.disabled = true;
        try {
            const body = {
                action: recAction,
                code: picked.code,
                name: picked.name || '',
                quantity: qty,
                // 卖出恒为今天：日期框在卖出时是收起的，别拿残留值去补录
                date: recAction === 'sell' ? today() : (document.getElementById('recDate').value || today())
            };
            if (price != null) {
                body.price = price;
            }
            const r = await post('/api/account/records?accountId=' + curId, body);
            if (!r || !r.success) {
                return;
            }
            document.getElementById('recMask').classList.remove('show');
            toast(r.message || '已生效', 'ok');
            // 刚记的这一笔必须能看见：补录的是历史日期就自动切到「历史」，别让用户以为没记上
            recScope = body.date === today() ? 'today' : 'all';
            await enterAccount(curId);
        } finally {
            btn.disabled = false;
        }
    }

    /**
     * 选好标的后预填成交价：取该标的实时行情价（取不到由后端回落到持仓成本价）。
     *
     * @param {boolean} force true = 无条件覆盖（换了标的）；false = 只在还空着时填
     */
    async function fillPrice(force) {
        const picked = recPicker ? recPicker.getFirst() : null;
        const input = document.getElementById('recPrice');
        if (!picked || !picked.code || !input) {
            return;
        }
        if (!force && String(input.value).trim() !== '') {
            return;
        }
        input.placeholder = '行情获取中…';
        try {
            const r = await get('/api/account/price?accountId=' + curId + '&code=' + encodeURIComponent(picked.code));
            if (r && r.success && r.data && r.data.price != null) {
                input.value = r.data.price;
            } else {
                // 带不出价格不无声：留在输入框上说明，别让用户以为点了没反应
                input.placeholder = '未能自动带出，请手动填写';
            }
        } catch (e) {
            input.placeholder = '未能自动带出，请手动填写';
        } finally {
            if (input.placeholder === '行情获取中…') {
                input.placeholder = '';
            }
            paintAmount();
        }
    }

    /* ============ 初始化 ============ */

    (async function init() {
        await loadMode();
        if (!(await requireLogin())) {
            return;
        }
        // 持仓与操作记录里的标的要渲染成跳转链接，配置先拿到
        await loadStockLink();
        // 走势图跟着窗口缩放；页面切换主题会重载，这里只处理尺寸
        window.addEventListener('resize', function () {
            if (trendChart) trendChart.resize();
        });
        const lr = await get('/api/account/limits');
        if (lr && lr.success) {
            limits = lr.data;
        }
        // 地址栏里的 hash 优先：刷新 / 分享链接能直接落到那本账
        const initial = hashAccountId();
        if (initial > 0) {
            await enterAccount(initial, true);
        } else {
            await openList();
        }
    })();
</script>
</body>
</html>
