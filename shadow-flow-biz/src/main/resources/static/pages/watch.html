<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{var t=localStorage.getItem("shadowflow_theme")||localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <title>盯盘</title>
    <link rel="stylesheet" href="/css/common.css?v=20261020b">
    <link rel="stylesheet" href="/css/watch.css?v=20261011e">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">影流数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <section class="panel" id="gatePanel" style="display:none">
        <h2>盯盘</h2>
        <div class="modal-actions">
            <button onclick="openAuthModal({onSuccess: reload})">去登录</button>
        </div>
    </section>

    <div id="cfgPanel" style="display:none">

        <!-- ============ 页头：标题 + 实时摘要 + 动作 ============ -->
        <div class="whead">
            <div class="whead-l">
                <h1 class="whead-t">盯盘</h1>
                <div class="wsum" id="wsum"></div>
            </div>
            <div class="whead-r">
                <button class="btn-ghost" onclick="reload()">重新载入</button>
                <button onclick="save()" id="btnSave">保存</button>
            </div>
        </div>

        <div class="wgrid">

            <!-- ① 运行 -->
            <section class="wcard wcard-q">
                <header class="wcard-hd">
                    <span class="wcard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></span>
                    <h2>运行</h2>
                </header>
                <div class="wcard-bd">
                    <label class="sw">
                        <input type="checkbox" id="fEnabled">
                        <span class="sw-track" aria-hidden="true"></span>
                        <span class="sw-txt">定时盯盘</span>
                    </label>
                    <div class="field">
                        <label for="fInterval">检查间隔</label>
                        <div class="unit-input">
                            <input type="number" id="fInterval" min="3" max="3600" step="1" inputmode="numeric">
                            <span class="unit">秒</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ② 涨跌停放量 -->
            <section class="wcard wcard-q">
                <header class="wcard-hd">
                    <span class="wcard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l4-6 4 3 4-7 3 4"/><path d="M3 21h18"/></svg></span>
                    <h2>封板放量</h2>
                </header>
                <div class="wcard-bd">
                    <div class="field">
                        <label for="fSurgeAmount">单轮成交额 ≥</label>
                        <div class="unit-input">
                            <input type="number" id="fSurgeAmount" min="1" step="10" inputmode="decimal">
                            <span class="unit">万元</span>
                        </div>
                    </div>
                    <div class="field">
                        <label for="fSurgeTimes">或 环比上一轮 ≥</label>
                        <div class="unit-input">
                            <input type="number" id="fSurgeTimes" min="1" step="0.5" inputmode="decimal">
                            <span class="unit">倍</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ③ 推送 -->
            <section class="wcard wcard-q">
                <header class="wcard-hd">
                    <span class="wcard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3L11 14"/><path d="M22 3l-7 18-4-7-7-4z"/></svg></span>
                    <h2>推送</h2>
                    <span class="wcard-note" id="pushTarget"></span>
                </header>
                <div class="wcard-bd">
                    <div class="field">
                        <label for="fWebhook">我的钉钉机器人<span class="hint-q" tabindex="0" role="button" aria-label="推送机器人说明">?<span class="hint-box">这里填的是<b>你自己的群</b>，只影响你自己的盯盘告警。<span class="hint-li">留空表示用平台默认群：平台级的<b>系统通知机器人</b>，在「系统配置 → 第三方对接」由超管维护。</span></span></span></label>
                        <input type="text" id="fWebhook" autocomplete="off" spellcheck="false"
                               placeholder="留空则推送到平台默认群">
                    </div>
                </div>
            </section>

            <!-- ④ 涨跌幅告警 -->
            <section class="wcard wcard-f">
                <header class="wcard-hd">
                    <span class="wcard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3.5-4 3 2.5L20 6"/></svg></span>
                    <h2>涨跌幅告警</h2>
                </header>
                <div class="wcard-bd">
                    <div class="rule-list" id="ruleBox"></div>
                    <button type="button" class="btn-ghost btn-sm rr-add" onclick="addRule()">
                        <span aria-hidden="true">＋</span> 添加规则
                    </button>
                </div>
            </section>

            <!-- ⑤ 盯盘标的 -->
            <section class="wcard wcard-f">
                <header class="wcard-hd">
                    <span class="wcard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
                    <h2>盯盘标的</h2>
                    <span class="wcard-note" id="stockCount"></span>
                </header>
                <div class="wcard-bd">
                    <div id="stockPicker"></div>
                </div>
            </section>

        </div>

        <!-- 未保存时的浮动操作条 -->
        <div class="save-bar" id="saveBar">
            <span class="save-bar-txt"><i class="dot" aria-hidden="true"></i>有未保存的更改</span>
            <button class="btn-ghost" onclick="reload()">放弃</button>
            <button onclick="save()">保存</button>
        </div>

    </div>
</main>

<script src="/js/common.js?v=20261020b"></script>
<script src="/js/stock-picker.js?v=20261011e"></script>
<script>
    let picker = null;
    let cfg = null;
    /** 表单是否有未保存的改动：只影响底部操作条的显隐与摘要刷新 */
    let dirty = false;

    function showGate() {
        document.getElementById('gatePanel').style.display = '';
        document.getElementById('cfgPanel').style.display = 'none';
    }

    function setDirty(v) {
        dirty = v;
        document.getElementById('saveBar').classList.toggle('show', v);
    }

    async function reload() {
        const r = await api('/api/watch/config', {method: 'GET'});
        if (!r || !r.success) {
            showGate();
            return;
        }
        cfg = r.data;
        document.getElementById('gatePanel').style.display = 'none';
        document.getElementById('cfgPanel').style.display = '';
        render();
    }

    function render() {
        document.getElementById('fEnabled').checked = !!cfg.enabled;
        document.getElementById('fInterval').value = cfg.intervalSeconds;

        renderRules();
        renderDingtalk();
        renderSurge();

        if (!picker) {
            picker = createStockPicker(document.getElementById('stockPicker'), {
                multiple: true,
                gridColumns: 4,
                onChange: onPickerChange
            });
        }
        picker.setItems(cfg.stocks || []);
        setDirty(false);
        updateSummary();
    }

    function onPickerChange() {
        setDirty(true);
        updateSummary();
    }

    function renderDingtalk() {
        const dt = cfg.dingtalk || {};
        document.getElementById('fWebhook').value = dt.webhook || '';
        // 这条配置的告警会进哪个群：自己配了就进自己的，没配才落到平台默认群
        document.getElementById('pushTarget').textContent = !dt.targetConfigured
            ? '未配置机器人'
            : (dt.ownGroup ? '推送到我的群' : '推送到平台默认群');
    }

    /** 回显放量阈值：cfg.surge 缺失（老落盘文件）时用默认 2000 万 / 10 倍 */
    function renderSurge() {
        const sg = cfg.surge || {};
        document.getElementById('fSurgeAmount').value = (sg.amountWan != null) ? sg.amountWan : 2000;
        document.getElementById('fSurgeTimes').value = (sg.times != null) ? sg.times : 10;
    }

    /** 读放量阈值，顺带按 limits 校验；不合法返回 null */
    function collectSurge(limits) {
        const minA = (limits && limits.minSurgeAmountWan) || 1;
        const maxA = (limits && limits.maxSurgeAmountWan) || 1000000;
        const minT = (limits && limits.minSurgeTimes) || 1;
        const maxT = (limits && limits.maxSurgeTimes) || 1000;
        const amountWan = parseFloat(document.getElementById('fSurgeAmount').value);
        const times = parseFloat(document.getElementById('fSurgeTimes').value);
        if (isNaN(amountWan) || amountWan < minA || amountWan > maxA) {
            toast('「单轮成交额」需要在 ' + minA + ' ~ ' + maxA + ' 万元之间', 'err');
            return null;
        }
        if (isNaN(times) || times < minT || times > maxT) {
            toast('「环比倍数」需要在 ' + minT + ' ~ ' + maxT + ' 倍之间', 'err');
            return null;
        }
        return {amountWan: amountWan, times: times};
    }

    function renderRules() {
        const box = document.getElementById('ruleBox');
        const rules = (cfg.rules && cfg.rules.length) ? cfg.rules : [];
        box.innerHTML = '';
        if (!rules.length) {
            addRuleRow(1, 1.0);
        } else {
            for (const r of rules) {
                // 兼容老字段 seconds（绝对秒数），新字段 intervals（轮询间隔倍数）
                const intervals = (typeof r.intervals === 'number')
                        ? r.intervals
                        : Math.max(1, Math.round((r.seconds || 0) / (cfg.intervalSeconds || 30)));
                addRuleRow(intervals, r.percent);
            }
        }
    }

    function addRule() {
        addRuleRow(1, 0.5);
    }

    function addRuleRow(intervals, percent) {
        const box = document.getElementById('ruleBox');
        const limits = (cfg && cfg.limits) || {};
        const minN = limits.minRuleIntervals || 1;
        const maxN = limits.maxRuleIntervals || 60;
        const minP = limits.minThreshold || 0.01;
        const maxP = limits.maxThreshold || 20;
        const maxR = limits.maxRules || 8;
        if (box.children.length >= maxR) {
            return toast('最多 ' + maxR + ' 条规则', 'err');
        }
        const row = document.createElement('div');
        row.className = 'rule-row';
        row.innerHTML =
            '<span class="rr-t">过去</span>'
            + '<span class="unit-input unit-sm"><input type="number" class="rule-n" min="' + minN + '" max="' + maxN + '" step="1" value="' + intervals + '" inputmode="numeric"><span class="unit">周期</span></span>'
            + '<span class="rr-t">内，涨 / 跌幅 ≥</span>'
            + '<span class="unit-input unit-sm"><input type="number" class="rule-pct" min="' + minP + '" max="' + maxP + '" step="0.01" value="' + percent + '" inputmode="decimal"><span class="unit">%</span></span>'
            + '<button type="button" class="btn-ghost rr-del" aria-label="删除该规则">'
            + '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
            + '</button>';
        row.querySelector('.rr-del').addEventListener('click', () => {
            row.remove();
            setDirty(true);
            updateSummary();
        });
        box.appendChild(row);
    }

    function collectRules() {
        const rows = document.querySelectorAll('#ruleBox .rule-row');
        const out = [];
        for (const row of rows) {
            const n = parseInt(row.querySelector('.rule-n').value, 10);
            const p = parseFloat(row.querySelector('.rule-pct').value);
            if (!n || isNaN(p)) {
                continue;
            }
            out.push({intervals: n, percent: p});
        }
        return out;
    }

    /** 页头摘要：始终读表单当前值，改动时立刻反映 */
    function updateSummary() {
        const box = document.getElementById('wsum');
        const on = document.getElementById('fEnabled').checked;
        const interval = parseInt(document.getElementById('fInterval').value, 10) || 0;
        const rules = document.querySelectorAll('#ruleBox .rule-row').length;
        const stocks = picker ? picker.getItems().length : 0;
        const max = (cfg && cfg.limits && cfg.limits.maxStocks) || 200;
        document.getElementById('stockCount').textContent = stocks + ' / ' + max;
        box.innerHTML =
            '<span class="wchip ' + (on ? 'on' : 'off') + '"><i class="dot"></i>' + (on ? '运行中' : '已停用') + '</span>'
            + '<span class="wchip">每 ' + (interval || '—') + ' 秒一轮</span>'
            + '<span class="wchip">' + rules + ' 条规则</span>'
            + '<span class="wchip">' + stocks + ' 只标的</span>';
    }

    /** 保存中：挡住连点，避免同一份配置被并发提交、把变更提示刷成一片 */
    let saving = false;

    async function save() {
        if (saving) {
            return;
        }
        const interval = parseInt(document.getElementById('fInterval').value, 10);
        const limits = (cfg && cfg.limits) || {};
        if (!interval || interval < (limits.minInterval || 3) || interval > (limits.maxInterval || 3600)) {
            return toast('检查间隔需要在 ' + (limits.minInterval || 3) + ' ~ ' + (limits.maxInterval || 3600) + ' 秒之间', 'err');
        }
        const rules = collectRules();
        if (!rules.length) {
            return toast('至少添加 1 条告警规则', 'err');
        }
        for (const r of rules) {
            if (r.intervals < (limits.minRuleIntervals || 1) || r.intervals > (limits.maxRuleIntervals || 60)) {
                return toast('规则的「过去周期数」需要是 ' + limits.minRuleIntervals + ' ~ ' + limits.maxRuleIntervals, 'err');
            }
            if (r.percent < (limits.minThreshold || 0.01) || r.percent > (limits.maxThreshold || 20)) {
                return toast('规则的「涨跌幅」需要在 ' + limits.minThreshold + ' ~ ' + limits.maxThreshold + ' % 之间', 'err');
            }
        }
        const stocks = picker.getItems();
        if (!stocks.length) {
            return toast('至少选择 1 只盯盘股票', 'err');
        }
        const surge = collectSurge(limits);
        if (!surge) {
            return;
        }
        saving = true;
        let r;
        try {
            r = await api('/api/watch/config', {
                method: 'PUT',
                body: JSON.stringify({
                    enabled: document.getElementById('fEnabled').checked,
                    intervalSeconds: interval,
                    rules: rules,
                    // 我自己的推送机器人：空串 = 清空、回落到平台默认群
                    dingtalk: {
                        webhook: document.getElementById('fWebhook').value.trim()
                    },
                    surge: surge,
                    stocks: stocks
                })
            });
        } finally {
            saving = false;
        }
        if (!r || !r.success) {
            return;
        }
        // 保存成功只更新本地配置，绝不能用服务端快照重刷整个表单：
        // 请求往返期间用户可能又改了名单，重刷会把这段编辑悄悄回滚，
        // 表现就是「刚删掉的股票又冒出来」，再存一次又变成移除 —— 名单来回抖。
        cfg = r.data;
        // 推送目标要跟着刷新：用户刚配了自己的群，页头却还写着「推送到平台默认群」会很费解
        renderDingtalk();
        setDirty(false);
        updateSummary();
        toast('已保存：' + stocks.length + ' 只标的，' + rules.length + ' 条规则，每 ' + cfg.intervalSeconds
            + ' 秒一轮，放量阈值 ' + surge.amountWan + ' 万元 / ' + surge.times + ' 倍', 'ok');
    }

    // 表单任何改动都冒到 cfgPanel：标脏 + 刷新摘要
    document.getElementById('cfgPanel').addEventListener('input', onFormChanged);
    document.getElementById('cfgPanel').addEventListener('change', onFormChanged);

    function onFormChanged(e) {
        // 底下操作条自己的按钮不参与
        if (e.target.closest('.save-bar')) {
            return;
        }
        setDirty(true);
        updateSummary();
    }

    (async function init() {
        await loadMode();
        // 盯盘名单要登录：配置跟着账号走，没登录就不知道该读谁的
        if (!(await requireLogin())) {
            return;
        }
        // 已选标的的名称要渲染成跳转链接，配置先拿到
        await loadStockLink();
        await reload();
    })();
</script>
</body>
</html>
