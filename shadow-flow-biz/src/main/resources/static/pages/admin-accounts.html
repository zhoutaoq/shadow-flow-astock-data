<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{var t=localStorage.getItem("shadowflow_theme")||localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <title>账户管理</title>
    <link rel="stylesheet" href="/css/common.css?v=20261023a">
    <link rel="stylesheet" href="/css/account.css?v=20261023a">
    <style>
        /* 顶部的「选人」工具条：搜索框 + 用户下拉 + 重新载入 */
        .au-toolbar { display: flex; gap: var(--sp-2); align-items: flex-end; flex-wrap: wrap; }
        .au-toolbar .field { margin-bottom: 0; }
        .au-toolbar .field-search { width: 220px; }
        .au-toolbar .field-user { min-width: 260px; }
        .au-toolbar select { width: 100%; }
        /* 只读卡片：整张可点，但不再有「重命名 / 导出 / 删除」这些动作 */
        .acc-item .acc-hint {
            font-size: var(--fs-11); color: var(--text-dim);
            display: inline-flex; align-items: center; gap: 4px;
        }
        .au-empty {
            padding: var(--sp-5); text-align: center; color: var(--text-dim);
            border: 1px dashed var(--border); border-radius: var(--r-xl); font-size: var(--fs-13);
        }
        .au-who {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: var(--fs-12); color: var(--text-dim);
        }
        .au-who b { color: var(--text-strong); font-weight: 600; }
    </style>
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">影流数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <section class="panel" id="denyPanel" style="display:none">
        <h2>账户管理</h2>
        <div class="msg msg-err" style="display:block" id="denyMsg"></div>
    </section>

    <section class="panel" id="pickPanel" style="display:none">
        <div class="u-head" style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
            <h2 style="margin:0">账户管理</h2>
            <span class="au-who" id="whoTip"></span>
        </div>
        <div class="au-toolbar">
            <div class="field field-search">
                <label for="fKw">搜索用户</label>
                <input type="text" id="fKw" placeholder="邮箱关键字" spellcheck="false">
            </div>
            <div class="field field-user">
                <label for="userSel">查看哪个用户的账户</label>
                <select id="userSel"></select>
            </div>
            <button onclick="searchUsers()">查询</button>
            <button class="btn-ghost" onclick="reloadAll()">重新载入</button>
        </div>
        <div class="dim" style="font-size:var(--fs-12);margin-top:10px" id="userTip"></div>
    </section>

    <!-- 一级：选中用户的账户卡片（口径与「我的账户」一致，只读） -->
    <div id="listPanel" style="display:none">
        <div class="ahead">
            <div class="ahead-l">
                <h1 class="ahead-t" id="listTitle">账户</h1>
                <div class="asum" id="ovChips"></div>
            </div>
        </div>
        <div class="acc-grid" id="accGrid"></div>
        <div class="au-empty" id="accEmpty" style="display:none">这个用户还没有账户（他登录进「我的账户」后会自动建一本）</div>
    </div>

    <!-- 二级：某本账的明细，仍在当前页用卡片展开，不跳转 -->
    <div id="detailPanel" style="display:none">
        <div class="ahead">
            <div class="ahead-l">
                <div class="acrumb">
                    <button class="btn-ghost btn-sm" onclick="closeDetail()">
                        <span class="acrumb-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
                        全部账户
                    </button>
                    <h1 class="ahead-t" id="curName">账户</h1>
                </div>
                <div class="asum" id="asum"></div>
            </div>
        </div>

        <div class="agrid">
            <section class="acard acard-narrow">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span>
                    <h2>账户资金</h2>
                    <span class="acard-note" id="acctNote"></span>
                </header>
                <div class="acard-bd">
                    <div class="apairs" id="fundRows"></div>
                </div>
            </section>

            <section class="acard acard-wide">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></span>
                    <h2>账户统计</h2>
                    <span class="acard-note" id="quoteTip"></span>
                </header>
                <div class="acard-bd">
                    <div class="akpi-grid">
                        <div class="akpi">
                            <div class="akpi-t">总资产</div>
                            <div class="akpi-v" id="kTotalValue">-</div>
                            <div class="akpi-d">持仓市值 + 可用金额</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">持仓市值</div>
                            <div class="akpi-v" id="kPosValue">-</div>
                            <div class="akpi-d" id="kPosCost">成本 -</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">总盈亏</div>
                            <div class="akpi-v" id="kTotalProfit">-</div>
                            <div class="akpi-d" id="kTotalPct">相对账户期初市值</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">浮动盈亏</div>
                            <div class="akpi-v" id="kFloatProfit">-</div>
                            <div class="akpi-d" id="kFloatPct">相对持仓成本</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">当日收益</div>
                            <div class="akpi-v" id="kDayProfit">-</div>
                            <div class="akpi-d" id="kDayPct"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="acard">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
                    <h2>持仓列表</h2>
                    <span class="acard-note" id="posCount"></span>
                </header>
                <div class="acard-bd">
                    <div class="atable-wrap">
                        <table class="atable">
                            <thead>
                            <tr>
                                <th>标的</th>
                                <th>名称</th>
                                <th>建仓日</th>
                                <th>成本价</th>
                                <th>现价</th>
                                <th>持仓数量</th>
                                <th>可用数量</th>
                                <th>成本市值</th>
                                <th>当前市值</th>
                                <th>当日收益</th>
                                <th>总盈亏</th>
                            </tr>
                            </thead>
                            <tbody id="posBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section class="acard">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></span>
                    <h2>操作记录</h2>
                    <span class="acard-note" id="recCount"></span>
                </header>
                <div class="acard-bd">
                    <div class="arec-head">
                        <span>方向</span>
                        <span>标的</span>
                        <span>成交价</span>
                        <span>数量</span>
                        <span>盈亏</span>
                        <span>时间</span>
                    </div>
                    <div class="arec-list" id="recList"></div>
                </div>
            </section>
        </div>
    </div>
</main>

<script src="/js/common.js?v=20261023a"></script>
<script>
    /* 只读页面：所有数据都来自 /api/admin/accounts/**，一个写接口都不调 ——
       超管看别人的账只做核对，改还是让本人来 */
    let users = [];        // 当前搜索到的用户（最多 200 个）
    let curUser = null;    // 正在看的用户
    let overview = null;   // 该用户的账户列表（AccountOverview）
    let curId = 0;         // 正在看明细的账户 id；0 = 停在卡片列表
    let summary = null;    // 该账户的汇总
    let records = [];      // 该账户的操作记录（新的在前）
    let keyword = '';

    /* ---------- 数字口径：与 account.html 保持一致 ---------- */

    function dir(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n) || n === 0) return '';
        return n > 0 ? 'up' : 'down';
    }

    function money(v) {
        return fmtNum(v, 2);
    }

    function moneySigned(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n)) return '—';
        return (n > 0 ? '+' : n < 0 ? '-' : '') + fmtNum(Math.abs(n), 2);
    }

    function pctSigned(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n)) return '—';
        return (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(n).toFixed(2) + '%';
    }

    function usableQty(p) {
        if (!p) return 0;
        const n = Number(p.availableQty);
        if (p.availableQty === null || p.availableQty === undefined || isNaN(n)) return Number(p.quantity) || 0;
        return Math.max(0, Math.min(n, Number(p.quantity) || 0));
    }

    /* ---------- 用户列表 ---------- */

    async function loadUsers() {
        const r = await get('/api/admin/users?page=1&size=200&keyword=' + encodeURIComponent(keyword));
        if (!r || !r.success) {
            return false;
        }
        const data = r.data || {rows: [], total: 0};
        users = data.rows || [];
        document.getElementById('userTip').textContent = data.total > users.length
            ? '共 ' + data.total + ' 个账号，这里只列出前 ' + users.length + ' 个 —— 用邮箱关键字缩小范围'
            : '共 ' + (data.total || 0) + ' 个账号';
        paintUserSel();
        return true;
    }

    function paintUserSel() {
        const sel = document.getElementById('userSel');
        if (!users.length) {
            sel.innerHTML = '<option value="">没有匹配的账号</option>';
            sel.disabled = true;
            return;
        }
        sel.disabled = false;
        const keep = curUser ? curUser.id : 0;
        sel.innerHTML = users.map(u => '<option value="' + u.id + '">'
            + esc(u.username) + (u.admin ? '（超管）' : '')
            + (u.enabled ? '' : ' · 已停用') + '</option>').join('');
        const hit = users.filter(u => u.id === keep)[0];
        if (hit) {
            sel.value = String(hit.id);
        }
    }

    function searchUsers() {
        keyword = document.getElementById('fKw').value.trim();
        loadUsers().then(function (ok) {
            if (ok) {
                selectUser(Number(document.getElementById('userSel').value));
            }
        });
    }

    function reloadAll() {
        if (curUser) {
            return loadOverview(curUser.id);
        }
        searchUsers();
    }

    /* ---------- 一级：账户卡片 ---------- */

    async function selectUser(userId) {
        curUser = users.filter(u => u.id === userId)[0] || null;
        curId = 0;
        if (!curUser) {
            document.getElementById('listPanel').style.display = 'none';
            document.getElementById('detailPanel').style.display = 'none';
            return;
        }
        document.getElementById('whoTip').innerHTML =
            '只读视图 · 当前查看 <b>' + esc(curUser.username) + '</b>';
        await loadOverview(curUser.id);
    }

    async function loadOverview(userId) {
        const r = await get('/api/admin/accounts/overview?userId=' + userId);
        if (!r || !r.success) {
            return;
        }
        overview = (r.data && r.data.overview) || {accounts: []};
        curUser = (r.data && r.data.user) || curUser;
        curId = 0;
        document.getElementById('detailPanel').style.display = 'none';
        document.getElementById('listPanel').style.display = '';
        renderAccounts();
        // 地址里带 accountId 时直接展开那本账（刷新/分享链接不丢现场）
        const want = Number(new URLSearchParams(location.search).get('accountId') || 0);
        if (want > 0) {
            await openDetail(want);
        }
    }

    function renderAccounts() {
        const ov = overview || {};
        const rows = ov.accounts || [];
        document.getElementById('listTitle').textContent =
            (curUser ? curUser.username : '') + ' 的账户';
        document.getElementById('ovChips').innerHTML =
            '<span class="achip">' + rows.length + ' 个账户</span>'
            + '<span class="achip">合计总资产 ' + money(ov.totalValue) + '</span>'
            + '<span class="achip ' + dir(ov.dayProfit) + '">合计当日收益 ' + moneySigned(ov.dayProfit) + '</span>'
            + '<span class="achip ' + dir(ov.totalProfit) + '">合计总盈亏 ' + moneySigned(ov.totalProfit) + '</span>'
            + '<span class="achip">可用金额 ' + money(ov.cash) + '</span>';

        const box = document.getElementById('accGrid');
        document.getElementById('accEmpty').style.display = rows.length ? 'none' : '';
        box.innerHTML = rows.map(a => {
            const d = dir(a.dayProfit);
            const t = dir(a.totalProfit);
            return '<div class="acc-item" data-id="' + a.id + '">'
                + '<div class="acc-hd">'
                + '<span class="acc-name">' + esc(a.name || '账户') + '</span>'
                + '<span class="acc-badge">' + a.positionCount + ' 只持仓</span>'
                + '</div>'
                + '<div class="acc-mv">' + money(a.totalValue) + '</div>'
                + '<div class="acc-kpis">'
                + '<span class="acc-kpi">当日 <b class="' + d + '">' + moneySigned(a.dayProfit) + '</b></span>'
                + '<span class="acc-kpi">总盈亏 <b class="' + t + '">' + moneySigned(a.totalProfit) + '</b>'
                + '<small> ' + pctSigned(a.totalProfitPercent) + '</small></span>'
                + '</div>'
                + '<div class="acc-ft">'
                + '<span>期初 ' + money(a.initValue) + '</span>'
                + '<span>可用 ' + money(a.cash) + '</span>'
                + '</div>'
                + '<div class="acc-hint">查看持仓与操作记录 ›</div>'
                + '</div>';
        }).join('');
        box.querySelectorAll('.acc-item').forEach(card => {
            card.addEventListener('click', () => openDetail(Number(card.getAttribute('data-id'))));
        });
    }

    /* ---------- 二级：某本账的明细（仍在当前页） ---------- */

    async function openDetail(accountId) {
        if (!curUser) {
            return;
        }
        const r = await get('/api/admin/accounts/detail?userId=' + curUser.id
            + '&accountId=' + accountId);
        if (!r || !r.success) {
            return toast((r && r.message) || '账户打不开', 'err');
        }
        curId = accountId;
        summary = r.data.summary || null;
        records = r.data.records || [];
        document.getElementById('listPanel').style.display = 'none';
        document.getElementById('detailPanel').style.display = '';
        render();
        document.getElementById('detailPanel').scrollIntoView({block: 'start'});
    }

    function closeDetail() {
        curId = 0;
        document.getElementById('detailPanel').style.display = 'none';
        document.getElementById('listPanel').style.display = '';
    }

    function render() {
        const s = summary || {};
        document.getElementById('curName').textContent =
            (s.accountName || '账户') + (curUser ? ' · ' + curUser.username : '');
        document.getElementById('acctNote').textContent = '';
        renderFund(s);
        renderSummary(s);
        renderPositions(s.positions || []);
        renderChips(s);
        renderRecords();
    }

    function renderFund(s) {
        const rows = [
            ['账户期初市值', money(s.initValue)],
            ['可用金额', money(s.cash)],
            ['备注', s.remark ? esc(s.remark) : '—']
        ];
        document.getElementById('fundRows').innerHTML = rows.map(r =>
            '<div class="apair"><span class="apair-k">' + r[0] + '</span>'
            + '<span class="apair-v">' + r[1] + '</span></div>').join('');
    }

    function setKpi(id, text, cls) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.classList.remove('up', 'down');
        if (cls) el.classList.add(cls);
    }

    function renderSummary(s) {
        setKpi('kTotalValue', money(s.totalValue), '');
        setKpi('kPosValue', money(s.positionValue), '');
        document.getElementById('kPosCost').textContent = '成本 ' + money(s.positionCost);

        setKpi('kTotalProfit', moneySigned(s.totalProfit), dir(s.totalProfit));
        document.getElementById('kTotalPct').textContent = s.totalProfitPercent == null
            ? '相对账户期初市值'
            : pctSigned(s.totalProfitPercent) + '（期初 ' + money(s.initValue) + '）';

        setKpi('kFloatProfit', moneySigned(s.positionProfit), dir(s.positionProfit));
        const cost = Number(s.positionCost || 0);
        document.getElementById('kFloatPct').textContent = cost > 0
            ? pctSigned(Number(s.positionProfit || 0) / cost * 100) + '（成本 ' + money(s.positionCost) + '）'
            : '相对持仓成本';

        setKpi('kDayProfit', moneySigned(s.dayProfit), dir(s.dayProfit));
        if (s.dayStarted === false) {
            document.getElementById('kDayPct').textContent = '未开盘 · 当日收益按 0 计';
        } else {
            const parts = ['浮动 ' + moneySigned(s.dayFloatProfit),
                '已实现 ' + moneySigned(s.dayRealizedProfit)];
            if (s.dayProfitPercent != null) {
                parts.push(pctSigned(s.dayProfitPercent));
            }
            document.getElementById('kDayPct').textContent = parts.join(' · ');
        }

        // 行情口径：未开盘按昨收、行情断了按最近价，写出来省得以为数字没刷新
        const ps = s.positions || [];
        const preClose = ps.filter(p => p.priceBasis === '昨收').length;
        const stale = ps.filter(p => p.priceBasis === '最近价' || p.priceBasis === '成本价').length;
        let tip = '';
        if (ps.length && preClose === ps.length) {
            tip = '未开盘，市值按昨收计算';
        } else if (ps.length && stale > 0) {
            tip = stale + ' 只没取到行情，按最近价/成本价兜底';
        }
        document.getElementById('quoteTip').textContent = tip;
        document.getElementById('posCount').textContent = ps.length + ' 条';
    }

    function renderChips(s) {
        document.getElementById('asum').innerHTML =
            '<span class="achip">期初市值 ' + money(s.initValue) + '</span>'
            + '<span class="achip">可用金额 ' + money(s.cash) + '</span>'
            + '<span class="achip">持仓市值 ' + money(s.positionValue) + '</span>'
            + '<span class="achip ' + dir(s.positionProfit) + '">浮动盈亏 ' + moneySigned(s.positionProfit) + '</span>'
            + '<span class="achip ' + dir(s.dayProfit) + '">当日收益 ' + moneySigned(s.dayProfit) + '</span>'
            + '<span class="achip ' + dir(s.totalProfit) + '">总盈亏 ' + moneySigned(s.totalProfit) + '</span>'
            + '<span class="achip">' + (s.positions || []).length + ' 只持仓</span>';
    }

    function renderPositions(rows) {
        const body = document.getElementById('posBody');
        if (!rows.length) {
            body.innerHTML = '<tr><td class="empty" colspan="11">这本账户还没有持仓</td></tr>';
            return;
        }
        body.innerHTML = rows.map(p => {
            const dayDir = dir(p.dayProfit);
            const totDir = dir(p.totalProfit);
            return '<tr>'
                + '<td class="code">' + esc(p.code) + '</td>'
                + '<td class="name">' + stockLinkHtml(p.code, p.name)
                + (p.priceBasis && p.priceBasis !== '现价'
                    ? '<span class="abadge">' + esc(p.priceBasis) + '</span>' : '')
                + (p.dayBuyQty > 0
                    ? '<span class="abadge abadge-day">当日买入 ' + fmtNum(p.dayBuyQty, 0) + ' 股</span>' : '')
                + '</td>'
                + '<td class="adim">' + (p.openDate ? esc(p.openDate) : '—') + '</td>'
                + '<td>' + money(p.costPrice) + '</td>'
                + '<td>' + money(p.price) + '</td>'
                + '<td>' + fmtNum(p.quantity, 0) + '</td>'
                + '<td>' + fmtNum(usableQty(p), 0) + '</td>'
                + '<td>' + money(p.costValue) + '</td>'
                + '<td>' + money(p.marketValue) + '</td>'
                + '<td class="' + dayDir + '">' + moneySigned(p.dayProfit) + '</td>'
                + '<td class="' + totDir + '">' + moneySigned(p.totalProfit)
                + '<br><small>' + pctSigned(p.totalProfitPercent) + '</small></td>'
                + '</tr>';
        }).join('');
    }

    /** 操作记录：只读，最多摆最近 20 条（全量看还是让本人去「我的账户」） */
    function renderRecords() {
        const box = document.getElementById('recList');
        const all = records || [];
        document.getElementById('recCount').textContent = all.length
            ? '最近 ' + Math.min(all.length, 20) + ' 笔 · 共 ' + all.length + ' 笔'
            : '';
        if (!all.length) {
            box.innerHTML = '<div class="arec-empty">这本账户还没有操作记录</div>';
            return;
        }
        box.innerHTML = all.slice(0, 20).map(x => {
            const buy = x.action === 'buy';
            const t = String(x.time || '');
            const when = x.tradeDate
                ? esc(x.tradeDate) + (t.length >= 19 ? ' ' + esc(t.slice(11)) : '')
                : esc(t);
            return '<div class="arec-row">'
                + '<span class="arec-act ' + (buy ? 'buy' : 'sell') + '">' + (buy ? '买入' : '卖出') + '</span>'
                + '<span class="arec-time">'
                + stockLinkHtml(x.code, x.name, {text: x.name || x.code})
                + ' · ' + esc(x.code) + '</span>'
                + '<span>' + money(x.price) + ' 元</span>'
                + '<span>' + fmtNum(x.quantity, 0) + ' 股</span>'
                + '<span class="' + dir(x.realizedProfit) + '">'
                + (buy ? '—' : moneySigned(x.realizedProfit)) + '</span>'
                + '<span class="arec-time">' + when + '</span>'
                + '</div>';
        }).join('');
    }

    /* ---------- 事件与初始化 ---------- */

    document.getElementById('fKw').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            searchUsers();
        }
    });
    document.getElementById('userSel').addEventListener('change', function () {
        selectUser(Number(this.value));
    });

    (async function init() {
        if (!(await requireLogin())) {
            return;
        }
        if (!isAdmin()) {
            document.getElementById('denyPanel').style.display = '';
            document.getElementById('denyMsg').textContent =
                '只有超管能进账户管理，当前账号是 ' + (ME.user && ME.user.username) + '。';
            return;
        }
        document.getElementById('pickPanel').style.display = '';
        // 持仓里的标的要渲染成跳转链接，配置先拿到
        await loadStockLink();
        if (await loadUsers()) {
            // 默认落在第一个账号上：进页面就有东西看，不用先点一下
            selectUser(Number(document.getElementById('userSel').value));
        }
    })();
</script>
</body>
</html>
