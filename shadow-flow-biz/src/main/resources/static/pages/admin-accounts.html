<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{var t=localStorage.getItem("shadowflow_theme")||localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <title>账户管理</title>
    <link rel="stylesheet" href="/css/common.css?v=20261027a">
    <link rel="stylesheet" href="/css/account.css?v=20261027a">
    <style>
        /* 顶部的「选人」工具条：搜索框 + 用户下拉 + 重新载入 */
        .au-toolbar { display: flex; gap: var(--sp-2); align-items: flex-end; flex-wrap: wrap; }
        .au-toolbar .field { margin-bottom: 0; }
        .au-toolbar .field-search { width: 220px; }
        .au-toolbar .field-user { min-width: 260px; }
        .au-toolbar select { width: 100%; }
        /* 只读卡片：整张可点，但不再有「重命名 / 导出 / 删除」这些动作 */
        .acc-item .acc-hint {
            font-size: var(--fs-11); color: var(--text-dim);
            display: inline-flex; align-items: center; gap: 4px;
        }
        .au-empty {
            padding: var(--sp-5); text-align: center; color: var(--text-dim);
            border: 1px dashed var(--border); border-radius: var(--r-xl); font-size: var(--fs-13);
        }
        .au-who {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: var(--fs-12); color: var(--text-dim);
        }
        .au-who b { color: var(--text-strong); font-weight: 600; }
        /* 卡片上的归属用户：平铺时靠它区分这是谁的账户 */
        .acc-user {
            font-size: var(--fs-11); color: var(--text-dim);
            max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* 当日收益率（当日收益 / 持仓市值）：单独一颗小胶囊，和金额不同色系 */
        .acc-rate {
            display: inline-flex; align-items: center;
            height: 18px; padding: 0 6px; border-radius: var(--r-pill);
            background: var(--bg-tint); font-size: var(--fs-11);
            font-variant-numeric: tabular-nums;
        }
        .acc-rate.up { color: var(--up); }
        .acc-rate.down { color: var(--down); }
        /* 预览用户勾选列表 */
        .pv-list {
            display: flex; flex-direction: column; gap: 4px;
            max-height: 46vh; overflow-y: auto; padding-right: 2px;
        }
        .pv-row {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 10px; border: 1px solid var(--border-soft);
            border-radius: var(--r-md); background: var(--bg-input); cursor: pointer;
        }
        .pv-row:hover { border-color: var(--primary); }
        .pv-row .pv-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pv-row .pv-meta { font-size: var(--fs-11); color: var(--text-dim); }
        .pv-empty { padding: 14px; text-align: center; color: var(--text-dim); font-size: var(--fs-12); }
    </style>
</head>
<body>

</header>

<main class="container">

    <div id="detailPanel" style="display:none">

<script src="/js/common.js?v=20261027a"></script>
<script>
    /* 只读页面：数据都来自 /api/admin/accounts/**，唯一会写的是「默认预览用户」这项配置 */
    let users = [];        // 当前搜索到的用户（最多 200 个）
    let curUser = null;    // 正在看的用户（单人口径）
    let overview = null;   // 该用户的账户列表（AccountOverview）
    let curId = 0;         // 正在看明细的账户 id；0 = 停在卡片列表
    let detailUserId = 0;  // 明细属于哪个用户（平铺时卡片来自不同人）
    let detailFrom = 'single'; // 明细是从哪儿进去的：single / board
    let summary = null;    // 该账户的汇总
    let records = [];      // 该账户的操作记录（新的在前）
    let keyword = '';
    let preview = [];      // 默认预览用户（UserView[]）
    let board = null;      // 平铺数据（/api/admin/accounts/board）
    let mode = 'single';   // single（看一个人） | board（平铺所有人） | detail（某本账明细）

    /** 收益刷新频率：与「我的账户」页一致（3 秒） */
    const REFRESH_MS = 3000;
    let refreshTimer = null;
    let refreshBusy = false;

    /* ---------- 数字口径：与 account.html 保持一致 ---------- */

    function dir(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n) || n === 0) return '';
        return n > 0 ? 'up' : 'down';
    }

    function money(v) {
        return fmtNum(v, 2);
    }

    function moneySigned(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n)) return '—';
        return (n > 0 ? '+' : n < 0 ? '-' : '') + fmtNum(Math.abs(n), 2);
    }

    function pctSigned(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n)) return '—';
        return (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(n).toFixed(2) + '%';
    }

    function usableQty(p) {
        if (!p) return 0;
        const n = Number(p.availableQty);
        if (p.availableQty === null || p.availableQty === undefined || isNaN(n)) return Number(p.quantity) || 0;
        return Math.max(0, Math.min(n, Number(p.quantity) || 0));
    }

    /* ---------- 用户列表 ---------- */

    async function loadUsers() {
        const r = await get('/api/admin/users?page=1&size=200&keyword=' + encodeURIComponent(keyword));
        if (!r || !r.success) {
            return false;
        }
        const data = r.data || {rows: [], total: 0};
        users = data.rows || [];
        document.getElementById('userTip').textContent = data.total > users.length
            ? '共 ' + data.total + ' 个账号，这里只列出前 ' + users.length + ' 个 —— 用邮箱关键字缩小范围'
            : '共 ' + (data.total || 0) + ' 个账号';
        paintUserSel();
        return true;
    }

    function paintUserSel() {
        const sel = document.getElementById('userSel');
        if (!users.length) {
            sel.innerHTML = '<option value="">没有匹配的账号</option>';
            sel.disabled = true;
            return;
        }
        sel.disabled = false;
        const keep = curUser ? curUser.id : 0;
        sel.innerHTML = users.map(u => '<option value="' + u.id + '">'
            + esc(u.username) + (u.admin ? '（超管）' : '')
            + (u.enabled ? '' : ' · 已停用') + '</option>').join('');
        const hit = users.filter(u => u.id === keep)[0];
        if (hit) {
            sel.value = String(hit.id);
        }
    }

    function searchUsers() {
        keyword = document.getElementById('fKw').value.trim();
        loadUsers().then(function (ok) {
            if (ok) {
                selectUser(Number(document.getElementById('userSel').value));
            }
        });
    }

    function reloadAll() {
        if (mode === 'detail' && curId > 0) {
            return refreshDetail();
        }
        if (mode === 'board') {
            return loadBoard();
        }
        if (curUser) {
            return loadOverview(curUser.id);
        }
        searchUsers();
    }

    /* ---------- 一级：账户卡片 ---------- */

    async function selectUser(userId) {
        curUser = users.filter(u => u.id === userId)[0] || null;
        curId = 0;
        if (!curUser) {
            document.getElementById('listPanel').style.display = 'none';
            document.getElementById('detailPanel').style.display = 'none';
            return;
        }
        document.getElementById('whoTip').innerHTML =
            '只读视图 · 当前查看 <b>' + esc(curUser.username) + '</b>';
        await loadOverview(curUser.id);
    }

    async function loadOverview(userId, silent) {
        const r = await get('/api/admin/accounts/overview?userId=' + userId);
        if (!r || !r.success) {
            return;
        }
        overview = (r.data && r.data.overview) || {accounts: []};
        curUser = (r.data && r.data.user) || curUser;
        mode = 'single';
        document.getElementById('boardPanel').style.display = 'none';
        document.getElementById('listPanel').style.display = '';
        // 静默刷新（3 秒轮询）时不动明细、不滚回顶部：用户正在看的东西别被打断
        if (!silent) {
            curId = 0;
            document.getElementById('detailPanel').style.display = 'none';
        }
        renderAccounts();
        if (!silent) {
            // 地址里带 accountId 时直接展开那本账（刷新/分享链接不丢现场）
            const q = new URLSearchParams(location.search);
            const want = Number(q.get('accountId') || 0);
            if (want > 0) {
                await openDetail(userId, want);
            }
        }
    }

    /** 账户列表 → 卡片数据（单人口径；平铺那份由后端直接给同名字段，前端只负责画） */
    function cardsOf(ov, user) {
        return (ov.accounts || []).map(a => ({
            userId: user.id,
            username: user.username,
            accountId: a.id,
            accountName: a.name,
            initValue: a.initValue,
            cash: a.cash,
            positionValue: a.positionValue,
            totalValue: a.totalValue,
            dayProfit: a.dayProfit,
            dayProfitRate: rate(Number(a.dayProfit), Number(a.positionValue)),
            totalProfit: a.totalProfit,
            totalProfitPercent: a.totalProfitPercent,
            positionCount: a.positionCount
        }));
    }

    /** 当日收益率（%）= 当日收益 / 持仓市值；持仓市值为 0 时没有意义，给 null */
    function rate(profit, positionValue) {
        if (!positionValue || positionValue <= 0) {
            return null;
        }
        return Math.round((profit || 0) / positionValue * 10000) / 100;
    }

    /* ---------- 卡片：平铺与单人共用同一套 DOM，3 秒只改数字不重建 ---------- */

    function makeCard(c) {
        const el = document.createElement('div');
        el.className = 'acc-item';
        el.setAttribute('data-key', c.userId + '-' + c.accountId);
        el.innerHTML = '<div class="acc-hd">'
            + (c.username ? '<span class="acc-user">' + esc(c.username) + '</span>' : '')
            + '<span class="acc-name">' + esc(c.accountName || '账户') + '</span>'
            + '<span class="acc-badge"></span>'
            + '</div>'
            + '<div class="acc-mv"></div>'
            + '<div class="acc-kpis">'
            + '<span class="acc-kpi">当日 <b data-f="day"></b></span>'
            + '<span class="acc-kpi">当日收益率 <span class="acc-rate" data-f="rate"></span></span>'
            + '</div>'
            + '<div class="acc-kpis">'
            + '<span class="acc-kpi">总盈亏 <b data-f="profit"></b><small data-f="pct"></small></span>'
            + '</div>'
            + '<div class="acc-ft">'
            + '<span data-f="init"></span><span data-f="cash"></span><span data-f="pos"></span>'
            + '</div>'
            + '<div class="acc-hint">查看持仓与操作记录 ›</div>';
        el.addEventListener('click', () => openDetail(c.userId, c.accountId));
        paintCard(el, c);
        return el;
    }

    function paintCard(el, c) {
        const d = dir(c.dayProfit);
        const t = dir(c.totalProfit);
        el.querySelector('.acc-badge').textContent = c.positionCount + ' 只持仓';
        el.querySelector('.acc-mv').textContent = money(c.totalValue);

        const day = el.querySelector('[data-f="day"]');
        day.textContent = moneySigned(c.dayProfit);
        day.className = d;

        const r = el.querySelector('[data-f="rate"]');
        r.textContent = c.dayProfitRate == null ? '—' : pctSigned(c.dayProfitRate);
        r.className = 'acc-rate ' + d;

        const p = el.querySelector('[data-f="profit"]');
        p.textContent = moneySigned(c.totalProfit);
        p.className = t;
        el.querySelector('[data-f="pct"]').textContent = ' ' + pctSigned(c.totalProfitPercent);

        el.querySelector('[data-f="init"]').textContent = '期初 ' + money(c.initValue);
        el.querySelector('[data-f="cash"]').textContent = '可用 ' + money(c.cash);
        el.querySelector('[data-f="pos"]').textContent = '持仓 ' + money(c.positionValue);
    }

    /**
     * 按 key 对齐地画一网格卡片。
     *
     * <p>卡片集合没变就只改数字 —— 3 秒重建一次 innerHTML 会让卡片闪、
     * 鼠标悬停态也丢（和首页行情带同一个理由）。
     */
    function paintGrid(boxId, rows) {
        const box = document.getElementById(boxId);
        const keys = rows.map(c => c.userId + '-' + c.accountId);
        const have = Array.prototype.map.call(box.children, el => el.getAttribute('data-key'));
        if (have.join(',') !== keys.join(',')) {
            box.innerHTML = '';
            rows.forEach(c => box.appendChild(makeCard(c)));
            return;
        }
        rows.forEach((c, i) => paintCard(box.children[i], c));
    }

    function renderAccounts() {
        const ov = overview || {};
        const rows = cardsOf(ov, curUser || {id: 0, username: ''});
        document.getElementById('listTitle').textContent =
            (curUser ? curUser.username : '') + ' 的账户';
        document.getElementById('ovChips').innerHTML =
            '<span class="achip">' + rows.length + ' 个账户</span>'
            + '<span class="achip">合计总资产 ' + money(ov.totalValue) + '</span>'
            + '<span class="achip ' + dir(ov.dayProfit) + '">合计当日收益 ' + moneySigned(ov.dayProfit) + '</span>'
            + '<span class="achip ' + dir(ov.dayProfit) + '">合计当日收益率 '
            + pctOrDash(rate(Number(ov.dayProfit), Number(ov.positionValue))) + '</span>'
            + '<span class="achip ' + dir(ov.totalProfit) + '">合计总盈亏 ' + moneySigned(ov.totalProfit) + '</span>'
            + '<span class="achip">可用金额 ' + money(ov.cash) + '</span>';
        document.getElementById('accEmpty').style.display = rows.length ? 'none' : '';
        paintGrid('accGrid', rows);
    }

    function pctOrDash(v) {
        return v == null ? '—' : pctSigned(v);
    }

    /* ---------- 平铺：默认预览用户 × 他们名下所有账户 ---------- */

    async function loadBoard() {
        const r = await get('/api/admin/accounts/board');
        if (!r || !r.success) {
            return;
        }
        board = r.data || {cards: [], users: []};
        renderBoard();
    }

    function renderBoard() {
        const b = board || {cards: [], users: []};
        const cards = b.cards || [];
        const userCount = (b.users || []).length;
        mode = 'board';
        curId = 0;
        document.getElementById('listPanel').style.display = 'none';
        document.getElementById('detailPanel').style.display = 'none';
        document.getElementById('boardPanel').style.display = '';

        document.getElementById('boardTitle').textContent =
            '默认预览 · ' + userCount + ' 位用户的 ' + cards.length + ' 个账户';
        document.getElementById('whoTip').innerHTML =
            '只读视图 · 平铺 <b>' + userCount + '</b> 位用户的账户';
        const d = dir(b.dayProfit);
        document.getElementById('boardChips').innerHTML =
            '<span class="achip">' + userCount + ' 位用户</span>'
            + '<span class="achip">' + cards.length + ' 个账户</span>'
            + '<span class="achip">合计总资产 ' + money(b.totalValue) + '</span>'
            + '<span class="achip">合计持仓市值 ' + money(b.positionValue) + '</span>'
            + '<span class="achip ' + d + '">合计当日收益 ' + moneySigned(b.dayProfit) + '</span>'
            + '<span class="achip ' + d + '">合计当日收益率 ' + pctOrDash(b.dayProfitRate) + '</span>'
            + '<span class="achip ' + dir(b.totalProfit) + '">合计总盈亏 ' + moneySigned(b.totalProfit) + '</span>';
        document.getElementById('boardEmpty').style.display = cards.length ? 'none' : '';
        paintGrid('boardGrid', cards);
    }

    /* ---------- 二级：某本账的明细（仍在当前页） ---------- */

    async function openDetail(userId, accountId) {
        if (!userId) {
            return;
        }
        const r = await get('/api/admin/accounts/detail?userId=' + userId
            + '&accountId=' + accountId);
        if (!r || !r.success) {
            return toast((r && r.message) || '账户打不开', 'err');
        }
        detailFrom = mode === 'board' ? 'board' : 'single';
        detailUserId = userId;
        curId = accountId;
        curUser = (r.data && r.data.user) || curUser;
        summary = r.data.summary || null;
        records = r.data.records || [];
        mode = 'detail';
        document.getElementById('boardPanel').style.display = 'none';
        document.getElementById('listPanel').style.display = 'none';
        document.getElementById('detailPanel').style.display = '';
        document.getElementById('backLabel').textContent =
            detailFrom === 'board' ? '默认预览' : '全部账户';
        render();
        document.getElementById('detailPanel').scrollIntoView({block: 'start'});
    }

    /** 3 秒刷新明细：只重画数字区，持仓表与操作记录不重排 */
    async function refreshDetail() {
        if (!detailUserId || !curId) {
            return;
        }
        const r = await get('/api/admin/accounts/detail?userId=' + detailUserId
            + '&accountId=' + curId);
        if (!r || !r.success) {
            return;
        }
        summary = r.data.summary || null;
        records = r.data.records || [];
        renderFund(summary || {});
        renderSummary(summary || {});
        renderChips(summary || {});
    }

    function closeDetail() {
        curId = 0;
        document.getElementById('detailPanel').style.display = 'none';
        if (detailFrom === 'board') {
            mode = 'board';
            document.getElementById('boardPanel').style.display = '';
            return;
        }
        mode = 'single';
        document.getElementById('listPanel').style.display = '';
    }

    function render() {
        const s = summary || {};
        document.getElementById('curName').textContent =
            (s.accountName || '账户') + (curUser ? ' · ' + curUser.username : '');
        document.getElementById('acctNote').textContent = '';
        renderFund(s);
        renderSummary(s);
        renderPositions(s.positions || []);
        renderChips(s);
        renderRecords();
    }

    function renderFund(s) {
        const rows = [
            ['账户期初市值', money(s.initValue)],
            ['可用金额', money(s.cash)],
            ['备注', s.remark ? esc(s.remark) : '—']
        ];
        document.getElementById('fundRows').innerHTML = rows.map(r =>
            '<div class="apair"><span class="apair-k">' + r[0] + '</span>'
            + '<span class="apair-v">' + r[1] + '</span></div>').join('');
    }

    function setKpi(id, text, cls) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.classList.remove('up', 'down');
        if (cls) el.classList.add(cls);
    }

    function renderSummary(s) {
        setKpi('kTotalValue', money(s.totalValue), '');
        setKpi('kPosValue', money(s.positionValue), '');
        document.getElementById('kPosCost').textContent = '成本 ' + money(s.positionCost);

        setKpi('kTotalProfit', moneySigned(s.totalProfit), dir(s.totalProfit));
        document.getElementById('kTotalPct').textContent = s.totalProfitPercent == null
            ? '相对账户期初市值'
            : pctSigned(s.totalProfitPercent) + '（期初 ' + money(s.initValue) + '）';

        setKpi('kFloatProfit', moneySigned(s.positionProfit), dir(s.positionProfit));
        const cost = Number(s.positionCost || 0);
        document.getElementById('kFloatPct').textContent = cost > 0
            ? pctSigned(Number(s.positionProfit || 0) / cost * 100) + '（成本 ' + money(s.positionCost) + '）'
            : '相对持仓成本';

        setKpi('kDayProfit', moneySigned(s.dayProfit), dir(s.dayProfit));
        if (s.dayStarted === false) {
            document.getElementById('kDayPct').textContent = '未开盘 · 当日收益按 0 计';
        } else {
            const parts = ['浮动 ' + moneySigned(s.dayFloatProfit),
                '已实现 ' + moneySigned(s.dayRealizedProfit)];
            if (s.dayProfitPercent != null) {
                parts.push(pctSigned(s.dayProfitPercent));
            }
            document.getElementById('kDayPct').textContent = parts.join(' · ');
        }

        // 行情口径：未开盘按昨收、行情断了按最近价，写出来省得以为数字没刷新
        const ps = s.positions || [];
        const preClose = ps.filter(p => p.priceBasis === '昨收').length;
        const stale = ps.filter(p => p.priceBasis === '最近价' || p.priceBasis === '成本价').length;
        let tip = '';
        if (ps.length && preClose === ps.length) {
            tip = '未开盘，市值按昨收计算';
        } else if (ps.length && stale > 0) {
            tip = stale + ' 只没取到行情，按最近价/成本价兜底';
        }
        document.getElementById('quoteTip').textContent = tip;
        document.getElementById('posCount').textContent = ps.length + ' 条';
    }

    function renderChips(s) {
        document.getElementById('asum').innerHTML =
            '<span class="achip">期初市值 ' + money(s.initValue) + '</span>'
            + '<span class="achip">可用金额 ' + money(s.cash) + '</span>'
            + '<span class="achip">持仓市值 ' + money(s.positionValue) + '</span>'
            + '<span class="achip ' + dir(s.positionProfit) + '">浮动盈亏 ' + moneySigned(s.positionProfit) + '</span>'
            + '<span class="achip ' + dir(s.dayProfit) + '">当日收益 ' + moneySigned(s.dayProfit) + '</span>'
            + '<span class="achip ' + dir(s.totalProfit) + '">总盈亏 ' + moneySigned(s.totalProfit) + '</span>'
            + '<span class="achip">' + (s.positions || []).length + ' 只持仓</span>';
    }

    function renderPositions(rows) {
        const body = document.getElementById('posBody');
        if (!rows.length) {
            body.innerHTML = '<tr><td class="empty" colspan="11">这本账户还没有持仓</td></tr>';
            return;
        }
        body.innerHTML = rows.map(p => {
            const dayDir = dir(p.dayProfit);
            const totDir = dir(p.totalProfit);
            return '<tr>'
                + '<td class="code">' + esc(p.code) + '</td>'
                + '<td class="name">' + stockLinkHtml(p.code, p.name)
                + (p.priceBasis && p.priceBasis !== '现价'
                    ? '<span class="abadge">' + esc(p.priceBasis) + '</span>' : '')
                + (p.dayBuyQty > 0
                    ? '<span class="abadge abadge-day">当日买入 ' + fmtNum(p.dayBuyQty, 0) + ' 股</span>' : '')
                + '</td>'
                + '<td class="adim">' + (p.openDate ? esc(p.openDate) : '—') + '</td>'
                + '<td>' + money(p.costPrice) + '</td>'
                + '<td>' + money(p.price) + '</td>'
                + '<td>' + fmtNum(p.quantity, 0) + '</td>'
                + '<td>' + fmtNum(usableQty(p), 0) + '</td>'
                + '<td>' + money(p.costValue) + '</td>'
                + '<td>' + money(p.marketValue) + '</td>'
                + '<td class="' + dayDir + '">' + moneySigned(p.dayProfit) + '</td>'
                + '<td class="' + totDir + '">' + moneySigned(p.totalProfit)
                + '<br><small>' + pctSigned(p.totalProfitPercent) + '</small></td>'
                + '</tr>';
        }).join('');
    }

    /** 操作记录：只读，最多摆最近 20 条（全量看还是让本人去「我的账户」） */
    function renderRecords() {
        const box = document.getElementById('recList');
        const all = records || [];
        document.getElementById('recCount').textContent = all.length
            ? '最近 ' + Math.min(all.length, 20) + ' 笔 · 共 ' + all.length + ' 笔'
            : '';
        if (!all.length) {
            box.innerHTML = '<div class="arec-empty">这本账户还没有操作记录</div>';
            return;
        }
        box.innerHTML = all.slice(0, 20).map(x => {
            const buy = x.action === 'buy';
            const t = String(x.time || '');
            const when = x.tradeDate
                ? esc(x.tradeDate) + (t.length >= 19 ? ' ' + esc(t.slice(11)) : '')
                : esc(t);
            return '<div class="arec-row">'
                + '<span class="arec-act ' + (buy ? 'buy' : 'sell') + '">' + (buy ? '买入' : '卖出') + '</span>'
                + '<span class="arec-time">'
                + stockLinkHtml(x.code, x.name, {text: x.name || x.code})
                + ' · ' + esc(x.code) + '</span>'
                + '<span>' + money(x.price) + ' 元</span>'
                + '<span>' + fmtNum(x.quantity, 0) + ' 股</span>'
                + '<span class="' + dir(x.realizedProfit) + '">'
                + (buy ? '—' : moneySigned(x.realizedProfit)) + '</span>'
                + '<span class="arec-time">' + when + '</span>'
                + '</div>';
        }).join('');
    }

    /* ---------- 默认预览用户（v1.8.0） ---------- */

    async function loadPreviewConfig() {
        const r = await get('/api/admin/accounts/preview');
        if (!r || !r.success) {
            return;
        }
        preview = (r.data && r.data.users) || [];
        paintPreviewTip();
    }

    function paintPreviewTip() {
        const el = document.getElementById('previewTip');
        el.innerHTML = preview.length
            ? '默认预览：<b>' + preview.map(u => esc(u.username)).join('、')
              + '</b> —— 进入本页即平铺这些人的所有账户'
            : '还没配置默认预览用户。配好后本页默认平铺他们的所有账户，一起看。';
    }

    /** 配置弹窗：勾选要一起看的用户（列表取前 200 个账号） */
    async function openPreviewModal() {
        const [u, p] = await Promise.all([
            get('/api/admin/users?page=1&size=200'),
            get('/api/admin/accounts/preview')
        ]);
        const list = (u && u.success && u.data && u.data.rows) || [];
        const chosen = ((p && p.success && p.data && p.data.userIds) || []).map(Number);
        let mask = document.getElementById('pvMask');
        if (!mask) {
            mask = document.createElement('div');
            mask.className = 'mask';
            mask.id = 'pvMask';
            mask.innerHTML = '<div class="modal modal-lg" role="dialog" aria-modal="true" aria-label="默认预览用户">'
                + '<h3>默认预览用户</h3>'
                + '<div class="dim" style="font-size:var(--fs-12);margin-bottom:12px">'
                + '勾选的用户，进「账户管理」时平铺他们名下<b>所有账户</b>的卡片，收益 3 秒刷新一次。'
                + '最多 20 个 —— 每多一个人就多一轮行情取数。</div>'
                + '<div class="pv-list" id="pvList"></div>'
                + '<div class="modal-actions">'
                + '<button class="btn-ghost" onclick="clearPreview()">清空配置</button>'
                + '<button class="btn-ghost" onclick="closePreviewModal()">取消</button>'
                + '<button id="pvSave">保存</button>'
                + '</div></div>';
            document.body.appendChild(mask);
            mask.addEventListener('mousedown', e => {
                if (e.target === mask) {
                    closePreviewModal();
                }
            });
            mask.querySelector('#pvSave').addEventListener('click', savePreview);
        }
        mask.querySelector('#pvList').innerHTML = list.length
            ? list.map(x => '<label class="pv-row"><input type="checkbox" value="' + x.id + '"'
                + (chosen.indexOf(x.id) >= 0 ? ' checked' : '') + '>'
                + '<span class="pv-name">' + esc(x.username) + '</span>'
                + '<span class="pv-meta">' + (x.admin ? '超管' : '成员')
                + (x.enabled ? '' : ' · 已停用') + '</span></label>').join('')
            : '<div class="pv-empty">没有可选的账号</div>';
        mask.classList.add('show');
    }

    function closePreviewModal() {
        const mask = document.getElementById('pvMask');
        if (mask) {
            mask.classList.remove('show');
        }
    }

    async function savePreview() {
        const ids = Array.prototype.map.call(
            document.querySelectorAll('#pvList input[type=checkbox]:checked'),
            x => Number(x.value));
        const r = await put('/api/admin/accounts/preview', {userIds: ids});
        if (!r || !r.success) {
            return;
        }
        preview = (r.data && r.data.users) || [];
        paintPreviewTip();
        closePreviewModal();
        toast(r.message || '已保存', 'ok');
        await afterPreviewChange();
    }

    async function clearPreview() {
        if (!confirm('清空默认预览后，本页回到「按单个用户查看」，确认？')) {
            return;
        }
        const r = await put('/api/admin/accounts/preview', {userIds: []});
        if (!r || !r.success) {
            return;
        }
        preview = [];
        paintPreviewTip();
        closePreviewModal();
        toast(r.message || '已清空默认预览', 'ok');
        await afterPreviewChange();
    }

    /** 配置变了：有预览用户就平铺，没有就回单人视图 */
    async function afterPreviewChange() {
        if (preview.length) {
            await loadBoard();
            return;
        }
        document.getElementById('boardPanel').style.display = 'none';
        if (curUser) {
            await loadOverview(curUser.id, true);
        } else if (await loadUsers()) {
            selectUser(Number(document.getElementById('userSel').value));
        }
    }

    /* ---------- 3 秒轮询：与「我的账户」页同一频率 ---------- */

    function startAutoRefresh() {
        stopAutoRefresh();
        refreshTimer = setInterval(tick, REFRESH_MS);
    }

    function stopAutoRefresh() {
        if (refreshTimer) {
            clearInterval(refreshTimer);
            refreshTimer = null;
        }
        refreshBusy = false;
    }

    /**
     * 一跳只刷当前视图，且就地改数字：页面在后台不刷、弹窗开着不刷、
     * 上一次还没回来就跳过 —— 和账户页同一套规矩。
     */
    async function tick() {
        if (document.hidden || refreshBusy || document.querySelector('.mask.show')) {
            return;
        }
        refreshBusy = true;
        try {
            if (mode === 'detail' && curId > 0) {
                await refreshDetail();
            } else if (mode === 'board') {
                await loadBoard();
            } else if (curUser) {
                await loadOverview(curUser.id, true);
            }
        } catch (e) {
            // 轮询失败下一跳自然重试，不弹提示（弹了只会刷屏）
        } finally {
            refreshBusy = false;
        }
    }

    /* ---------- 事件与初始化 ---------- */

    document.getElementById('fKw').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            searchUsers();
        }
    });
    document.getElementById('userSel').addEventListener('change', function () {
        selectUser(Number(this.value));
    });

    (async function init() {
        if (!(await requireLogin())) {
            return;
        }
        if (!isAdmin()) {
            document.getElementById('denyPanel').style.display = '';
            document.getElementById('denyMsg').textContent =
                '只有超管能进账户管理，当前账号是 ' + (ME.user && ME.user.username) + '。';
            return;
        }
        document.getElementById('pickPanel').style.display = '';
        // 持仓里的标的要渲染成跳转链接，配置先拿到
        await loadStockLink();
        // 配了默认预览用户就直接平铺，否则按单个用户看（默认落在第一个账号）
        await loadPreviewConfig();
        if (preview.length) {
            await loadBoard();
        } else if (await loadUsers()) {
            selectUser(Number(document.getElementById('userSel').value));
        }
        startAutoRefresh();
    })();
</script>
</body>
</html>
