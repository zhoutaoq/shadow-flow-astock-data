server:
  port: 80
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # 压缩静态资源与接口响应：echarts.min.js 1MB gzip 后约 330KB，
  # 低带宽服务器（~1Mbps）上首屏从 8s 降到 ~2.5s
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: text/html,text/css,application/javascript,application/json

spring:
  application:
    name: stock-kline-data-crawler
  autoconfigure:
    # 数据源改由 DataSourceConfig 按 waizao.db.enabled 条件装配。
    # 无数据库模式下这里必须排除，否则启动阶段就会去连库并失败。
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mydb?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    # 本地开发可用默认值，正式环境用环境变量覆盖：DB_PASSWORD=xxx
    password: ${DB_PASSWORD:root123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
  mvc:
    static-path-pattern: /**
  # 静态资源缓存策略：HTML 仍 no-store（改了立刻生效）；
  # css/js/vendor 由 StaticCacheConfig 单独放行缓存 7 天（URL 带版本戳，发版即失效），
  # 否则 1MB 的 echarts 在 ~1Mbps 带宽下每次开页都要重下 8 秒。
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

waizao:
  # 是否启用数据库
  # false（默认）= 无数据库单机模式：不连库，数据从供应商现取现用，回测不落盘，
  #              只保留K线查看与回测，必要参数由用户在浏览器填写后复用
  # true        = 数据库模式：完整逻辑，数据落库、支持股票列表/数据更新/调用日志/配置表
  db:
    enabled: false
  api:
    base-url: http://api.waizaowang.com
    # ⚠️ token 是频繁变动的凭据，统一维护在配置表（场景 waizao / 键 token），页面「系统配置」保存即生效。
    # 系统内置默认令牌：无数据库模式以前端 common.js 的 DEFAULT_WAIZAO_TOKEN 为准（内容不支持查看）；
    # 数据库模式下仅在「配置表为空、首次启动」时作为种子写入一次，之后一律以配置表为准。
    token: "305c8974672f4bbe953e52a94a1f070c"
    # 总开关：false 时抓取请求在发出前就被拦住（接口按次计费，停用必须真拦住）
    enabled: true
    connect-timeout-ms: 10000
    read-timeout-ms: 20000
    # 串行抓取时每只股票之间的间隔（毫秒）
    batch-interval-ms: 200
    # 批处理并发度：同时向供应商发起请求的线程数
    fetch-concurrency: 8
    # 并发抓取时每个工作线程处理完一只股票后的间隔（毫秒），用于限制 QPS
    fetch-interval-ms: 100
  # 无数据库模式下单次查询/回测允许的最大自然日跨度（数据每次都要现取，跨度先卡住再发请求）
  # v1.1：1200 → 4000，支持近十年回测
  max-span-days: 4000
  stock-list-file: resources/stock-list.json

# 实时盯盘提醒（与上面其它功能完全独立：行情取自新浪财经，不连库、不走 waizao、不落盘）
watch:
  # 总开关：false 时整个盯盘模块不装配（不查行情、不推送，配置接口仍可用）
  enabled: true
  # 盯盘名单：每行一个股票名称（也允许直接写 6 位代码，或「代码 名称」/「代码,名称」）；# 开头为注释
  # v1.1 起名单改由页面维护并落盘到下面的 config-file；这里只在「首次启动、还没有落盘文件」时
  # 用来迁移老名单，之后一律以落盘配置为准。
  watch-list-file: resources/watch-list.txt
  # 落盘配置文件（开关 / 轮询间隔 / 阈值 / 盯盘股票集合）。
  # 解析顺序：先工作目录下的 watch-config.json，找不到再用这里的绝对路径。
  config-file: /home/stock-backtesting/watch-config.json
  # 进入盯盘页面的密码（后端校验，不下发给前端）
  password: "1"
  # 名称 → 代码 的索引来源（与 waizao.stock-list-file 同一份文件）
  stock-list-file: resources/stock-list.json
  # 轮询间隔（秒）：每次调度按这个间隔并发查一遍名单里所有标的
  interval-seconds: 10
  # 触发阈值（%）：与上一次成功查询的价格相比，涨/跌幅绝对值达到这个值就推钉钉
  threshold-percent: 0.5
  # 并发查询的线程池大小
  thread-pool-size: 8
  sina:
    base-url: http://hq.sinajs.cn
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
  dingtalk:
    # 机器人 Webhook（含 access_token）；留空则不推送、只打日志
    # v1.4 起钉钉机器人只支持"自定义关键词"模式（消息文本必须含后台配置的关键词），
    # 不再支持「加签」，所以也不需要 secret 字段。
    webhook: "https://oapi.dingtalk.com/robot/send?access_token=ebcfa7713cec091fcbabaff738f68e3453365b47bf43d8e65894a9793fc33317"

logging:
  level:
    root: INFO
    com.stock.kline: INFO
