<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{var t=localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <title>系统配置 - 金牛数据</title>
    <link rel="stylesheet" href="/css/common.css?v=20260920a">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">金牛数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <div id="cfgPanel" style="display:none">

        <div class="cfg-panel-head">
            <h2>系统配置</h2>
            <div class="cfg-panel-actions">
                <button class="btn-ghost" onclick="reload()">放弃改动</button>
                <button onclick="save()" id="btnSave">保存并应用</button>
            </div>
        </div>

        <section class="cards">
            <div class="card">
                <div class="card-title">当前标的</div>
                <div class="card-value" id="cName">—</div>
                <div class="card-desc" id="cCode"></div>
            </div>
            <div class="card">
                <div class="card-title">行情区间</div>
                <div class="card-value" id="cRange" style="font-size:var(--fs-20)">—</div>
            </div>
            <div class="card">
                <div class="card-title">交易日</div>
                <div class="card-value" id="cDays">—</div>
                <div class="card-desc">区间内的交易日数量</div>
            </div>
            <div class="card">
                <div class="card-title">区间涨跌幅</div>
                <div class="card-value" id="cPct">—</div>
            </div>
        </section>

        <section class="panel">
            <h2>首页背景行情</h2>
            <div class="form-row">
                <div class="field grow">
                    <label>标的</label>
                    <div id="codePick"></div>
                </div>
                <div class="field">
                    <label>起始日期</label>
                    <input type="date" id="fStart">
                </div>
                <div class="field">
                    <label>结束日期</label>
                    <input type="date" id="fEnd">
                </div>
            </div>
            <div class="modal-actions" style="margin-top:14px;justify-content:flex-start">
                <button class="btn-ghost" onclick="resetDefault()">恢复默认</button>
                <button class="btn-ghost" onclick="location.href='/'">去看首页</button>
            </div>
            <div class="sp-hint" id="stateLine"></div>
        </section>

        <section class="panel">
            <h2>股票名称跳转</h2>
            <div class="sp-hint">
                全站的股票名称都会带上跳转链接，点击开新窗口。勾选的平台会出现在名称旁边
                （点名称本身直接开「默认」那个）；一个都不勾选时名称退回纯文本。
            </div>
            <div class="form-row" style="margin-top:12px">
                <label class="chk-inline">
                    <input type="checkbox" id="slEnabled"> 启用股票名称跳转
                </label>
            </div>
            <div class="sl-rows" id="slList"></div>
            <div class="modal-actions" style="margin-top:14px;justify-content:flex-start">
                <button class="btn-ghost" onclick="resetStockLink()">恢复默认</button>
                <button id="slSave" onclick="saveStockLink()">保存跳转配置</button>
                <button class="btn-ghost" onclick="window.open('/pages/news.html','_blank')">看实际效果</button>
            </div>
            <div class="sp-hint" id="slState"></div>
        </section>

    </div>
</main>

<script src="/js/common.js?v=20260920a"></script>
<script src="/js/date-picker.js?v=20260920a"></script>
<script src="/js/stock-picker.js?v=20260920a"></script>
<script>
    /** 与后端口径一致：背景区间最长一年 */
    const MAX_SPAN_DAYS = 365;

    let current = null;
    let picker = null;

    function fmtPct(v) {
        if (v === null || v === undefined || isNaN(v)) return '—';
        return (v > 0 ? '+' : v < 0 ? '-' : '') + Math.abs(v).toFixed(1) + '%';
    }

    function setCard(id, text) {
        document.getElementById(id).textContent = text;
    }

    /** 把当前生效的一份摊到卡片与表单上 */
    function render() {
        const c = current || {};
        const bars = c.bars || [];
        const start = c.startDate || '';
        const end = c.endDate || '';

        setCard('cName', c.name || '—');
        setCard('cCode', c.code || '');
        setCard('cRange', start && end ? (start + ' ~ ' + end) : '—');
        setCard('cDays', bars.length ? String(bars.length) : '—');

        // 涨跌配色走 .up / .down 令牌：涨红跌绿
        let pct = null;
        if (bars.length > 1 && bars[0][3]) {
            pct = (bars[bars.length - 1][3] - bars[0][3]) / bars[0][3] * 100;
        }
        const pctEl = document.getElementById('cPct');
        pctEl.textContent = fmtPct(pct);
        pctEl.classList.remove('up', 'down');
        if (pct > 0) {
            pctEl.classList.add('up');
        } else if (pct < 0) {
            pctEl.classList.add('down');
        }

        document.getElementById('stateLine').textContent = !c.configured
            ? ''
            : (bars.length ? '最近更新 ' + (c.updateTime || '—') : '暂时取不到这段行情');

        if (!picker) {
            picker = createStockPicker(document.getElementById('codePick'), {});
        }
        picker.setItems(c.code ? [{code: c.code, name: c.name || ''}] : []);
        document.getElementById('fStart').value = start;
        document.getElementById('fEnd').value = end;
    }

    async function reload() {
        const r = await get('/api/home/hero');
        if (!r || !r.success) {
            return;
        }
        current = r.data || {};
        render();
    }

    /** 区间天数（含首尾），与后端一致 */
    function spanDays(start, end) {
        const a = parseYmd(start);
        const b = parseYmd(end);
        if (!a || !b) return 0;
        return Math.round((b - a) / 86400000) + 1;
    }

    let saving = false;

    async function save() {
        if (saving) return;
        // 手输的代码补成选中项，省得用户以为框里有字就算选上了
        picker.tryManual();
        const one = picker.getFirst();
        if (!one || !one.code) {
            return toast('先选一个标的', 'err');
        }
        const start = document.getElementById('fStart').value;
        const end = document.getElementById('fEnd').value;
        if (!start || !end) {
            return toast('起始日期和结束日期都要填', 'err');
        }
        if (start > end) {
            return toast('起始日期不能晚于结束日期', 'err');
        }
        const span = spanDays(start, end);
        if (span > MAX_SPAN_DAYS) {
            return toast('日期区间最长一年（' + MAX_SPAN_DAYS + ' 天），当前 ' + span + ' 天', 'err');
        }
        const btn = document.getElementById('btnSave');
        saving = true;
        btn.classList.add('loading');
        btn.innerHTML = '<span class="auth-spin"></span>正在取行情…';
        let r;
        try {
            r = await post('/api/admin/home-hero', {
                code: one.code,
                name: one.name || '',
                startDate: start,
                endDate: end
            });
        } finally {
            saving = false;
            btn.classList.remove('loading');
            btn.textContent = '保存并应用';
        }
        if (!r || !r.success) {
            return;
        }
        current = r.data || {};
        render();
        toast('首页背景已换成 ' + (current.name || '') + ' ' + (current.code || '')
            + ' · ' + current.startDate + ' ~ ' + current.endDate, 'ok');
    }

    async function resetDefault() {
        if (!confirm('恢复默认后，首页背景回到系统自带的那段行情，确认？')) {
            return;
        }
        const r = await post('/api/admin/home-hero/reset', {});
        if (!r || !r.success) {
            return;
        }
        current = r.data || {};
        render();
        toast('已恢复默认背景', 'ok');
    }

    /* =====================================================================
     * 股票名称跳转
     *
     * 配置分两层，这一页只动「开关」那一层：
     *   · URL 模板 —— application.yml 的 app.stock-link（页面只读展示，不开放编辑，
     *     免得把平台地址改坏之后全站链接一起失效）；
     *   · 启用哪些 / 默认跳哪个 —— 这里保存到系统级配置行，改完即生效不用重启。
     * ===================================================================== */
    let slCfg = null;

    async function loadStockLinkCfg() {
        const r = await get('/api/stock-link');
        slCfg = (r && r.success && r.data) ? r.data : null;
        renderStockLink();
    }

    function renderStockLink() {
        const c = slCfg || {enabled: false, defaultTarget: '', targets: []};
        const targets = c.targets || [];
        document.getElementById('slEnabled').checked = c.enabled !== false;

        document.getElementById('slList').innerHTML = targets.length
            ? targets.map(t => {
                const off = t.enabled === false;
                return '<div class="sl-row' + (off ? ' is-off' : '') + '" data-key="' + esc(t.key) + '">'
                    + '<label class="sl-on-wrap"><input type="checkbox" class="sl-on"'
                    + (off ? '' : ' checked') + '>'
                    + '<span class="sl-name">' + esc(t.label || t.key) + '</span></label>'
                    + '<span class="sl-tag">' + (t.external ? '站外' : '本系统') + '</span>'
                    + '<span class="sl-url">' + esc(t.url || '') + '</span>'
                    + '<label class="sl-def"><input type="radio" name="slDefault" value="' + esc(t.key) + '"'
                    + (t.key === c.defaultTarget && !off ? ' checked' : '')
                    + (off ? ' disabled' : '') + '> 默认</label>'
                    + '</div>';
            }).join('')
            : '<div class="sp-hint">application.yml 里没有配置任何跳转目标（app.stock-link.targets）</div>';

        bindStockLinkRows();
        paintStockLinkState();
    }

    /** 勾选变化时即时联动：停用的目标不能当默认，整行变淡 */
    function bindStockLinkRows() {
        document.querySelectorAll('#slList .sl-row').forEach(row => {
            const on = row.querySelector('.sl-on');
            const radio = row.querySelector('input[name="slDefault"]');
            const sync = () => {
                const off = !on.checked;
                row.classList.toggle('is-off', off);
                radio.disabled = off;
                if (off && radio.checked) {
                    radio.checked = false;
                }
            };
            on.addEventListener('change', sync);
            radio.addEventListener('change', paintStockLinkState);
            sync();
        });
    }

    function collectStockLink() {
        const targets = [];
        document.querySelectorAll('#slList .sl-row').forEach(row => {
            targets.push({
                key: row.getAttribute('data-key'),
                enabled: row.querySelector('.sl-on').checked
            });
        });
        const picked = document.querySelector('#slList input[name="slDefault"]:checked');
        return {
            enabled: document.getElementById('slEnabled').checked,
            defaultTarget: picked ? picked.value : '',
            targets: targets
        };
    }

    function paintStockLinkState() {
        const body = collectStockLink();
        const on = body.targets.filter(t => t.enabled);
        const el = document.getElementById('slState');
        if (!body.enabled) {
            el.textContent = '当前状态：已停用，全站股票名称按纯文本显示。';
            return;
        }
        if (!on.length) {
            el.textContent = '当前状态：一个目标都没勾选 —— 保存会被拒绝，名称仍是纯文本。';
            return;
        }
        const def = body.defaultTarget || (on[0] && on[0].key) || '';
        const row = document.querySelector('#slList .sl-row[data-key="' + def + '"]');
        const name = row ? row.querySelector('.sl-name').textContent : def;
        el.textContent = '当前状态：启用 ' + on.length + ' 个平台，点名称跳到「' + name + '」。'
            + '（保存后所有页面下一次加载即生效）';
    }

    async function saveStockLink() {
        const body = collectStockLink();
        if (body.enabled && !body.targets.filter(t => t.enabled).length) {
            return toast('至少勾选一个跳转目标', 'err');
        }
        if (body.enabled && !body.defaultTarget) {
            return toast('请指定一个「默认」跳转目标', 'err');
        }
        const btn = document.getElementById('slSave');
        btn.disabled = true;
        let r;
        try {
            r = await post('/api/admin/stock-link', body);
        } finally {
            btn.disabled = false;
        }
        if (!r || !r.success) {
            return;
        }
        slCfg = r.data;
        renderStockLink();
        toast(r.message || '已保存并生效', 'ok');
    }

    async function resetStockLink() {
        if (!confirm('恢复默认后，跳转开关回到配置文件里的出厂值，确认？')) {
            return;
        }
        const r = await post('/api/admin/stock-link/reset', {});
        if (!r || !r.success) {
            return;
        }
        slCfg = r.data;
        renderStockLink();
        toast(r.message || '已恢复默认跳转配置', 'ok');
    }

    (async function init() {
        await loadMode();
        if (!(await requireLogin())) {
            return;
        }
        // 菜单本来就不给非超管显示这一项，直接输地址进来的就回首页
        if (!isAdmin()) {
            location.replace('/');
            return;
        }
        document.getElementById('cfgPanel').style.display = '';
        // 日期控件平时由 common.js 在页面就绪时统一增强；这一页自己再兜一次，
        // 免得别的脚本出错时这里退化成裸控件（重复调用是安全的，每个 input 只增强一次）
        if (typeof initDatePickers === 'function') {
            initDatePickers(document.getElementById('cfgPanel'));
        }
        document.getElementById('slEnabled').addEventListener('change', paintStockLinkState);
        await reload();
        await loadStockLinkCfg();
    })();
</script>
</body>
</html>
