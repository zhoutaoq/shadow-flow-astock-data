<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{var t=localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <title>我的账户</title>
    <link rel="stylesheet" href="/css/common.css?v=20260916a">
    <link rel="stylesheet" href="/css/account.css?v=20260916a">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">金牛数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <section class="panel" id="gatePanel" style="display:none">
        <h2>我的账户</h2>
        <div class="modal-actions">
            <button onclick="openAuthModal({onSuccess: reload})">去登录</button>
        </div>
    </section>

    <!-- ============================ 一级：账户 ============================ -->
    <div id="listPanel" style="display:none">
        <div class="ahead">
            <div class="ahead-l">
                <h1 class="ahead-t">我的账户</h1>
                <div class="asum" id="ovChips"></div>
            </div>
            <div class="ahead-r">
                <button class="btn-ghost" onclick="reload()">重新载入</button>
                <button onclick="openAccountModal('create')">＋ 新建账户</button>
            </div>
        </div>

        <div class="acc-grid" id="accGrid"></div>
    </div>

    <!-- ==================== 二级：账户下的持仓 / 盈亏 / 记录 ==================== -->
    <div id="acctPanel" style="display:none">

        <div class="ahead">
            <div class="ahead-l">
                <div class="acrumb">
                    <button class="btn-ghost btn-sm" onclick="backToList()">
                        <span class="acrumb-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
                        全部账户
                    </button>
                    <h1 class="ahead-t" id="curName">账户</h1>
                </div>
                <div class="asum" id="asum"></div>
            </div>
            <div class="ahead-r">
                <button class="btn-ghost" onclick="reload()">重新载入</button>
                <button class="btn-ghost" onclick="openAccountModal('rename', curId)">重命名</button>
                <button class="btn-ghost" onclick="openFundModal()">维护资金</button>
                <button class="btn-ghost" onclick="openPositionModal()">＋ 添加持仓</button>
                <button onclick="openRecordModal()">＋ 记一笔</button>
            </div>
        </div>

        <div class="agrid">

            <!-- ① 账户资金：只读展示。期初市值与可用金额不默认开放编辑，
                 要改点右上角「维护」进弹窗（需求 v1.5.5 第 ① 条） -->
            <section class="acard acard-narrow">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span>
                    <h2>账户资金</h2>
                    <span class="acard-note" id="acctNote"></span>
                    <button class="btn-ghost btn-sm" onclick="openFundModal()">维护</button>
                </header>
                <div class="acard-bd">
                    <div class="apairs" id="fundRows"></div>
                    <div class="akpi-d">期初市值与可用金额不随页面直接编辑，改动集中在弹窗里完成</div>
                </div>
            </section>

            <!-- ② 收益汇总 -->
            <section class="acard acard-wide">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></span>
                    <h2>收益汇总</h2>
                    <span class="acard-note" id="quoteTip"></span>
                </header>
                <div class="acard-bd">
                    <div class="akpi-grid">
                        <div class="akpi">
                            <div class="akpi-t">当前总市值</div>
                            <div class="akpi-v" id="kTotalValue">-</div>
                            <div class="akpi-d">持仓市值 + 可用金额</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">持仓市值</div>
                            <div class="akpi-v" id="kPosValue">-</div>
                            <div class="akpi-d" id="kPosCost">成本 -</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">当日收益</div>
                            <div class="akpi-v" id="kDayProfit">-</div>
                            <div class="akpi-d" id="kDayPct">持仓浮动 + 当日已实现</div>
                        </div>
                        <div class="akpi">
                            <div class="akpi-t">总收益</div>
                            <div class="akpi-v" id="kTotalProfit">-</div>
                            <div class="akpi-d" id="kTotalPct">相对账户期初市值</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ③ 持仓配置 -->
            <section class="acard">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
                    <h2>持仓配置</h2>
                    <span class="acard-note" id="posCount"></span>
                </header>
                <div class="acard-bd">
                    <div class="atable-wrap">
                        <table class="atable">
                            <thead>
                            <tr>
                                <th>标的</th>
                                <th>名称</th>
                                <th>建仓日</th>
                                <th>成本价</th>
                                <th>现价</th>
                                <th>数量</th>
                                <th>成本市值</th>
                                <th>当前市值</th>
                                <th>当日收益</th>
                                <th>总收益</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody id="posBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- ④ 操作记录：实时生效、不落盘。表单收进弹窗（需求 v1.5.5 第 ② 条） -->
            <section class="acard">
                <header class="acard-hd">
                    <span class="acard-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></span>
                    <h2>操作记录</h2>
                    <span class="acard-note" id="recCount"></span>
                    <button class="btn-ghost btn-sm" onclick="openRecordModal()">＋ 记一笔</button>
                </header>
                <div class="acard-bd">
                    <div class="arec-head">
                        <span>方向</span>
                        <span>标的</span>
                        <span>成交价</span>
                        <span>数量</span>
                        <span>当日已实现</span>
                        <span>时间</span>
                    </div>
                    <div class="arec-list" id="recList"></div>
                </div>
            </section>

        </div>
    </div>
</main>

<script src="/js/common.js?v=20260916a"></script>
<script src="/js/date-picker.js?v=20260916a"></script>
<script src="/js/stock-picker.js?v=20260916a"></script>
<script>
    let overview = null;     // /api/account/accounts 一级列表
    let cfg = null;          // /api/account 当前账户设置
    let summary = null;      // /api/account/summary 当前账户汇总
    let limits = null;       // /api/account/limits
    let curId = 0;           // 当前进入的账户 id；0 = 停在账户列表
    let recAction = 'buy';   // 「记一笔」弹窗里当前选中的方向
    let posPicker = null;    // 持仓弹窗里的选择器
    let recPicker = null;    // 「记一笔」弹窗里的选择器

    function showGate() {
        document.getElementById('gatePanel').style.display = '';
        document.getElementById('listPanel').style.display = 'none';
        document.getElementById('acctPanel').style.display = 'none';
    }

    /** 红涨绿跌：返回 up / down / '' 三态（0 或拿不到时不配色） */
    function dir(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n) || n === 0) return '';
        return n > 0 ? 'up' : 'down';
    }

    /** 金额：两位小数 + 千分位；null / 拿不到显示 — */
    function money(v) {
        return fmtNum(v, 2);
    }

    /** 带符号金额：+1,234.00 / -1,234.00 */
    function moneySigned(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n)) return '—';
        return (n > 0 ? '+' : n < 0 ? '-' : '') + fmtNum(Math.abs(n), 2);
    }

    /** 带符号百分比：+1.23% / -1.23%；null 显示 — */
    function pctSigned(v) {
        const n = Number(v);
        if (v === null || v === undefined || isNaN(n)) return '—';
        return (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(n).toFixed(2) + '%';
    }

    /* ==================== 一级：账户列表 ==================== */

    async function openList() {
        const r = await get('/api/account/accounts');
        if (!r || !r.success) {
            showGate();
            return;
        }
        overview = r.data || {accounts: []};
        curId = 0;
        document.getElementById('gatePanel').style.display = 'none';
        document.getElementById('acctPanel').style.display = 'none';
        document.getElementById('listPanel').style.display = '';
        renderAccounts();
    }

    function renderAccounts() {
        const ov = overview || {};
        const rows = ov.accounts || [];
        const maxA = (limits && limits.maxAccounts) || 10;

        document.getElementById('ovChips').innerHTML =
            '<span class="achip">' + rows.length + ' / ' + maxA + ' 个账户</span>'
            + '<span class="achip">合计总市值 ' + money(ov.totalValue) + '</span>'
            + '<span class="achip ' + dir(ov.dayProfit) + '">合计当日收益 ' + moneySigned(ov.dayProfit) + '</span>'
            + '<span class="achip ' + dir(ov.totalProfit) + '">合计总收益 ' + moneySigned(ov.totalProfit) + '</span>';

        const canAdd = rows.length < maxA;
        document.getElementById('accGrid').innerHTML = rows.map(a => {
            const d = dir(a.dayProfit);
            const t = dir(a.totalProfit);
            return '<div class="acc-item" data-id="' + a.id + '">'
                + '<div class="acc-hd">'
                + '<span class="acc-name">' + esc(a.name || '账户') + '</span>'
                + '<span class="acc-badge">' + a.positionCount + ' 只持仓</span>'
                + '</div>'
                + '<div class="acc-mv">' + money(a.totalValue) + '</div>'
                + '<div class="acc-kpis">'
                + '<span class="acc-kpi">当日 <b class="' + d + '">' + moneySigned(a.dayProfit) + '</b></span>'
                + '<span class="acc-kpi">总收益 <b class="' + t + '">' + moneySigned(a.totalProfit) + '</b>'
                + '<small> ' + pctSigned(a.totalProfitPercent) + '</small></span>'
                + '</div>'
                + '<div class="acc-ft">'
                + '<span>期初 ' + money(a.initValue) + '</span>'
                + '<span>可用 ' + money(a.cash) + '</span>'
                + '</div>'
                + '<div class="acc-ops">'
                + '<button class="btn-ghost btn-sm" data-op="open">进入</button>'
                + '<button class="btn-ghost btn-sm" data-op="rename">重命名</button>'
                + '<button class="btn-ghost btn-sm" data-op="delete">删除</button>'
                + '</div>'
                + '</div>';
        }).join('') + (canAdd
            ? '<button type="button" class="acc-add" onclick="openAccountModal(\'create\')">＋ 新建账户</button>'
            : '');

        document.getElementById('accGrid').querySelectorAll('.acc-item').forEach(card => {
            const id = Number(card.getAttribute('data-id'));
            card.addEventListener('click', e => {
                const op = e.target.closest('[data-op]');
                if (!op) return enterAccount(id);
                e.stopPropagation();
                const kind = op.getAttribute('data-op');
                if (kind === 'open') return enterAccount(id);
                if (kind === 'rename') return openAccountModal('rename', id);
                if (kind === 'delete') return removeAccount(id);
            });
        });
    }

    async function enterAccount(id) {
        curId = id;
        const [accR, sumR] = await Promise.all([
            get('/api/account?accountId=' + id),
            get('/api/account/summary?accountId=' + id)
        ]);
        if (!accR || !accR.success || !accR.data) {
            toast((accR && accR.message) || '账户打不开，可能已被删除', 'err');
            return openList();
        }
        cfg = accR.data;
        summary = (sumR && sumR.success) ? sumR.data : null;
        document.getElementById('gatePanel').style.display = 'none';
        document.getElementById('listPanel').style.display = 'none';
        document.getElementById('acctPanel').style.display = '';
        render();
        await loadRecords();
    }

    function backToList() {
        curId = 0;
        openList();
    }

    /** 重新载入：停在哪个视图就刷哪个 */
    async function reload() {
        if (curId > 0) {
            return enterAccount(curId);
        }
        return openList();
    }

    /* ==================== 二级：当前账户 ==================== */

    function render() {
        const s = summary || {};
        document.getElementById('curName').textContent = (cfg && cfg.name) || '账户';
        document.getElementById('acctNote').textContent = '';

        renderFund();
        renderSummary(s);
        renderPositions(s.positions || []);
        renderSummaryChips(s);
        renderQuoteTip(s);
    }

    /** 账户资金：只读展示，改动统一走「维护」弹窗（需求 v1.5.5 第 ① 条） */
    function renderFund() {
        const c = cfg || {};
        const rows = [
            ['账户期初市值', money(c.initValue), '总收益的比较基准'],
            ['可用金额', money(c.cash), '买卖操作会实时增减它'],
            ['备注', (c.remark ? esc(c.remark) : '—'), '']
        ];
        document.getElementById('fundRows').innerHTML = rows.map(r =>
            '<div class="apair">'
            + '<span class="apair-k">' + r[0] + '</span>'
            + '<span class="apair-v">' + r[1] + '</span>'
            + (r[2] ? '<span class="apair-d">' + r[2] + '</span>' : '')
            + '</div>').join('');
    }

    function renderSummary(s) {
        setKpi('kTotalValue', money(s.totalValue), '');
        setKpi('kPosValue', money(s.positionValue), '');
        document.getElementById('kPosCost').textContent = '成本 ' + money(s.positionCost);

        setKpi('kDayProfit', moneySigned(s.dayProfit), dir(s.dayProfit));
        // 当日收益 = 持仓浮动 + 当天卖出的已实现，副标题把两个来源摊开，便于核对
        const parts = ['浮动 ' + moneySigned(s.dayFloatProfit), '已实现 ' + moneySigned(s.dayRealizedProfit)];
        if (s.dayProfitPercent != null) {
            parts.push(pctSigned(s.dayProfitPercent) + '（按当量基准）');
        }
        document.getElementById('kDayPct').textContent = parts.join(' · ');

        setKpi('kTotalProfit', moneySigned(s.totalProfit), dir(s.totalProfit));
        document.getElementById('kTotalPct').textContent = s.totalProfitPercent == null
            ? '相对账户期初市值'
            : pctSigned(s.totalProfitPercent) + '（期初 ' + money(s.initValue) + '）';
    }

    function setKpi(id, text, cls) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.classList.remove('up', 'down');
        if (cls) el.classList.add(cls);
    }

    /** 页头摘要：期初 / 可用 / 持仓数 / 当日与已实现 */
    function renderSummaryChips(s) {
        const n = (s.positions || []).length;
        const maxP = (limits && limits.maxPositions) || 200;
        document.getElementById('asum').innerHTML =
            '<span class="achip">期初市值 ' + money(s.initValue) + '</span>'
            + '<span class="achip">可用金额 ' + money(s.cash) + '</span>'
            + '<span class="achip">持仓市值 ' + money(s.positionValue) + '</span>'
            + '<span class="achip ' + dir(s.dayProfit) + '">当日收益 ' + moneySigned(s.dayProfit) + '</span>'
            + '<span class="achip ' + dir(s.dayRealizedProfit) + '">当日已实现 ' + moneySigned(s.dayRealizedProfit) + '</span>'
            + '<span class="achip ' + dir(s.totalProfit) + '">总收益 ' + moneySigned(s.totalProfit) + '</span>'
            + '<span class="achip">' + n + ' / ' + maxP + ' 只持仓</span>';
    }

    /** 行情提示：有持仓但一条行情都没取到时，明确告诉用户现价是成本价兜底 */
    function renderQuoteTip(s) {
        const ps = s.positions || [];
        const quoted = ps.filter(p => p.quoted).length;
        const el = document.getElementById('quoteTip');
        if (!ps.length) {
            el.textContent = '';
        } else if (quoted === 0) {
            el.textContent = '未取到实时行情，现价暂按成本价显示';
        } else if (quoted < ps.length) {
            el.textContent = quoted + '/' + ps.length + ' 只已取到实时行情';
        } else {
            el.textContent = '现价取自实时行情';
        }
        document.getElementById('posCount').textContent = ps.length + ' 条';
    }

    function renderPositions(rows) {
        const body = document.getElementById('posBody');
        if (!rows.length) {
            body.innerHTML = '<tr><td class="empty" colspan="11">这本账户还没有持仓，点右上角「＋ 添加持仓」，或到「操作记录」里「＋ 记一笔」买入一只</td></tr>';
            return;
        }
        body.innerHTML = rows.map(p => {
            const dayDir = dir(p.dayProfit);
            const totDir = dir(p.totalProfit);
            return '<tr>'
                + '<td class="code">' + esc(p.code) + '</td>'
                + '<td class="name">' + esc(p.name || '')
                + (p.quoted ? '' : '<span class="abadge">成本价兜底</span>')
                + (p.dayBuyQty > 0 ? '<span class="abadge abadge-day">当日买入 ' + fmtNum(p.dayBuyQty, 0) + ' 股</span>' : '')
                + '</td>'
                + '<td class="adim">' + (p.openDate ? esc(p.openDate) : '—') + '</td>'
                + '<td>' + money(p.costPrice) + '</td>'
                + '<td>' + money(p.price) + '</td>'
                + '<td>' + fmtNum(p.quantity, 0) + '</td>'
                + '<td>' + money(p.costValue) + '</td>'
                + '<td>' + money(p.marketValue) + '</td>'
                + '<td class="' + dayDir + '">' + moneySigned(p.dayProfit)
                + '<br><small>' + (p.dayProfitPercent == null ? '—' : pctSigned(p.dayProfitPercent)) + '</small>'
                + '<br><small class="adim">基准 ' + esc(p.dayBasis || '—') + '</small></td>'
                + '<td class="' + totDir + '">' + moneySigned(p.totalProfit)
                + '<br><small>' + pctSigned(p.totalProfitPercent) + '</small></td>'
                + '<td><span class="arow-act">'
                + '<button class="btn-ghost btn-sm" onclick="openPositionModal(' + p.id + ')">改</button>'
                + '<button class="btn-ghost btn-sm" onclick="removePosition(' + p.id + ')">删</button>'
                + '</span></td>'
                + '</tr>';
        }).join('');
    }

    /* ==================== 账户弹窗（新建 / 重命名） ==================== */

    let accountMode = 'create';
    /**
     * 弹窗正在处理哪本账的那份快照。
     *
     * <p>列表态没有 curId，而且 cfg 里装的是「上一次进二级时那本账」——
     * 拿它当重命名的基准会把别本账的期初/可用一起写过去，所以目标账单独记。
     */
    let accountTarget = null;

    function openAccountModal(mode, id) {
        accountMode = mode;
        accountTarget = (mode === 'rename' && id)
            ? ((overview && (overview.accounts || []).find(a => a.id === id))
                || (cfg && cfg.id === id ? cfg : null))
            : null;
        const targetId = accountTarget ? accountTarget.id : (id || 0);

        let mask = document.getElementById('accMask');
        if (!mask) {
            mask = document.createElement('div');
            mask.className = 'mask';
            mask.id = 'accMask';
            mask.innerHTML = '<div class="modal" style="width:440px">'
                + '<h3 id="accTitle">新建账户</h3>'
                + '<div class="field"><label for="accName">账户名称</label>'
                + '<input type="text" id="accName" maxlength="32" autocomplete="off" spellcheck="false"></div>'
                + '<div class="field acc-only-create"><label for="accInit">期初市值（元）</label>'
                + '<input type="number" id="accInit" min="0" step="1000" inputmode="decimal"></div>'
                + '<div class="field acc-only-create"><label for="accCash">可用金额（元）</label>'
                + '<input type="number" id="accCash" step="1000" inputmode="decimal"></div>'
                + '<div class="modal-actions">'
                + '<button class="btn-ghost" id="accCancel">取消</button>'
                + '<button id="accSave">保存</button>'
                + '</div></div>';
            document.body.appendChild(mask);
            mask.querySelector('#accCancel').addEventListener('click', () => mask.classList.remove('show'));
            mask.addEventListener('mousedown', e => {
                if (e.target === mask) mask.classList.remove('show');
            });
            mask.querySelector('#accSave').addEventListener('click', submitAccountModal);
        }
        mask.setAttribute('data-target', String(targetId));
        mask.querySelector('#accTitle').textContent = accountTarget ? '重命名账户' : '新建账户';
        mask.querySelector('#accName').value = accountTarget ? (accountTarget.name || '') : '';
        mask.querySelector('#accInit').value = accountTarget ? accountTarget.initValue : '';
        mask.querySelector('#accCash').value = accountTarget ? accountTarget.cash : '';
        mask.classList.toggle('rename', !!accountTarget);
        mask.classList.add('show');
        setTimeout(() => mask.querySelector('#accName').focus(), 30);
    }

    async function submitAccountModal() {
        const name = document.getElementById('accName').value.trim();
        if (!name) {
            return toast('账户名称不能为空', 'err');
        }
        const targetId = Number(document.getElementById('accMask').getAttribute('data-target') || 0);
        if (accountMode === 'create') {
            const initRaw = document.getElementById('accInit').value;
            const cashRaw = document.getElementById('accCash').value;
            const init = String(initRaw).trim() === '' ? 0 : parseFloat(initRaw);
            const cash = String(cashRaw).trim() === '' ? 0 : parseFloat(cashRaw);
            if (isNaN(init) || init < 0) {
                return toast('期初市值要填一个不小于 0 的数字', 'err');
            }
            if (isNaN(cash)) {
                return toast('可用金额要填一个数字', 'err');
            }
            const r = await post('/api/account/accounts', {name: name, initValue: init, cash: cash});
            if (!r || !r.success) return;
            document.getElementById('accMask').classList.remove('show');
            toast(r.message || '账户已创建', 'ok');
            await reload();
            return;
        }
        // 重命名：只改名字，期初/可用/备注照目标账原值回写
        const r = await put('/api/account/accounts/' + targetId, {
            name: name,
            initValue: accountTarget ? accountTarget.initValue : 0,
            cash: accountTarget ? accountTarget.cash : 0,
            remark: accountTarget ? accountTarget.remark : null
        });
        if (!r || !r.success) return;
        document.getElementById('accMask').classList.remove('show');
        toast('账户名已更新', 'ok');
        await reload();
    }

    async function removeAccount(id) {
        const row = (overview && overview.accounts || []).find(a => a.id === id);
        const label = row ? row.name : id;
        if (!confirm('确定删除账户「' + label + '」？这本账下的持仓与操作记录会一并删除。')) {
            return;
        }
        const r = await del('/api/account/accounts/' + id);
        if (r && r.success) {
            toast('账户已删除', 'ok');
            if (curId === id) curId = 0;
            await openList();
        }
    }

    /* ============ 持仓弹窗 ============ */

    let editingId = null;

    function openPositionModal(id) {
        editingId = id || null;
        const row = id ? (summary.positions || []).find(p => p.id === id) : null;

        let mask = document.getElementById('posMask');
        if (!mask) {
            mask = document.createElement('div');
            mask.className = 'mask';
            mask.id = 'posMask';
            mask.innerHTML = '<div class="modal" style="width:480px">'
                + '<h3 id="posTitle">添加持仓</h3>'
                + '<div class="field"><label>标的</label><div id="posPickerBox"></div></div>'
                + '<div class="field"><label for="posCost">成本价（元）</label>'
                + '<input type="number" id="posCost" min="0" step="0.01" inputmode="decimal"></div>'
                + '<div class="field"><label for="posQty">持仓数量（股）</label>'
                + '<input type="number" id="posQty" min="1" step="100" inputmode="numeric"></div>'
                + '<div class="field"><label for="posOpenDate">建仓日（选填）</label>'
                + '<input type="date" id="posOpenDate"></div>'
                + '<div class="modal-note">建仓日留空即不记；填成今天时，这条持仓的当日盈亏会以成本价为基准'
                + '（页面直接配的持仓没有成交记录，只能用成本价当今天的起点）。</div>'
                + '<div class="modal-actions">'
                + '<button class="btn-ghost" id="posCancel">取消</button>'
                + '<button id="posSave">保存</button>'
                + '</div></div>';
            document.body.appendChild(mask);
            mask.querySelector('#posCancel').addEventListener('click', () => mask.classList.remove('show'));
            mask.addEventListener('mousedown', e => {
                if (e.target === mask) mask.classList.remove('show');
            });
            mask.querySelector('#posSave').addEventListener('click', submitPosition);
            // 日历增强要在弹窗 DOM 建好之后再挂，且只挂一次
            if (typeof initDatePickers === 'function') {
                initDatePickers(mask);
            }
        }
        mask.querySelector('#posTitle').textContent = row ? '修改持仓' : '添加持仓';
        if (!posPicker) {
            posPicker = createStockPicker(mask.querySelector('#posPickerBox'), {multiple: false});
        }
        posPicker.setItems(row ? [{code: row.code, name: row.name}] : []);
        mask.querySelector('#posCost').value = row ? row.costPrice : '';
        mask.querySelector('#posQty').value = row ? row.quantity : '';
        mask.querySelector('#posOpenDate').value = (row && row.openDate) ? row.openDate : '';
        mask.classList.add('show');
    }

    async function submitPosition() {
        const picked = posPicker.getFirst();
        if (!picked || !picked.code) {
            return toast('请选择持仓标的', 'err');
        }
        const cost = parseFloat(document.getElementById('posCost').value);
        const qty = parseInt(document.getElementById('posQty').value, 10);
        if (isNaN(cost) || cost <= 0) {
            return toast('成本价必须大于 0', 'err');
        }
        if (isNaN(qty) || qty <= 0) {
            return toast('持仓数量必须大于 0', 'err');
        }
        const openDate = document.getElementById('posOpenDate').value;
        const body = {
            code: picked.code, name: picked.name || '', costPrice: cost, quantity: qty,
            openDate: openDate ? openDate : null
        };
        const r = editingId
            ? await put('/api/account/positions/' + editingId + '?accountId=' + curId, body)
            : await post('/api/account/positions?accountId=' + curId, body);
        if (!r || !r.success) {
            return;
        }
        document.getElementById('posMask').classList.remove('show');
        toast(r.message || '已保存', 'ok');
        await enterAccount(curId);
    }

    async function removePosition(id) {
        const row = (summary.positions || []).find(p => p.id === id);
        if (!confirm('确定删除持仓「' + (row ? row.name : id) + '」？')) {
            return;
        }
        const r = await del('/api/account/positions/' + id + '?accountId=' + curId);
        if (r && r.success) {
            toast('持仓已删除', 'ok');
            await enterAccount(curId);
        }
    }

    /* ============ 账户资金维护弹窗（期初市值 / 可用金额 / 备注） ============ */

    /**
     * 期初市值与可用金额是最容易被误改的两个数（它们直接决定总收益与买卖回款），
     * 所以不在页面上直接开放编辑，统一收进这个弹窗。
     */
    function openFundModal() {
        let mask = document.getElementById('fundMask');
        if (!mask) {
            mask = document.createElement('div');
            mask.className = 'mask';
            mask.id = 'fundMask';
            mask.innerHTML = '<div class="modal" style="width:460px">'
                + '<h3>维护账户资金</h3>'
                + '<div class="field"><label for="fundInit">账户期初市值（元）</label>'
                + '<input type="number" id="fundInit" min="0" step="1000" inputmode="decimal"></div>'
                + '<div class="field"><label for="fundCash">可用金额（元）</label>'
                + '<input type="number" id="fundCash" step="1000" inputmode="decimal"></div>'
                + '<div class="field"><label for="fundRemark">备注</label>'
                + '<input type="text" id="fundRemark" maxlength="255" autocomplete="off" spellcheck="false" placeholder="选填"></div>'
                + '<div class="modal-note">期初市值是总收益的比较基准；可用金额是现金余额，买卖操作会实时增减它。'
                + '这里的修改会直接覆盖当前值，保存后立即生效。</div>'
                + '<div class="modal-actions">'
                + '<button class="btn-ghost" id="fundCancel">取消</button>'
                + '<button id="fundSave">保存</button>'
                + '</div></div>';
            document.body.appendChild(mask);
            mask.querySelector('#fundCancel').addEventListener('click', () => mask.classList.remove('show'));
            mask.addEventListener('mousedown', e => {
                if (e.target === mask) mask.classList.remove('show');
            });
            mask.querySelector('#fundSave').addEventListener('click', submitFund);
        }
        mask.querySelector('#fundInit').value = (cfg && cfg.initValue != null) ? cfg.initValue : 0;
        mask.querySelector('#fundCash').value = (cfg && cfg.cash != null) ? cfg.cash : 0;
        mask.querySelector('#fundRemark').value = (cfg && cfg.remark) || '';
        mask.classList.add('show');
        setTimeout(() => mask.querySelector('#fundInit').focus(), 30);
    }

    async function submitFund() {
        const init = parseFloat(document.getElementById('fundInit').value);
        const cash = parseFloat(document.getElementById('fundCash').value);
        if (isNaN(init) || init < 0) {
            return toast('账户期初市值不能为空或负数', 'err');
        }
        if (isNaN(cash)) {
            return toast('可用金额要填一个数字', 'err');
        }
        const r = await put('/api/account?accountId=' + curId, {
            name: cfg ? cfg.name : null,
            initValue: init,
            cash: cash,
            remark: document.getElementById('fundRemark').value.trim()
        });
        if (!r || !r.success) {
            return;
        }
        document.getElementById('fundMask').classList.remove('show');
        toast('账户资金已更新', 'ok');
        await enterAccount(curId);
    }

    /* ============ 操作记录（列表 + 「记一笔」弹窗） ============ */

    async function loadRecords() {
        const r = await get('/api/account/records?accountId=' + curId);
        const box = document.getElementById('recList');
        if (!box) return;
        const rows = (r && r.success && r.data) ? r.data : [];
        const note = document.getElementById('recCount');
        if (note) note.textContent = rows.length ? rows.length + ' 条' : '';
        if (!rows.length) {
            box.innerHTML = '<div class="arec-empty">这本账户还没有操作记录</div>';
            return;
        }
        box.innerHTML = rows.map(x => {
            const buy = x.action === 'buy';
            // 「当天」标记：买入 = 这笔量按买入价算当日盈亏；卖出 = 卖的是当天买入的那部分
            const same = x.sameDay ? '<span class="arec-tag">当天</span>' : '';
            return '<div class="arec-row">'
                + '<span class="arec-act ' + (buy ? 'buy' : 'sell') + '">' + (buy ? '买入' : '卖出') + '</span>'
                + '<span class="arec-time">' + esc(x.name || x.code) + ' · ' + esc(x.code) + same + '</span>'
                + '<span>' + money(x.price) + ' 元</span>'
                + '<span>' + fmtNum(x.quantity, 0) + ' 股</span>'
                + '<span class="' + dir(x.realizedProfit) + '">'
                + (buy ? '—' : moneySigned(x.realizedProfit)) + '</span>'
                + '<span class="arec-time">' + esc(x.time || '') + '</span>'
                + '</div>';
        }).join('');
    }

    /**
     * 「记一笔」弹窗（需求 v1.5.5 第 ② 条）。
     *
     * <p>相比原来平铺在卡片里的表单，这里多了两样东西：成交价（买卖都按它动可用金额，
     * 页面预填实时行情价）与「当天」勾选框（决定这笔量按买入价还是昨收算当日盈亏）。
     */
    function openRecordModal() {
        let mask = document.getElementById('recMask');
        if (!mask) {
            mask = document.createElement('div');
            mask.className = 'mask';
            mask.id = 'recMask';
            mask.innerHTML = '<div class="modal" style="width:500px">'
                + '<h3>记一笔买卖</h3>'
                + '<div class="field"><label>标的</label><div id="recPickerBox"></div></div>'
                + '<div class="field"><label>方向</label>'
                + '<div class="aseg" id="recAction">'
                + '<button type="button" class="buy on" data-act="buy">买入</button>'
                + '<button type="button" class="sell" data-act="sell">卖出</button>'
                + '</div></div>'
                + '<div class="field"><label for="recQty">数量（股）</label>'
                + '<input type="number" id="recQty" min="1" step="100" inputmode="numeric"></div>'
                + '<div class="field"><label for="recPrice">成交价（元）</label>'
                + '<input type="number" id="recPrice" min="0" step="0.01" inputmode="decimal"'
                + ' placeholder="选好标的自动带出实时价，可手改"></div>'
                + '<div class="field"><label class="chk"><input type="checkbox" id="recToday" checked>'
                + '<span id="recTodayText">当天买入</span></label></div>'
                + '<div class="modal-note" id="recNote"></div>'
                + '<div class="modal-actions">'
                + '<button class="btn-ghost" id="recCancel">取消</button>'
                + '<button id="recSave">记一笔</button>'
                + '</div></div>';
            document.body.appendChild(mask);
            mask.querySelector('#recCancel').addEventListener('click', () => mask.classList.remove('show'));
            mask.addEventListener('mousedown', e => {
                if (e.target === mask) mask.classList.remove('show');
            });
            mask.querySelector('#recSave').addEventListener('click', submitRecord);
            recPicker = createStockPicker(mask.querySelector('#recPickerBox'), {
                multiple: false,
                // 选完标的自动带出成交价（已持仓 = 成本价，未持仓 = 实时行情价）
                onChange: () => { fillPrice(true); }
            });
            bindActionSegment();
        }
        recAction = 'buy';
        syncRecordModal();
        mask.querySelector('#recQty').value = '';
        mask.querySelector('#recPrice').value = '';
        mask.querySelector('#recToday').checked = true;
        if (recPicker) recPicker.setItems([]);
        mask.classList.add('show');
    }

    /** 方向切换：按钮高亮 + 勾选框文案 + 说明文字一起跟着走 */
    function syncRecordModal() {
        const buy = recAction === 'buy';
        const box = document.getElementById('recAction');
        if (box) {
            box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.getAttribute('data-act') === recAction));
        }
        const label = document.getElementById('recTodayText');
        if (label) {
            label.textContent = buy
                ? '当天买入（这笔量的当日盈亏从买入价起算）'
                : '卖的是当天买入的那部分（已实现按当日买入均价算）';
        }
        const note = document.getElementById('recNote');
        if (note) {
            note.textContent = buy
                ? '买入按成交价扣减可用金额；已有持仓时成本价按加权平均重算。不勾选则视为隔夜持仓，当日盈亏按昨收算。'
                : '卖出按成交价加回可用金额；不勾选则视为卖出隔夜持仓，那部分的当日已实现按昨收算。';
        }
    }

    function bindActionSegment() {
        const box = document.getElementById('recAction');
        if (!box) return;
        box.querySelectorAll('button').forEach(b => {
            b.addEventListener('click', () => {
                recAction = b.getAttribute('data-act');
                syncRecordModal();
                // 切到买入时若价格还空着就带出行情价；用户手填过的值不覆盖
                if (recAction === 'buy') {
                    fillPrice(false);
                }
            });
        });
    }

    async function submitRecord() {
        const picked = recPicker ? recPicker.getFirst() : null;
        if (!picked || !picked.code) {
            return toast('请选择操作标的', 'err');
        }
        const qty = parseInt(document.getElementById('recQty').value, 10);
        if (isNaN(qty) || qty <= 0) {
            return toast('数量必须大于 0', 'err');
        }
        const priceRaw = document.getElementById('recPrice').value;
        let price = null;
        if (String(priceRaw).trim() !== '') {
            price = parseFloat(priceRaw);
            if (isNaN(price) || price <= 0) {
                return toast('成交价必须大于 0', 'err');
            }
        }
        const btn = document.getElementById('recSave');
        btn.disabled = true;
        try {
            const body = {
                action: recAction,
                code: picked.code,
                name: picked.name || '',
                quantity: qty,
                today: document.getElementById('recToday').checked
            };
            if (price != null) {
                body.price = price;
            }
            const r = await post('/api/account/records?accountId=' + curId, body);
            if (!r || !r.success) {
                return;
            }
            document.getElementById('recMask').classList.remove('show');
            toast(r.message || '已生效', 'ok');
            await enterAccount(curId);
        } finally {
            btn.disabled = false;
        }
    }

    /**
     * 选好标的后预填成交价：取该标的实时行情价（取不到由后端回落到持仓成本价）。
     *
     * @param {boolean} force true = 无条件覆盖（换了标的）；false = 只在还空着时填
     */
    async function fillPrice(force) {
        const picked = recPicker ? recPicker.getFirst() : null;
        const input = document.getElementById('recPrice');
        if (!picked || !picked.code || !input) {
            return;
        }
        if (!force && String(input.value).trim() !== '') {
            return;
        }
        const r = await get('/api/account/price?accountId=' + curId + '&code=' + encodeURIComponent(picked.code));
        if (r && r.success && r.data && r.data.price != null) {
            input.value = r.data.price;
        }
    }

    /* ============ 初始化 ============ */

    (async function init() {
        await loadMode();
        if (!(await requireLogin())) {
            return;
        }
        const lr = await get('/api/account/limits');
        if (lr && lr.success) {
            limits = lr.data;
        }
        await openList();
    })();
</script>
</body>
</html>
