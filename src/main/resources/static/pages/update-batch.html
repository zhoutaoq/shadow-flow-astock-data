<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>try{var t=localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){var h=new Date().getHours();t=(h>=6&&h<18)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <title>批量更新 - 金牛数据</title>
    <link rel="stylesheet" href="/css/common.css?v=20260915b">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">金牛数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <section class="panel">
        <h2>1. 选择股票</h2>
        <div class="form-row">
            <div class="field grow">
                <label>搜索并添加股票</label>
                <div id="quickPick"></div>
                <div class="sp-hint">输入代码或名称，从匹配结果里<b>点选</b>加入（只显示前 10 条）；已选会同步到下方列表</div>
            </div>
        </div>
        <div style="overflow:auto;max-height:360px;border:1px solid var(--border);border-radius:6px">
            <table class="grid">
                <thead>
                <tr>
                    <th style="width:44px"><input type="checkbox" id="ckAll" onchange="toggleAll(this.checked)"></th>
                    <th>股票代码</th>
                    <th>股票名称</th>
                    <th>已有K线数</th>
                </tr>
                </thead>
                <tbody id="stockBody"></tbody>
            </table>
        </div>
        <div class="pager" id="stockPager"></div>
        <div class="form-row" style="margin-top:10px">
            <div class="field grow">
                <label>在列表中搜索（代码/名称）</label>
                <input type="text" id="fKeyword" placeholder="输入后回车搜索" onkeydown="if(event.key==='Enter')searchStocks()">
            </div>
            <button onclick="searchStocks()">搜索</button>
            <button class="btn-ghost" onclick="selectPage(true)">全选当前页</button>
            <button class="btn-ghost" onclick="selectPage(false)">取消当前页</button>
            <button class="btn-ghost" onclick="clearSelected()">清空已选</button>
            <span class="dim">已选 <b id="selCount">0</b> 只</span>
        </div>
    </section>

    <section class="panel">
        <h2>2. 日期范围与执行</h2>
        <div class="form-row">
            <div class="field">
                <label>开始日期 *</label>
                <input type="date" id="fStart">
            </div>
            <div class="field">
                <label>结束日期 *</label>
                <input type="date" id="fEnd">
            </div>
            <button class="btn-ghost" onclick="setRange(30)">近30天</button>
            <button class="btn-ghost" onclick="setRange(365)">近1年</button>
        </div>
        <div class="form-row">
            <button class="btn-warn" onclick="run(true)" id="btnDry">预览：只请求并渲染，不入库</button>
            <button onclick="run(false)" id="btnRun">批量更新并入库</button>
            <span class="dim">⚠️ 接口按次计费：预计调用次数 = 已选只数，超过 <b>20 只</b>会先弹二次确认</span>
        </div>
        <div id="progress" style="display:none;margin-top:10px">
            <div style="height:6px;background:#1b2233;border-radius:3px;overflow:hidden">
                <div id="progressBar" style="height:100%;width:0;background:var(--primary);transition:width .2s"></div>
            </div>
            <div class="dim" id="progressText" style="margin-top:4px"></div>
        </div>
    </section>

    <section class="panel">
        <h2>执行结果</h2>
        <div id="summary"></div>
    </section>

    <section class="panel">
        <h2>各股票明细</h2>
        <div style="overflow:auto">
            <table class="grid">
                <thead>
                <tr>
                    <th>代码</th>
                    <th class="num">接口返回条数</th>
                    <th class="num">入库条数</th>
                    <th>状态</th>
                    <th>说明</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </section>

    <section class="panel">
        <h2>同步到的数据明细</h2>
        <div style="overflow:auto;max-height:420px">
            <table class="grid">
                <thead>
                <tr>
                    <th>代码</th>
                    <th>交易日</th>
                    <th class="num">开</th>
                    <th class="num">收</th>
                    <th class="num">高</th>
                    <th class="num">低</th>
                    <th class="num">涨跌</th>
                    <th class="num">成交量</th>
                    <th class="num">成交额</th>
                </tr>
                </thead>
                <tbody id="rowBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="/js/common.js?v=20260915b"></script>
<script src="/js/date-picker.js?v=20260915b"></script>
<script src="/js/stock-picker.js?v=20260915b"></script>
<script>
    const state = {page: 1, size: 20, total: 0, rows: [], selected: new Set(), coverage: {}, nameOf: {}};

    document.getElementById('fStart').value = daysAgo(30);
    document.getElementById('fEnd').value = today();

    // 多选选择器：点选即加入已选，已选标签与下方列表的勾选保持双向同步
    const quickPick = createStockPicker(document.getElementById('quickPick'), {
        multiple: true,
        onChange: () => {
            quickPick.getItems().forEach(it => { if (it.name) state.nameOf[it.code] = it.name; });
            state.selected = new Set(quickPick.getCodes());
            syncChecks();
            updateSelCount();
        }
    });

    function setRange(n) {
        document.getElementById('fStart').value = daysAgo(n);
        document.getElementById('fEnd').value = today();
    }

    /** 勾选框 ← 已选集合 */
    function syncChecks() {
        document.querySelectorAll('.ck').forEach(c => c.checked = state.selected.has(c.value));
    }

    /** 已选标签 ← 已选集合（setItems 不触发 onChange，不会来回循环） */
    function syncPicker() {
        quickPick.setItems(Array.from(state.selected).map(c => ({code: c, name: state.nameOf[c] || ''})));
    }

    async function loadStocks() {
        const kw = document.getElementById('fKeyword').value.trim();
        const q = [`page=${state.page}`, `size=${state.size}`, 'market=stock'];
        if (kw) q.push('keyword=' + encodeURIComponent(kw));
        const r = await get('/api/stocks?' + q.join('&'));
        if (!r.success) return;
        state.rows = r.data.rows;
        state.total = r.data.total;
        state.rows.forEach(x => state.nameOf[x.stockCode] = x.stockName);

        document.getElementById('stockBody').innerHTML = state.rows.length ? state.rows.map(x => `
            <tr>
                <td><input type="checkbox" class="ck" value="${esc(x.stockCode)}"
                    ${state.selected.has(x.stockCode) ? 'checked' : ''} onchange="onCk(this)"></td>
                <td><b>${esc(x.stockCode)}</b></td>
                <td>${esc(x.stockName)}</td>
                <td class="num">${state.coverage[x.stockCode] || 0}</td>
            </tr>`).join('')
            : '<tr><td colspan="4" class="empty">股票列表为空，请先到「股票列表管理」导入股票列表</td></tr>';

        renderPager(document.getElementById('stockPager'), r.data.page, r.data.size, r.data.total, p => {
            state.page = p;
            loadStocks();
        });
        syncChecks();
        updateSelCount();
    }

    async function loadCoverage() {
        const r = await get('/api/klines/coverage');
        if (r && r.success) state.coverage = r.data;
    }

    function searchStocks() {
        state.page = 1;
        loadStocks();
    }

    function onCk(el) {
        if (el.checked) state.selected.add(el.value);
        else state.selected.delete(el.value);
        syncPicker();
        updateSelCount();
    }

    function toggleAll(checked) {
        state.rows.forEach(x => checked ? state.selected.add(x.stockCode) : state.selected.delete(x.stockCode));
        document.querySelectorAll('.ck').forEach(c => c.checked = checked);
        syncPicker();
        updateSelCount();
    }

    function selectPage(add) {
        state.rows.forEach(x => add ? state.selected.add(x.stockCode) : state.selected.delete(x.stockCode));
        document.querySelectorAll('.ck').forEach(c => c.checked = add);
        syncPicker();
        updateSelCount();
    }

    function clearSelected() {
        state.selected.clear();
        quickPick.clear();
        updateSelCount();
    }

    function updateSelCount() {
        document.getElementById('selCount').textContent = state.selected.size;
    }

    async function run(dryRun) {
        const codes = Array.from(state.selected);
        if (!codes.length) {
            toast('请至少选择一只股票：可上方搜索点选，或在下方列表里勾选', 'err');
            return;
        }
        const startDate = document.getElementById('fStart').value;
        const endDate = document.getElementById('fEnd').value;
        if (!startDate || !endDate) {
            toast('请填写开始日期和结束日期', 'err');
            return;
        }
        if (!confirmApiCost(codes.length)) return;

        document.getElementById('btnDry').disabled = true;
        document.getElementById('btnRun').disabled = true;
        document.getElementById('progress').style.display = 'block';
        document.getElementById('progressBar').style.width = '10%';
        document.getElementById('progressText').innerHTML =
            `<span class="spinner"></span> 正在更新 ${codes.length} 只股票...`;

        try {
            const r = await post('/api/fetch', {
                codes, market: 'stock', startDate, endDate, dryRun
            });
            document.getElementById('progressBar').style.width = '100%';
            if (r.success) {
                render(r.data);
                document.getElementById('progressText').textContent =
                    `完成：${r.data.codeCount} 只股票，返回 ${r.data.fetchedTotal} 条，`
                    + `入库 ${r.data.persistedTotal} 条，失败 ${r.data.failedCount} 只，耗时 ${r.data.costMs} ms`;
                loadCoverage().then(loadStocks);
            } else {
                document.getElementById('progressText').textContent = '执行失败: ' + r.message;
            }
        } finally {
            document.getElementById('btnDry').disabled = false;
            document.getElementById('btnRun').disabled = false;
        }
    }

    function render(result) {
        const modeText = result.dryRun
            ? '<span class="badge">预览模式（未入库）</span>'
            : '<span class="badge badge-ok">已入库（同一股票 + 交易日覆盖更新）</span>';
        document.getElementById('summary').innerHTML = `
            <table class="kv">
                <tr><th>执行模式</th><td>${modeText}</td></tr>
                <tr><th>股票只数</th><td><b>${result.codeCount}</b></td></tr>
                <tr><th>接口返回总条数</th><td><b>${result.fetchedTotal}</b></td></tr>
                <tr><th>入库总条数</th><td><b>${result.persistedTotal}</b></td></tr>
                <tr><th>失败只数</th><td>${result.failedCount > 0
                    ? '<span class="badge badge-err">' + result.failedCount + '</span>'
                    : '<span class="badge badge-ok">0</span>'}</td></tr>
                <tr><th>耗时</th><td>${result.costMs} ms</td></tr>
            </table>`;

        document.getElementById('tbody').innerHTML = result.details.map(d => `
            <tr>
                <td><b>${esc(d.code)}</b></td>
                <td class="num">${d.fetched}</td>
                <td class="num">${d.persisted}</td>
                <td>${d.success ? '<span class="badge badge-ok">成功</span>'
                    : '<span class="badge badge-err">失败</span>'}</td>
                <td class="dim">${esc(d.message || '')}</td>
            </tr>`).join('');

        const allRows = [];
        result.details.forEach(d => (d.rows || []).forEach(x => allRows.push(x)));
        allRows.sort((a, b) => (a.code + a.tradeDate).localeCompare(b.code + b.tradeDate));
        document.getElementById('rowBody').innerHTML = allRows.length ? allRows.map(x => {
            const pc = x.preClose != null ? Number(x.preClose) : null;
            const c = x.closePrice != null ? Number(x.closePrice) : null;
            let chg = '-', cls = '';
            if (pc && c != null) {
                const pct = (c - pc) / pc * 100;
                chg = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
                cls = pct >= 0 ? 'up' : 'down';
            }
            return `<tr>
                <td><b>${esc(x.code)}</b></td>
                <td>${esc(x.tradeDate)}</td>
                <td class="num">${fmtNum(x.openPrice)}</td>
                <td class="num">${fmtNum(x.closePrice)}</td>
                <td class="num">${fmtNum(x.highPrice)}</td>
                <td class="num">${fmtNum(x.lowPrice)}</td>
                <td class="num ${cls}">${chg}</td>
                <td class="num">${fmtVol(x.volume)}</td>
                <td class="num">${fmtVol(x.amount)}</td>
            </tr>`;
        }).join('') : '<tr><td colspan="9" class="empty">无数据</td></tr>';
    }

    loadCoverage().then(loadStocks);
</script>
</body>
</html>
