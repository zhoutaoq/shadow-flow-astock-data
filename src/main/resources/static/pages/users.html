<script src="/js/common.js?v=20260916b"></script>
<script>
    var page = 1, size = 20, keyword = '';

    async function loadUsers(p) {
        page = p || page;
        var r = await get('/api/admin/users?page=' + page + '&size=' + size
            + '&keyword=' + encodeURIComponent(keyword));
        if (!r || !r.success) {
            return;
        }
        var data = r.data || {rows: [], total: 0};
        renderUsers(data);
    }

    function renderUsers(data) {
        var rows = data.rows || [];
        var body = document.getElementById('uBody');
        document.getElementById('uCount').textContent = '共 ' + (data.total || 0) + ' 个账号';
        if (!rows.length) {
            body.innerHTML = '<tr><td class="empty" colspan="7">没有匹配的账号</td></tr>';
        } else {
            body.innerHTML = rows.map(function (u) {
                var mine = ME.user && ME.user.id === u.id;
                return '<tr>'
                    + '<td class="u-time">' + u.id + '</td>'
                    + '<td><span class="u-user"><span class="u-avatar">'
                    + esc((u.username || '?').charAt(0)) + '</span>'
                    + esc(u.username) + (mine ? '<span class="u-me">当前账号</span>' : '')
                    + '</span></td>'
                    + '<td><span class="u-role' + (u.admin ? ' admin' : '') + '">'
                    + (u.admin ? '超管' : '成员') + '</span></td>'
                    + '<td><span class="u-state' + (u.enabled ? '' : ' off') + '">'
                    + '<i class="u-dot"></i>' + (u.enabled ? '正常' : '已停用') + '</span></td>'
                    + '<td class="u-time">' + esc(u.createTime || '—') + '</td>'
                    + '<td class="u-time">' + esc(u.lastLoginTime || '—') + '</td>'
                    + '<td class="u-ops">'
                    + '<button class="btn-sm btn-ghost" onclick="openReset(' + u.id
                    + ',\'' + esc(u.username) + '\')">重置密码</button>'
                    + (u.admin ? ''
                        : '<button class="btn-sm btn-ghost" onclick="impersonate(' + u.id
                          + ',\'' + esc(u.username) + '\')">代理登录</button>')
                    + '</td>'
                    + '</tr>';
            }).join('');
        }
        renderPager(document.getElementById('uPager'), data.page || 1, data.size || size,
            data.total || 0, loadUsers);
    }

    function searchUsers() {
        keyword = document.getElementById('fKw').value.trim();
        loadUsers(1);
    }

    function resetKw() {
        document.getElementById('fKw').value = '';
        keyword = '';
        loadUsers(1);
    }

    /** 重置密码弹窗：新密码规则与注册一致 */
    var resetId = 0;
    function openReset(id, username) {
        resetId = id;
        var mask = document.getElementById('resetMask');
        if (!mask) {
            mask = document.createElement('div');
            mask.className = 'mask';
            mask.id = 'resetMask';
            mask.innerHTML = '<div class="modal modal-auth">'
                + '<div class="auth-head">'
                + '<span class="auth-brand"><span class="mark">' + ICON.pwd + '</span>重置密码</span>'
                + '<span class="auth-sub" id="resetWho"></span>'
                + '</div>'
                + '<div class="auth-alert" id="resetErr">' + ICON.err + '<span id="resetErrTxt"></span></div>'
                + '<div class="auth-field"><label for="resetPwd">新密码</label>'
                + '<div class="auth-input-wrap has-toggle">'
                + '<input type="password" id="resetPwd" autocomplete="new-password">'
                + '<button class="auth-eye" type="button" data-for="resetPwd" aria-label="显示密码">' + ICON.eye + '</button>'
                + '</div></div>'
                + '<div class="auth-field"><label for="resetPwd2">确认新密码</label>'
                + '<div class="auth-input-wrap has-toggle">'
                + '<input type="password" id="resetPwd2" autocomplete="new-password">'
                + '<button class="auth-eye" type="button" data-for="resetPwd2" aria-label="显示密码">' + ICON.eye + '</button>'
                + '</div></div>'
                + '<button class="auth-submit" id="resetSave" type="button">保存新密码</button>'
                + '</div>';
            document.body.appendChild(mask);
            var hide = function () { mask.classList.remove('show'); };
            mask.querySelectorAll('.auth-eye').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var input = mask.querySelector('#' + btn.getAttribute('data-for'));
                    var show = input.type === 'password';
                    input.type = show ? 'text' : 'password';
                    btn.innerHTML = show ? ICON.eyeOff : ICON.eye;
                });
            });
            mask.addEventListener('mousedown', function (e) { if (e.target === mask) hide(); });
            mask.querySelector('#resetSave').addEventListener('click', submitReset);
            ['resetPwd', 'resetPwd2'].forEach(function (id2) {
                mask.querySelector('#' + id2).addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        submitReset();
                    }
                });
            });
        }
        mask.querySelector('#resetWho').textContent = '为 ' + username + ' 设置一个新密码';
        mask.querySelector('#resetPwd').value = '';
        mask.querySelector('#resetPwd2').value = '';
        mask.querySelector('#resetPwd').type = 'password';
        mask.querySelector('#resetPwd2').type = 'password';
        mask.querySelectorAll('.auth-eye').forEach(function (b) { b.innerHTML = ICON.eye; });
        setResetError('');
        mask.classList.add('show');
        setTimeout(function () { mask.querySelector('#resetPwd').focus(); }, 60);
    }

    function setResetError(text) {
        var mask = document.getElementById('resetMask');
        mask.querySelector('#resetErrTxt').textContent = text || '';
        mask.querySelector('#resetErr').classList.toggle('show', !!text);
    }

    async function submitReset() {
        var mask = document.getElementById('resetMask');
        var pwd = mask.querySelector('#resetPwd').value.trim();
        var pwd2 = mask.querySelector('#resetPwd2').value.trim();
        var min = (ME.rules && ME.rules.minPasswordLength) || 6;
        if (pwd.length < min) {
            setResetError('密码至少 ' + min + ' 位');
            return;
        }
        if (!/[A-Za-z]/.test(pwd) || !/\d/.test(pwd)) {
            setResetError('密码需要同时包含字母和数字');
            return;
        }
        if (pwd !== pwd2) {
            setResetError('两次输入的密码不一致');
            return;
        }
        setResetError('');
        var btn = mask.querySelector('#resetSave');
        btn.classList.add('loading');
        btn.innerHTML = '<span class="auth-spin"></span>保存中…';
        try {
            var r = await put('/api/admin/users/' + resetId + '/password', {password: pwd});
            if (!r || !r.success) {
                setResetError((r && r.message) || '重置失败，请稍后再试');
                return;
            }
            mask.classList.remove('show');
            toast('密码已重置', 'ok');
        } finally {
            btn.classList.remove('loading');
            btn.textContent = '保存新密码';
        }
    }

    /**
     * 代理登录：以指定用户的身份继续操作，用来查看/处理该用户自己的那份数据。
     *
     * <p>换的是本地令牌，所以换完直接回首页 —— 顶栏会挂出「已切换到 xxx」的提示，
     * 随时可以点它退回来。
     */
    async function impersonate(id, username) {
        if (!confirm('以 ' + username + ' 的身份继续操作？随时可以从顶栏退出代理登录。')) {
            return;
        }
        var r = await post('/api/admin/users/' + id + '/impersonate', {});
        if (!r || !r.success) {
            return;
        }
        var token = r.data && r.data.token;
        if (!token) {
            return toast('切换失败，请重试', 'err');
        }
        setAuthToken(token);
        location.href = '/';
    }

    document.getElementById('fKw').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            searchUsers();
        }
    });

    (async function init() {
        var ok = await requireLogin();
        if (!ok) {
            return;
        }
        if (!isAdmin()) {
            document.getElementById('mainPanel').style.display = 'none';
            document.getElementById('denyPanel').style.display = '';
            document.getElementById('denyMsg').textContent =
                '只有超管能进用户管理，当前账号是 ' + (ME.user && ME.user.username) + '。';
            return;
        }
        document.getElementById('mainPanel').style.display = '';
        await loadUsers(1);
    })();
</script>
