<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>try{var t=localStorage.getItem("jn_theme");if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <title>系统配置</title>
    <link rel="stylesheet" href="/css/common.css?v=20260912h">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">金牛数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <!-- 无数据库模式：没有配置表，整页就是一个令牌输入框 -->
    <section class="panel" id="tokenPanel" style="display:none">
        <h2 style="margin:0 0 12px">数据接口令牌</h2>
        <div class="form-row">
            <div class="field grow">
                <label>新令牌</label>
                <input type="password" id="fToken" autocomplete="off" spellcheck="false"
                       placeholder="粘贴新的令牌">
            </div>
            <button onclick="saveToken()" id="btnSave">保存</button>
            <button class="btn-ghost" onclick="resetToDefault()">恢复默认令牌</button>
        </div>
        <div class="sp-hint" id="tokenState"></div>
    </section>

    <section class="panel" id="tablePanel">
        <h2 style="margin:0 0 4px">配置变量</h2>
        <div class="form-row">
            <button onclick="openEdit(null)">新增配置</button>
            <button class="btn-ghost" onclick="reload()">从数据库重载</button>
        </div>
        <div style="overflow:auto;max-height:620px;margin-top:10px">
            <table class="grid">
                <thead>
                <tr>
                    <th style="width:60px">ID</th>
                    <th style="width:140px">场景</th>
                    <th style="width:160px">配置键</th>
                    <th>配置值</th>
                    <th style="width:200px">备注</th>
                    <th style="width:150px">更新时间</th>
                    <th style="width:130px">操作</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </section>

</main>

<!-- 新增/编辑弹窗 -->
<div class="mask" id="editMask">
    <div class="modal">
        <h3 id="editTitle">新增配置</h3>
        <div class="field">
            <label>场景 *</label>
            <input type="text" id="eScene" placeholder="waizao">
        </div>
        <div class="field">
            <label>配置键 *</label>
            <input type="text" id="eKey" placeholder="token">
        </div>
        <div class="field">
            <label>配置值</label>
            <input type="text" id="eValue" autocomplete="off">
            <div class="sp-hint" id="eValueHint"></div>
        </div>
        <div class="field">
            <label>备注</label>
            <input type="text" id="eRemark">
        </div>
        <div class="modal-actions">
            <button class="btn-ghost" onclick="closeEdit()">取消</button>
            <button onclick="submitEdit()">保存并生效</button>
        </div>
    </div>
</div>

<script src="/js/common.js?v=20260912h"></script>
<script src="/js/date-picker.js?v=20260912h"></script>
<script>
    /** 需要遮蔽显示的键：值里是令牌/口令 */
    function isSecretKey(key) {
        const k = (key || '').toLowerCase();
        return k.includes('token') || k.includes('secret') || k.includes('password')
            || k.includes('passwd') || k.includes('pwd') || k.includes('key');
    }

    function maskValue(v) {
        if (!v) return '';
        return v.length <= 8 ? '****' : v.slice(0, 4) + '****' + v.slice(-4);
    }

    let rows = [];

    async function load() {
        const r = await get('/api/sys-config');
        if (!r.success) return;
        rows = r.data || [];
        render();
    }

    function render() {
        const tbody = document.getElementById('tbody');
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无配置</td></tr>';
            return;
        }
        tbody.innerHTML = rows.map(x => {
            const secret = isSecretKey(x.configKey);
            const shown = secret ? maskValue(x.configValue) : (x.configValue || '');
            return `
                <tr>
                    <td class="dim">${x.id}</td>
                    <td><b>${esc(x.configScene)}</b></td>
                    <td>${esc(x.configKey)}</td>
                    <td>${secret
                        ? `<span data-masked="${esc(maskValue(x.configValue))}" data-real="${esc(x.configValue || '')}">${esc(maskValue(x.configValue))}</span>
                           <button class="btn-sm btn-ghost" onclick="toggleValue(this)">显示</button>`
                        : esc(x.configValue || '')}</td>
                    <td class="dim">${esc(x.remark || '')}</td>
                    <td class="dim">${esc(x.updateTime || '')}</td>
                    <td>
                        <button class="btn-sm btn-ghost" onclick="openEdit(${x.id})">编辑</button>
                        <button class="btn-sm btn-ghost" onclick="removeCfg(${x.id})">删除</button>
                    </td>
                </tr>`;
        }).join('');
    }

    function toggleValue(btn) {
        const span = btn.previousElementSibling;
        const showing = btn.textContent === '显示';
        span.textContent = showing ? span.getAttribute('data-real') : span.getAttribute('data-masked');
        btn.textContent = showing ? '隐藏' : '显示';
    }

    function openEdit(id) {
        const item = id ? rows.find(x => x.id === id) : null;
        document.getElementById('editTitle').textContent = item ? '编辑配置' : '新增配置';
        document.getElementById('eScene').value = item ? item.configScene : 'waizao';
        document.getElementById('eKey').value = item ? item.configKey : '';
        document.getElementById('eValue').value = item ? (item.configValue || '') : '';
        document.getElementById('eRemark').value = item ? (item.remark || '') : '';
        // 编辑时场景与键是定位条件，改了等于新增另一条
        document.getElementById('eScene').disabled = !!item;
        document.getElementById('eKey').disabled = !!item;
        document.getElementById('eValueHint').textContent = item
            ? '留空表示清空该配置值'
            : '';
        document.getElementById('editMask').classList.add('show');
    }

    function closeEdit() {
        document.getElementById('editMask').classList.remove('show');
    }

    async function submitEdit() {
        const body = {
            configScene: document.getElementById('eScene').value.trim(),
            configKey: document.getElementById('eKey').value.trim(),
            configValue: document.getElementById('eValue').value,
            remark: document.getElementById('eRemark').value.trim()
        };
        if (!body.configScene || !body.configKey) {
            toast('场景与配置键都不能为空', 'err');
            return;
        }
        const r = await post('/api/sys-config', body);
        if (!r.success) return;
        toast(r.message, 'ok');
        closeEdit();
        await load();
    }

    async function removeCfg(id) {
        const item = rows.find(x => x.id === id);
        if (!confirm(`确认删除配置 ${item ? item.configScene + '/' + item.configKey : id} ？删除后相关功能会取不到值`)) {
            return;
        }
        const r = await del('/api/sys-config/' + id);
        if (!r.success) return;
        toast(r.message, 'ok');
        await load();
    }

    async function reload() {
        const r = await post('/api/sys-config/reload', {});
        if (!r.success) return;
        rows = r.data || [];
        render();
        toast(r.message, 'ok');
    }

    document.getElementById('editMask').addEventListener('click', e => {
        if (e.target.id === 'editMask') closeEdit();
    });

    // ============ 无数据库模式：默认令牌开箱即用，内容不支持查看 ============

    function renderTokenState() {
        document.getElementById('tokenState').innerHTML = hasCustomWaizaoToken()
            ? '当前：<b>自定义令牌</b>（有效期 30 天）'
            : '当前：<b>系统内置令牌</b>';
    }

    function saveToken() {
        const v = document.getElementById('fToken').value.trim();
        if (!v) {
            return toast('先粘贴一个令牌再保存', 'err');
        }
        setWaizaoToken(v);
        document.getElementById('fToken').value = '';
        renderTokenState();
        toast('令牌已更新', 'ok');
    }

    /** 清掉本机自定义值，立即回到内置默认令牌（默认令牌恒存在，不会再弹填写框） */
    function resetToDefault() {
        if (hasCustomWaizaoToken() && !confirm('恢复后将使用系统内置令牌，确认？')) return;
        setWaizaoToken('');
        document.getElementById('fToken').value = '';
        renderTokenState();
        toast('已恢复为系统内置令牌', 'ok');
    }

    (async function init() {
        await loadMode();
        if (MODE.noDb) {
            // 配置表在这个模式下根本不存在，别去调接口也别显示表格
            document.getElementById('tablePanel').style.display = 'none';
            document.getElementById('tokenPanel').style.display = '';
            renderTokenState();
            return;
        }
        load();
    })();
</script>
</body>
</html>
