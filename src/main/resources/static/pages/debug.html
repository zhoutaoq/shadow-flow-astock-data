<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>接口调试 - 金牛数据</title>
    <link rel="stylesheet" href="/css/common.css?v=20260910a">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">金牛数据</a>
    <nav class="nav" id="nav"></nav>
</header>

<main class="container">
    <div id="msgBox" class="msg"></div>

    <section class="panel">
        <h2>供应商日K线接口调试 <span class="dim" style="font-weight:400;font-size:12px">· 每次请求都计费，调用记为「调试」；是否落盘由下方开关控制</span></h2>
        <div class="form-row">
            <div class="field grow">
                <label>股票 *</label>
                <div id="codePick"></div>
                <div class="sp-hint">输入代码或名称，从匹配结果里<b>点选一只</b>（只显示前 10 条）</div>
            </div>
            <div class="field">
                <label>symbol</label>
                <input type="text" value="stock" readonly title="系统只关注沪深A股，symbol 固定为 stock">
            </div>
            <div class="field">
                <label>period</label>
                <input type="text" value="1d" readonly>
            </div>
            <div class="field">
                <label>dividend</label>
                <input type="text" value="1" readonly>
            </div>
            <div class="field">
                <label>开始日期 *</label>
                <input type="date" id="fStart">
            </div>
            <div class="field">
                <label>结束日期 *</label>
                <input type="date" id="fEnd">
            </div>
            <button onclick="call1()" id="btnCall">发送请求</button>
            <button class="btn-ghost" id="btnPersist" onclick="togglePersist()"
                    title="开：把解析结果写入日K线数据表（同一股票+交易日覆盖）；关：只渲染不落盘">落盘：关</button>
            <button class="btn-ghost" onclick="curlText()">生成 curl</button>
        </div>
        <div id="urlBox" class="dim" style="word-break:break-all;font-size:12px"></div>
    </section>

    <section class="panel">
        <h2>请求 URL</h2>
        <pre class="json" id="reqUrl">（执行后显示）</pre>
    </section>

    <section class="panel">
        <h2>接口原始返回内容</h2>
        <pre class="json" id="rawBody">（执行后显示）</pre>
    </section>

    <section class="panel">
        <h2>解析后的结构化结果 <span id="statBox" class="dim" style="font-weight:400;font-size:12px"></span></h2>
        <div class="dim" style="font-size:12px;margin-bottom:6px">括号内为接口返回的原始字段名</div>
        <div style="overflow:auto">
            <table class="grid">
                <thead>
                <tr>
                    <th>交易日（t）</th><th>代码</th>
                    <th class="num">开盘（o）</th><th class="num">收盘（c）</th>
                    <th class="num">最高（h）</th><th class="num">最低（l）</th>
                    <th class="num">成交量（v）</th><th class="num">成交额（a）</th>
                    <th class="num">前收（pc）</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="/js/common.js?v=20260910a"></script>
<script src="/js/date-picker.js"></script>
<script src="/js/stock-picker.js"></script>
<script>
    document.getElementById('fStart').value = daysAgo(30);
    document.getElementById('fEnd').value = today();

    // 落盘开关：默认关闭（只请求、只渲染，接口按次计费，避免误写库）
    let persist = false;

    const codePicker = createStockPicker(document.getElementById('codePick'), {});

    function togglePersist() {
        persist = !persist;
        const btn = document.getElementById('btnPersist');
        btn.textContent = '落盘：' + (persist ? '开' : '关');
        btn.className = persist ? 'btn-danger' : 'btn-ghost';
        toast(persist
            ? '已开启落盘：本次结果将写入日K线数据表（同一股票 + 交易日覆盖）'
            : '已关闭落盘：只渲染，不写库', persist ? 'err' : 'info');
    }

    function params() {
        const picked = codePicker.getFirst();
        return {
            code: codePicker.getCodes()[0] || '',
            name: picked ? picked.name : '',
            // 系统只关注沪深A股，供应商的 symbol 固定 stock
            market: 'stock',
            startDate: document.getElementById('fStart').value,
            endDate: document.getElementById('fEnd').value
        };
    }

    async function call1() {
        if (!requireStock(codePicker, '一只股票')) return;
        const p = params();
        const q = `code=${encodeURIComponent(p.code)}&market=${encodeURIComponent(p.market)}`
            + `&startDate=${p.startDate}&endDate=${p.endDate}&persist=${persist}`;
        document.getElementById('urlBox').innerHTML = '<span class="spinner"></span> 请求中...';
        const r = await get('/api/fetch/raw?' + q);
        document.getElementById('urlBox').textContent = '';
        if (!r.success) return;

        document.getElementById('reqUrl').textContent = r.data.requestUrl;
        document.getElementById('rawBody').textContent = r.data.responseBody;

        const rows = r.data.parsed || [];
        document.getElementById('statBox').textContent = r.data.persist
            ? `解析 ${rows.length} 行，已落盘 ${r.data.persisted} 条`
            : `解析 ${rows.length} 行，未落盘（落盘开关关闭）`;
        document.getElementById('tbody').innerHTML = rows.length ? rows.map(x => `
            <tr>
                <td>${esc(x.tradeDate)}</td>
                <td><b>${esc(x.code)}</b></td>
                <td class="num">${fmtNum(x.openPrice)}</td>
                <td class="num">${fmtNum(x.closePrice)}</td>
                <td class="num">${fmtNum(x.highPrice)}</td>
                <td class="num">${fmtNum(x.lowPrice)}</td>
                <td class="num">${fmtVol(x.volume)}</td>
                <td class="num">${fmtVol(x.amount)}</td>
                <td class="num">${fmtNum(x.preClose)}</td>
            </tr>`).join('')
            : '<tr><td colspan="9" class="empty">接口返回空数组（区间内无交易数据）</td></tr>';
    }

    (async function initFromQuery() {
        const p = new URLSearchParams(location.search);
        if (p.get('code')) await codePicker.pickByCode(p.get('code'));
    })();

    // 令牌维护在「系统配置」页（配置表 waizao/token），页面不留明文；生成 curl 时取一次
    // 接口根地址来自配置文件，页面不回显，用默认值兜底
    let apiToken = '';
    (async function loadApiCfg() {
        const r = await get('/api/sys-config/waizao/token');
        if (r.success) apiToken = r.data || '';
    })();

    function curlText() {
        const p = params();
        const base = 'http://api.waizaowang.com';
        const url = `${base}/market/c/daykline?symbol=${p.market}&code=${p.code}`
            + `&period=1d&dividend=1&startDate=${p.startDate}&endDate=${p.endDate}`
            + `&token=${apiToken || '<系统配置页维护的 token>'}`;
        const cmd = `curl --url '${url}' \\\n`
            + `  -H 'Accept: application/json, text/plain, */*' \\\n`
            + `  -H 'Origin: http://www.waizaowang.com' \\\n`
            + `  -H 'Referer: http://www.waizaowang.com/' \\\n`
            + `  --compressed --insecure`;
        document.getElementById('reqUrl').textContent = cmd;
        toast('已生成 curl（注意需 --compressed 解压 gzip 响应）', 'info');
    }
</script>
</body>
</html>
